[Language_en]
Name=Smart Windows
Description=Smarter game windows: remembers position, size and maximized state of selected windows (Unit Status, Tactical Display, World View and others), lets you drag windows partly off-screen, maximize with a double-click on the title, brings a clicked window to the front, reopens mission windows as you left them, opens further windows of one kind slightly shifted, draws a thin frame around draggable windows and improves the Unit Reference window. All settings are in a window opened with the gear button in the title bar of a remembered window. Requires BepInEx 5 and Anchor Chain. Settings: BepInEx/config/com.rgreat.seapower.smartwindows.cfg. Hover a window and press F12 to add it to the list.

[Language_ru]
Name=Умные окна
Description=Умные окна игры: запоминает положение, размер и развёрнутость выбранных окон (Unit Status, Tactical Display, World View и других), позволяет частично выносить окна за границы экрана, разворачивать их двойным щелчком по заголовку, поднимает окно наверх по клику, открывает окна миссии так, как они были оставлены, открывает следующие окна одного вида со смещением, рисует тонкую рамку вокруг перетаскиваемых окон и улучшает окно Unit Reference. Все настройки — в окне, которое открывает кнопка-шестерёнка в заголовке запоминаемого окна. Нужны BepInEx 5 и Anchor Chain. Настройки: BepInEx/config/com.rgreat.seapower.smartwindows.cfg. Наведите курсор на окно и нажмите F12, чтобы добавить его в список.

