[Language_en]
Name=Smart Windows
Description=Smarter game windows: remembers position and size of selected windows (Unit Status, Tactical Display, World View and others) and restores them when a window is reopened, and lets you drag windows partly off-screen. Requires BepInEx 5 and Anchor Chain. Settings: BepInEx/config/com.rgreat.seapower.smartwindows.cfg. Hover a window and press F12 to add it to the list.

[Language_ru]
Name=Умные окна
Description=Умные окна игры: запоминает положение и размер выбранных окон (Unit Status, Tactical Display, World View и других) и восстанавливает их при повторном открытии, а также позволяет частично выносить окна за границы экрана. Нужны BepInEx 5 и Anchor Chain. Настройки: BepInEx/config/com.rgreat.seapower.smartwindows.cfg. Наведите курсор на окно и нажмите F12, чтобы добавить его в список.

[Compatibility]
ApproximateVersion=0.8.4
