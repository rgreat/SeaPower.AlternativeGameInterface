look.monitor = モニター
look.level.top = 最前面
look.outline.tip = 透明ウィンドウの文字を読みやすく保ちます。灰色の文字は純白か純黒になり縁取りが付き、明るい背景ではすべての文字が暗くなります（明度はウィンドウの下に表示されているものの明るさに追従し、色相は保たれます）。不透明度が 50% を下回ると自動で有効になり、変更もできます。
tab.Desktop mode = デスクトップモード
tab.Tactical Display = Tactical Display
lbl.General/ResizeDockedWindows = ドッキングしたウィンドウのリサイズ
unit.General/ResizeDockedWindows = 画面端で判定が内側に入る
help.General/ResizeDockedWindows = 画面の端(またはミッションHUDの下部バー)にドッキングしたウィンドウは、見えないリサイズ領域が画面の外にあり、マウスでその端をつかめません。オン: そのような端では領域がウィンドウ内側に数ピクセル入ります。
lbl.General/FixGameResizeCursors = ゲームのリサイズカーソルを修正
unit.General/FixGameResizeCursors = メニューとキャンペーン
help.General/FixGameResizeCursors = ミッション外では、ゲームはウィンドウ(News、Task Force Builder)のリサイズ端で通常の矢印を表示します。カーソルが読み込まれておらず、カーソル処理も入っていないためです。オン: Modがゲームのカーソルを読み込み、ミッションで使われる処理を組み込みます。
grp.Map = マップ
lbl.General/KeepMapView = リサイズ時にマップ表示を保持
unit.General/KeepMapView = ズームがウィンドウサイズに追従
help.General/KeepMapView = Tactical Displayウィンドウのサイズが変わると、見えていた範囲が見え続けるようにマップのズームも変わります(マップの縦横比は保たれます)。オフ: ズームは変わらず、大きいウィンドウではより広く、小さいウィンドウでは狭く表示されます。
grp.Desktop mode = デスクトップモード
lbl.General/WindowedMapAndWorldView = デスクトップモードを有効化
unit.General/WindowedMapAndWorldView = 自由に移動・サイズ変更
help.General/WindowedMapAndWorldView = デスクトップモード。Tactical DisplayとWorld Viewは、自由に移動・サイズ変更できる通常のウィンドウとしてのみ動作します(他のウィンドウと同様): 最大化として記憶されず([Layouts]に',max'なし)、常に両方表示され(ゲームはマップ全画面+World Viewの状態に一度だけ設定されます)、他のすべてのウィンドウの下に置かれ、2つの間でのみ入れ替わります。Toggle fullscreen minimapキー(既定はTab)はマップを切り替えなくなり(デスクトップを切り替えます、DesktopCount)、最大化/元に戻すボタンはウィンドウにのみ作用し、ウィンドウの背後の画面はModが消去します(この状態ではゲームは描画しません)。
lbl.General/DesktopCount = デスクトップの数
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = デスクトップモード: デスクトップの数(2 - 5)。ゲームのToggle fullscreen minimapキー(操作 - 一般、既定はTab)で切り替えます。各デスクトップは、ウィンドウの位置とサイズ、開閉、不透明度、スケール、レベル、およびWorld Viewが開いているかを保持します。デスクトップはModの組み込み配置で始まります(1: World View(3D)が上、2: Tactical Display(マップ)が上、3: マップが全画面、4: 3Dビューが全画面、5: マップと3Dビューを並べて表示)。
lbl.General/WorldViewKey = World Viewの開閉キー
unit.General/WorldViewKey = 既定はInsert
help.General/WorldViewKey = デスクトップモード: World Viewウィンドウを開閉するキー。ゲームがすでに使っているキー(操作 - その割り当て、変更したものも含む)は決して取られません。無視され、ログに記録されます。なし = キーなし。コンソール、メニュー、テキストボックスがキーボードを持っているとき、またはShift / Ctrl / Altが押されているときは何もしません。
lbl.InMission/DragTimePanel = ドラッグ可能な時間パネル
unit.InMission/DragTimePanel = ダブルクリックで隅に戻す
help.InMission/DragTimePanel = ミッションHUDの時間パネル(日付/時刻、速度、再生/一時停止)は、枠、速度のテキスト、ボタンの間をマウスでドラッグして動かせます。ダブルクリックで隅に戻ります。
grp.Task Force = 任務部隊
lbl.Campaign/DismissDamaged = 損傷した艦を解雇
unit.Campaign/DismissDamaged = 払い戻し − 修理費
help.Campaign/DismissDamaged = キャンペーンの任務部隊の状態: 修理可能な損傷した艦を解雇できます。払い戻しは修理費の分だけ減ります。
lbl.Campaign/SortLoadoutsByDate = 装備を日付順に並べる
unit.Campaign/SortLoadoutsByDate = 自艦のバージョンを先に
help.Campaign/SortLoadoutsByDate = キャンペーンの任務部隊、装備タブ: 艦自身の装備を日付順に並べ、クラスの新しいバージョンより前に表示します(ゲームは最後に表示します)。
lbl.Campaign/FixVersionSwapPrice = バージョン交換の価格を修正
unit.Campaign/FixVersionSwapPrice = 名簿の価格
help.Campaign/FixVersionSwapPrice = キャンペーンの任務部隊、装備タブ: クラスの別バージョンへの船体交換は、キャンペーンの名簿の価格で購入と同様に価格設定されます(ゲームは新しい船体にユニットのini価格、所持している艦に名簿の価格を使うため、名簿の価格が違うとアップグレードが払い戻しになっていました)。
lbl.Campaign/UpgradeShip = ビルダーに「艦をアップグレード」ボタン
unit.Campaign/UpgradeShip = 乗員 -1 レベル
help.Campaign/UpgradeShip = キャンペーンのTask Force Builder: 「艦のアップグレード」ボタンが任務部隊の艦を選択した艦に置き換えます(解雇/退役価格で売却、乗員は技能レベルが1つ下がります)。
grp.Game UI = ゲームインターフェース
lbl.Debug/DumpXaml = 今すぐXAMLを出力
unit.Debug/DumpXaml = 自動でオフになる
help.Debug/DumpXaml = 開発用: オンにすると、これまでに読み込まれたゲームのUIアセットのXAMLをBepInEx/AlternativeGameInterface_xamlに書き出し、自動でオフになります(先に必要なウィンドウを開いてください)。
grp.Track State = Track State
lbl.UnitStatus/TrackState = 選択した接触のTrack State
help.UnitStatus/TrackState = Unit Statusウィンドウ: 他勢力の接触(航跡。自軍ユニットではない)が選択されている間、ウィンドウは空のままではなく、そのTrack State(接触の情報ウィンドウ: 状態、確度、探知、シグネチャ)を表示します。

; --- new ---
tab.Event Log = イベントログ
grp.Links = リンク
lbl.EventLog/AllTracksAreLinks = ログの全接触をリンクにする
unit.EventLog/AllTracksAreLinks = 航跡番号
help.EventLog/AllTracksAreLinks = イベントログのすべての航跡番号が、ゲーム自身が作るリンクと同じようにリンクになります(新規接触、航跡の識別、航跡の消失などは、ゲームでは通常のテキストです): クリックでオブジェクトを選択し、CenterMapOnClickを使うと再クリックでマップがそこに中央寄せされます。リンクになるのはプレイヤー自身のリストの航跡のみです。
lbl.EventLog/CenterMapOnClick = 再クリックでマップを中央に
unit.EventLog/CenterMapOnClick = Tactical Display
help.EventLog/CenterMapOnClick = イベントログの同じ接触またはユニットのリンクを再度クリックすると、Tactical Displayのマップがそこに中央寄せされます(最初のクリックはゲームと同様に選択のみ)。
lbl.Camera/BinocularsBelowHorizon = 水平線より下の艦の双眼鏡
unit.Camera/BinocularsBelowHorizon = 度 · 0 = ゲーム
help.Camera/BinocularsBelowHorizon = 艦の双眼鏡(艦の光学視点): 水平線より何度下まで下げられるか(度)。ゲームでは水平線で止まります。0 = ゲームどおり。
lbl.Camera/BinocularsNormalView = 最大ズームの双眼鏡で通常ビュー
lbl.Camera/BinocularsNormalViewDayOnly = 通常ビューは昼のみ
help.Camera/BinocularsNormalView = 最大倍率の双眼鏡は通常ビューで始まります(ゲームは夜間/熱線フィルターをオンにして始めます)。ゲームのフィルターキーでフィルターがオンになります。
help.Camera/BinocularsNormalViewDayOnly = 通常ビューが既定になるのは昼のみです。夜はゲーム既定のフィルターのままです。
ref.propulsion = 推進
ref.pp.nuclear = 原子力
ref.pp.steam = 蒸気
ref.pp.gasturbine = ガスタービン
ref.pp.diesel = ディーゼル
ref.pp.electric = 電動
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = 艦のデータに推進を表示
help.UnitReference/ShowPropulsion = Unit Reference: 艦と潜水艦の主要パラメーターに、Max Speedの後ろに推進のセルを追加します: エンジンの種類と出力(主機関と補助機関)。次に表示するユニットから反映されます。
ref.propulsion.tip = 推進: エンジンの種類と出力(主機関と補助機関)
lbl.UnitStatus/DamageListsWheel = ホイールでセクション一覧をスクロール
lbl.UnitStatus/RememberTab = ユニットごとにタブを記憶
help.UnitStatus/DamageListsWheel = Unit Statusウィンドウ、Damage Controlタブ: 各セクション(Aft ... Forward: 浸水、火災、損傷したシステム)の損傷一覧をマウスホイールでスクロールできます。次に表示するタブから反映されます。
help.UnitStatus/RememberTab = Unit Statusウィンドウ: 各ユニット(接触)で開いていたタブを記憶し、そのユニットを再び選択したとき、そのタブが利用可能なら開き直します。
