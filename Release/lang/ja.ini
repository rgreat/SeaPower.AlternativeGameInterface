up.do = アップグレード
up.cancel = キャンセル
up.saleDismiss = {0} pt で解雇
up.saleDecom = {0} pt で退役
up.aircraft = 割り当て済み航空機 {0} 機: 最大 {1} 機が新しい艦に移ります(格納庫に空きがある場合)。残りは未割り当てに戻ります。
up.price = 価格: {0} pt
up.priceSur = 価格: {0} pt(希少性の割増 +{1})
up.damaged = 艦が損傷しています: 修理費はすでに払い戻しから差し引かれています({0} pt)。
up.points2 = ポイント: {0} > {1}
up.fleet = 艦隊価値: {0} > {1} / {2}
up.tip = 任務部隊の艦を選択した艦に置き換えます: 古い艦は解雇価格で売却され(それしかできない場合は退役)、新しい艦を購入し、乗員は技能レベルが1つ下がります(Alternative Game Interface)。
up.noSel = 名簿から艦を選んでください。
up.noStatus = ここでは任務部隊を利用できません。
up.hist = 史実の増援では利用できません。
up.pending = まず保留中の購入を確定または取り消してください。
up.none = この艦に置き換えられる任務部隊の艦はありません。
up.points = ポイントが足りません
up.cap = 艦隊価値の上限を超えています
up.owned = このバージョンは既に艦隊にあります
up.item = {0} pt で売却、乗員 {1} > {2}
up.itemDecom = {0} pt で退役、乗員 {1} > {2}
look.opacity = 不透明度
look.scale = スケール
look.outline = テキストコントラスト
look.level = レベル
look.level.bottom = 最背面
look.level.default = 既定
look.monitor = モニター
look.level.top = 最前面
look.outline.tip = 透明ウィンドウの文字を読みやすく保ちます。灰色の文字は純白か純黒になり縁取りが付き、明るい背景ではすべての文字が暗くなります（明度はウィンドウの下に表示されているものの明るさに追従し、色相は保たれます）。不透明度が 50% を下回ると自動で有効になり、変更もできます。
tab.Desktop mode = デスクトップ
tab.Tactical Display = Tactical Display
lbl.General/ResizeDockedWindows = ドッキングしたウィンドウのリサイズ
unit.General/ResizeDockedWindows = 画面端で判定が内側に入る
help.General/ResizeDockedWindows = 画面の端(またはミッションHUDの下部バー)にドッキングしたウィンドウは、見えないリサイズ領域が画面の外にあり、マウスでその端をつかめません。オン: そのような端では領域がウィンドウ内側に数ピクセル入ります。
lbl.General/FixGameResizeCursors = ゲームのリサイズカーソルを修正
unit.General/FixGameResizeCursors = メニューとキャンペーン
help.General/FixGameResizeCursors = ミッション外では、ゲームはウィンドウ(News、Task Force Builder)のリサイズ端で通常の矢印を表示します。カーソルが読み込まれておらず、カーソル処理も入っていないためです。オン: Modがゲームのカーソルを読み込み、ミッションで使われる処理を組み込みます。
grp.Map = マップ
grp.Map drawing = マップ描画
lbl.General/KeepMapView = リサイズ時にマップ表示を保持
unit.General/KeepMapView = ズームがウィンドウサイズに追従
help.General/KeepMapView = Tactical Displayウィンドウのサイズが変わると、見えていた範囲が見え続けるようにマップのズームも変わります(マップの縦横比は保たれます)。オフ: ズームは変わらず、大きいウィンドウではより広く、小さいウィンドウでは狭く表示されます。
lbl.General/MapFineZoomShift = Shiftで細かいズーム
unit.General/MapFineZoomShift = ホイールの刻みを5分の1に
help.General/MapFineZoomShift = マップ：Shiftを押しながらマウスホイールを回すと、通常の5分の1の刻みでマップを拡大・縮小します。
grp.Desktop mode = デスクトップモード
lbl.General/WindowedMapAndWorldView = デスクトップモードを有効化
unit.General/WindowedMapAndWorldView = 自由に移動・サイズ変更
help.General/WindowedMapAndWorldView = デスクトップモード。Tactical DisplayとWorld Viewは、自由に移動・サイズ変更できる通常のウィンドウとしてのみ動作します(他のウィンドウと同様): 最大化として記憶されず([Layouts]に',max'なし)、常に両方表示され(ゲームはマップ全画面+World Viewの状態に一度だけ設定されます)、他のすべてのウィンドウの下に置かれ、2つの間でのみ入れ替わります。Toggle fullscreen minimapキー(既定はTab)はマップを切り替えなくなり(デスクトップを切り替えます、DesktopCount)、最大化/元に戻すボタンはウィンドウにのみ作用し、ウィンドウの背後の画面はModが消去します(この状態ではゲームは描画しません)。
lbl.General/DesktopCount = デスクトップの数
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = デスクトップモード: デスクトップの数(2 - 5)。ゲームのToggle fullscreen minimapキー(操作 - 一般、既定はTab)で切り替えます。各デスクトップは、ウィンドウの位置とサイズ、開閉、不透明度、スケール、レベル、およびWorld Viewが開いているかを保持します。デスクトップはModの組み込み配置で始まります(1: World View(3D)が上、2: Tactical Display(マップ)が上、3: マップが全画面、4: 3Dビューが全画面、5: マップと3Dビューを並べて表示)。
lbl.General/WorldViewKey = World Viewの開閉キー
unit.General/WorldViewKey = 既定はInsert
help.General/WorldViewKey = デスクトップモード: World Viewウィンドウを開閉するキー。ゲームがすでに使っているキー(操作 - その割り当て、変更したものも含む)は決して取られません。無視され、ログに記録されます。なし = キーなし。コンソール、メニュー、テキストボックスがキーボードを持っているとき、またはShift / Ctrl / Altが押されているときは何もしません。
lbl.InMission/DragTimePanel = ドラッグ可能な時間パネル
unit.InMission/DragTimePanel = ダブルクリックで隅に戻す
help.InMission/DragTimePanel = ミッションHUDの時間パネル(日付/時刻、速度、再生/一時停止)は、枠、速度のテキスト、ボタンの間をマウスでドラッグして動かせます。ダブルクリックで隅に戻ります。
grp.Task Force = 任務部隊
lbl.Campaign/DismissDamaged = 損傷した艦を解雇
unit.Campaign/DismissDamaged = 払い戻し − 修理費
help.Campaign/DismissDamaged = キャンペーンの任務部隊の状態: 修理可能な損傷した艦を解雇できます。払い戻しは修理費の分だけ減ります。
lbl.Campaign/SortLoadoutsByDate = 装備を日付順に並べる
unit.Campaign/SortLoadoutsByDate = 自艦のバージョンを先に
help.Campaign/SortLoadoutsByDate = キャンペーンの任務部隊、装備タブ: 艦自身の装備を日付順に並べ、クラスの新しいバージョンより前に表示します(ゲームは最後に表示します)。
lbl.Campaign/FixVersionSwapPrice = バージョン交換の価格を修正
unit.Campaign/FixVersionSwapPrice = 名簿の価格
help.Campaign/FixVersionSwapPrice = キャンペーンの任務部隊、装備タブ: クラスの別バージョンへの船体交換は、キャンペーンの名簿の価格で購入と同様に価格設定されます(ゲームは新しい船体にユニットのini価格、所持している艦に名簿の価格を使うため、名簿の価格が違うとアップグレードが払い戻しになっていました)。
lbl.Campaign/UpgradeShip = ビルダーに「艦をアップグレード」ボタン
unit.Campaign/UpgradeShip = 乗員 -1 レベル
help.Campaign/UpgradeShip = キャンペーンのTask Force Builder: 「艦のアップグレード」ボタンが任務部隊の艦を選択した艦に置き換えます(解雇/退役価格で売却、乗員は技能レベルが1つ下がります)。
lbl.Campaign/FixReserveSubmarines = 整備中の潜水艦を修正
help.Campaign/FixReserveSubmarines = 再武装や修理に出した潜水艦に関するゲームの不具合を修正します。編成変更で予備隊から失われず、整備中は予備隊の艦艇と同様に潜水艦タブに表示され、すでに失われた潜水艦はキャンペーンマップ読み込み時に予備隊へ戻ります。
lbl.Campaign/EventShipState = ブリーフィング・新聞イベント時の艦の状態
unit.Campaign/EventShipState = 直近のミッション後
help.Campaign/EventShipState = キャンペーンマップ: ブリーフィングや新聞のイベントを選択中、Task Force は直近のミッション後の艦の状態を表示します（ゲームは最初のミッション前の状態、つまり弾薬満載・損傷修理済みを表示します）。
grp.Game UI = ゲームインターフェース
grp.Diagnostics = 診断
grp.Mods = MOD
lbl.Debug/DumpXaml = 今すぐXAMLを出力
help.Debug/DumpXaml = 開発用: オンにすると、これまでに読み込まれたゲームのUIアセットのXAMLをBepInEx/AlternativeGameInterface_xamlに書き出し、自動でオフになります(先に必要なウィンドウを開いてください)。
lbl.Debug/Snapshot = 今すぐスナップショットを取得
help.Debug/Snapshot = ゲームの状態（フレーム時間、メモリ、種類別のオブジェクト数、ログのエラー、MODのコレクション）を BepInEx/AlternativeGameInterface_snapshots.txt に追記し、自動でオフになります。セーブ前とロード後、または長いセッションの序盤と終盤に1回ずつ取得してください。各数値に前回のスナップショットからの変化が表示されます。
lbl.Debug/ScreenshotTabs = Screenshot all tabs now
help.Debug/ScreenshotTabs = For diagnostics: switching it on takes a screenshot of the whole options window for every tab of this settings window (and every page of the Desktop mode tab) and saves PNG files to BepInEx/AlternativeGameInterface_screens, then it switches itself off. The window must be open.
lbl.Debug/CollectGarbage = 今すぐメモリを解放
help.Debug/CollectGarbage = 完全なガベージコレクションと未使用アセットのアンロードを1回実行し、前後のメモリを BepInEx のログに書き出します。
lbl.General/ModCreateFill = Create Mod を自動入力
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Create Mod ウィンドウ（Mods メニュー）：Update Existing でワークショップのアイテムを選ぶと、Pick Folder（StreamingAssets 内の MOD フォルダ）と Pick Image（そのフォルダの thumbnail.jpg）が自動で入力されます。
grp.Track State = Track State
lbl.UnitStatus/TrackState = 選択した接触のTrack State
help.UnitStatus/TrackState = Unit Statusウィンドウ: 他勢力の接触(航跡。自軍ユニットではない)が選択されている間、ウィンドウは空のままではなく、そのTrack State(接触の情報ウィンドウ: 状態、確度、探知、シグネチャ)を表示します。
lbl.UnitStatus/TrackLayout = Track State のレイアウト再構成
help.UnitStatus/TrackLayout = Track State: ウィンドウを再構成します - 要点をコンパクトに表示し、検出元は高さ制限付きのスクロール領域に、残りは候補テーブルに割り当てます。オフ: ゲーム本来の情報ウィンドウのレイアウト。
lbl.Map/ClipContactEllipse = コンタクトの楕円をカット
unit.Map/ClipContactEllipse = センサーの後方
help.Map/ClipContactEllipse = マップ: 方位から求めたコンタクトの位置推定を方位に沿って圧縮し、誤差楕円がセンサーの後方(方位の反対側)に及ばないようにします。アイコン、ラベルの距離、楕円は新しい推定に従います。トラッカー自体のデータは変更されません。
lbl.Map/CompactSonobuoys = ソノブイをコンパクト表示
unit.Map/CompactSonobuoys = 半分のサイズ・文字なし
help.Map/CompactSonobuoys = マップ: 多数のソノブイが同時に見えているとき、アイコンを半分のサイズにして文字を消します。拡大して数が減れば通常表示に戻ります。
lbl.Map/SonobuoysThreshold = ソノブイの閾値
unit.Map/SonobuoysThreshold = 同時に表示される数
help.Map/SonobuoysThreshold = ソノブイをコンパクト表示: マップ上に同時に見えているソノブイの数がこの値を超えるとコンパクト表示になります。この値の90%を下回ると解除されます。
lbl.Map/GroupSpreadMiles = グループ分散の上限：艦船・地上
unit.Map/GroupSpreadMiles = 海里（リーダーから）
help.Map/GroupSpreadMiles = マップ：リーダーからこの海里数より離れた編隊のユニット（艦船・地上）は独立したユニットとみなし、独自のラベルを持ち、編隊名を配置する枠には含めません。
lbl.Map/GroupSpreadMilesAir = グループ分散の上限：航空機
unit.Map/GroupSpreadMilesAir = 海里（リーダーから）
help.Map/GroupSpreadMilesAir = マップ：航空機とヘリも同様に、リーダーからこの海里数より離れて飛ぶユニットは独立したユニットとみなします。
lbl.Map/FormationLines = グループの線
unit.Map/FormationLines = 選択時、リーダーから各ユニットへ
help.Map/FormationLines = マップ：グループのユニットを選択すると、リーダーからグループ内の全ユニットへ線を描きます。
lbl.Map/AirGroupInfo = 航空機編隊：距離と高度
unit.Map/AirGroupInfo = 名前の下に
help.Map/AirGroupInfo = マップ：選択されていない航空機・ヘリコプターの編隊のラベルに、編隊名の下へリーダーの距離と高度を表示します（通常のラベル規則が適用されます）。
lbl.Map/FormationUpdateByLeader = リーダーによる編隊の更新
unit.Map/FormationUpdateByLeader = 航空機をまとめて動かす
help.Map/FormationUpdateByLeader = マップ：同じ編隊の航空機とヘリコプターは、リーダーが新しい位置を取る瞬間にまとめて新しいマップ位置を取ります（ゲームはランダムな瞬間に1ユニットずつ取ります）。それ以外の位置は最大1秒遅れます。
lbl.Map/DrawingImprovements = ユニットとラベルの描画改善
unit.Map/DrawingImprovements = マスタースイッチ
help.Map/DrawingImprovements = マップ：ユニットとラベルの描画改善のマスタースイッチ（コンパクトなソノブイ、ラベルの配置とフィルター、グループの線、接触楕円のカット）。オフ：ゲーム標準の描画になり、下のオプションは非表示になります。
lbl.Map/FriendlyBadgeInLabel = ラベルにFRNDバッジを入れる
unit.Map/FriendlyBadgeInLabel = 専用の行
help.Map/FriendlyBadgeInLabel = マップ：他陣営の友軍ユニットの「FRND」バッジを、アイコンの横ではなく、ラベルの1行目の上に専用の行として表示します。
lbl.Map/LabelPlacement = ラベルの位置
help.Map/LabelPlacement = マップ：ユニットのラベルをアイコンのどちら側に中央揃えで置くか（混雑時は動くことがあります）。「ゲーム通り」は標準の配置です。
val.Map/LabelPlacement.Game = ゲーム通り
val.Map/LabelPlacement.Bottom = 中央・下
val.Map/LabelPlacement.Top = 中央・上
val.Map/LabelPlacement.Right = 中央・右
val.Map/LabelPlacement.Left = 中央・左
lbl.Map/GroupNameOnly = グループ名のみ
unit.Map/GroupNameOnly = 選択するまで
help.Map/GroupNameOnly = マップ：グループが選択されるまで、グループ内のユニットにはグループ名だけを表示します。ユニット自身のラベルは最後に、空きがある場所にだけ追加されます（航空機とヘリコプターは除く）。
lbl.Map/LabelOverlapFilter = 重なるラベルを絞る
unit.Map/LabelOverlapFilter = 最大のユニットを残す
help.Map/LabelOverlapFilter = マップ：艦船や航空機（およびグループ名）のラベルが重なったとき、最も大きいユニットまたはグループのラベルだけを残します。種類不明のユニットは既知のユニットに優先しません。大きさが同じなら最初のラベルを残します。ラベルが収まらない場合は、まず行数を減らし（最後の行から）、最初の行まで重なるときだけ削除します。
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = 識別の進行度
unit.UnitStatus/TrackIdentProgress = おおよそ・10%単位
help.UnitStatus/TrackIdentProgress = Track State: 接触の識別の進行度を10%単位のおおよその値で表示します(自軍ESMによる発信源の観測時間と、ゲームが識別に必要とする時間の比)。識別済みなら100%。再構成レイアウトでのみ、かついずれかのESMが接触を観測している間のみ表示されます。 ESMの観測が完了してもクラスが不明な場合は「データ不足」と表示し、接触が識別されると非表示になります。
track.identProgress = 識別の進行度
track.identNoData = データ不足

