help.General/Language = MOD のテキストの言語: ゲームの言語のコード（en、ru ...）。空 = ゲーム自身の言語。テキストは MOD フォルダ内の lang/<コード>.ini ファイルにあります。編集して翻訳できます。

help.General/AllowDragOutside = あらゆるウィンドウを表示領域の外へ部分的にドラッグできるようにします（左、右、下の端）。

help.General/MinVisiblePixels = AllowDragOutside 使用時: ウィンドウ幅のうち少なくともこのピクセル数が左右の端で見えたままになります。下端ではウィンドウのタイトルバーが常に見えたままになります。

help.General/MaximizeOnDoubleClick = ウィンドウのタイトルバーをダブルクリックすると全画面に最大化され、もう一度ダブルクリックで元に戻ります（サイズ変更できるウィンドウ）。最大化したまま閉じたウィンドウは最大化で開きます（[Layouts] のレイアウトの後に ',max'）。

help.General/RemoveSizeLimits = 記憶するウィンドウ（Unit Reference を含む WindowPatterns）のサイズ制限なし: 独自の最小・最大サイズがなく（100x60 px まで小さくできます）、端でのサイズ変更が画面の端で止まりません（上端は画面内に残るので、タイトルバーに届きます）。切り替えは画面上のウィンドウにすぐ反映されます。

help.General/SnapWindows = ウィンドウをマウスでドラッグまたはサイズ変更しているとき、その端が他のウィンドウや画面の端に SnapDistance より近づくとスナップします（見える端が対象で、ウィンドウの周りの見えないサイズ変更領域は含みません）。

help.General/SnapDistance = SnapWindows: 端がスナップするまでの距離（ピクセル、1 - 50）。

help.General/BringToFrontOnClick = ウィンドウをクリックすると他のウィンドウより前面に出ます。新しく開いたウィンドウも前面に出ます。並べ替えるのはウィンドウのみで、ゲームが割り当てたレベル (Panel.ZIndex) より下に限られるため、ゲーム自身が表示するもの（ブリーフィング、メッセージ）は上に残ります。最大化した Tactical Display / World View は他のすべてのウィンドウの下に残ります。

help.General/CascadeOffset = 同じパターンの複数のウィンドウを同時に開く場合（例: Weapon Reference）: 最初のウィンドウは保存されたレイアウトを保ち、その変更だけが保存されます。以降のウィンドウは、すでに開いているウィンドウ 1 つにつきこのピクセル数だけ右下にずらして開きます（ドラッグしたウィンドウと同様に画面内に収まります）。0 = すべて保存位置に開きます。

help.General/SettingsButton = 記憶する各ウィンドウ（WindowPatterns）のタイトルバーにある歯車ボタンで、Alternative Game Interface の設定ウィンドウを開きます。

help.Mission/UnitPanelMenu = ミッション: 下部のユニットパネルで選択中のユニットの旗または名前を右クリックすると、マップ上のユニットを右クリックしたときと同じメニューが開きます。

help.General/FixContactInfo = コンタクトの Information ウィンドウ（誰が、どのセンサーで、どれくらい前に探知したか）: 探知記録は、ゲームが刻印するのと同じ時計で経過時間が計算されます（ゲームは 2 つの時計を混在させており、ロードしたゲームではフィールドが空になります）。

help.General/HideCustomMission = メインメニュー: エディタの既定ファイル "_Custom Mission" を SCENARIOS リストに表示しません。

help.General/Backgrounds = メインメニューとロード画面の背景画像。Mod: Mod が独自の画像 (ui/backgrounds) を持つ場合はそれだけを表示。混在: ゲームと同じ - ゲームと全 Mod の画像からランダム。ゲーム: ゲーム本体の画像のみ。
val.General/Backgrounds.Mods = Mod のみ
val.General/Backgrounds.Mixed = 混在
val.General/Backgrounds.Game = ゲームのみ

help.MissionEditor/RememberMissionFolder = メインメニューとロード画面の背景画像: MOD が独自の画像 (ui/backgrounds) を持つ場合、それだけを表示し、ゲームのものと混ぜません。オフ = ゲームと同じ: ゲームと全 MOD の画像をまとめてランダムに 1 枚選びます。

help.General/ColorIniFiles = ミッションエディタのファイル選択: *.ini ファイルの名前を水色で表示します。

help.Campaign/StrictLoadouts = キャンペーンの Task Force Builder: ミッションが利用可能とする艦、またはすでに所有している艦についてのみ、艦のバージョンとロードアウトを提示します（ゲームは百科事典タグを共有するすべての艦も提示します）。キャンペーンとともに保存され、新しいキャンペーンの開始時に選びます。

help.General/DeleteOldLogs = ゲーム開始時に、以前のセッションのログファイル（ゲームの Logs フォルダ: *_session_*、*_sessionEventLog_*）を削除します。今回のセッションのものは残ります。

help.General/Debug = 詳細ログと BepInEx/AlternativeGameInterface.trace.txt を有効にします。

help.General/WindowPatterns = 記憶するウィンドウの名前をカンマ区切りで指定します。大文字小文字は区別せず、比較時に空白は無視されます（'Unit Status*' は 'UnitStatusView' にも一致）。'*' は任意のテキスト（空も含む）に一致します。パターンはウィンドウの名前、ヘッダーのテキスト、コンテンツ型、view-model 型と比較され、これらの文字列のいずれかと先頭から一致する必要があります（'Unit Reference*' は 'Unit Reference - XYZ' に一致。どこにでも一致させるには '*テキスト*'）。同じパターンに一致するウィンドウは、保存された 1 つのレイアウトを共有します。

help.General/AddWindowKey = ウィンドウにマウスを合わせてこのキーを押すと、そのウィンドウが WindowPatterns に追加されます。

help.General/RememberOpenWindows = 開閉状態を記憶するウィンドウのパターン（WindowPatterns と同じ規則）をカンマ区切りで指定します。ロード画面（ミッション開始、百科事典）の後、これらのウィンドウは最後の状態どおりに開閉されます。状態は [OpenWindows] に保存されます。ゲームがすでに作成したウィンドウのみ開けます（例: Unit Status には選択されたユニットが必要）。

help.WindowBorder/Enabled = ドラッグ可能なすべてのウィンドウの周りに、見える部分の端に沿って細い枠を表示します。ウィンドウ本来の見た目の上に描画され、ウィンドウのサイズを変えず、マウスも受け取りません。

help.WindowBorder/Thickness = 枠の太さ（ピクセル、0.5 - 10）。枠には上辺がありません（タイトルバーの下に隠れてしまうため）。

help.WindowBorder/Color = 枠の色: #RRGGBB または #AARRGGBB（AA = 不透明度、00 透明 - FF 不透明）。

help.WindowBorder/ToolTips = ゲームのツールチップ（ポップアップヒント）の周りにも、上記の太さと色で四辺に枠を付けます。

help.UnitStatus/SectionsMinHeight = Unit Status ウィンドウの Damage Control タブ: セクションパネル（Aft ... Forward とその損傷リスト）の最小高さ（画面ピクセル）。ウィンドウが低いとこの値まで縮み、それ以下ではタブが縮まなくなり、下部の 'Auto Damage Control Status' パネルがウィンドウの外に出ます。0 = ゲームどおり（タブ全体に固定の最小値があり、パネルは他の行の残りを受け取ります。設定ウィンドウに表示）。

help.UnitStatus/UnitReferenceTab = Unit Status ウィンドウ: 選択したユニットの Unit Reference（その艦/型とロードアウト）を、ユニットツリーと検索パネルなしで表示する "Reference" タブ（最後）。

help.UnitStatus/FullUnitName = Unit Status ウィンドウ: ヘッダーにユニットのフルネームを表示します（ゲームは短い名前を表示）。

help.General/ImprovedUnitReferenceUI = Unit Reference ウィンドウの改善: ユニットツリーを隠す（左端の '<' ボタン）と検索/フィルターパネルも隠れ、ウィンドウはツリーの幅だけ狭くなって同じ分だけ右に移動します。これによりユニット情報はその場に留まり、上部の空いた領域を使います（ツリーを表示すると元に戻ります。保存されたレイアウトはツリー表示時のウィンドウを保存します）。右端にマウスでドラッグできるスプリッターを持つ、より幅広いユニットツリー（幅は [UnitReference] TreeWidth に保存）。選択した国を記憶します（[UnitReference] Country）。この後に開く Unit Reference ウィンドウに適用されます。

help.UnitReference/ShowLoadoutList = Unit Reference: 複数のロードアウトを持つ艦、潜水艦、陸上ユニットにもロードアウト選択を表示します（ゲームは航空機のみ）。ユニット情報は選択したロードアウトに従います。

help.UnitReference/OptimizeTree = Unit Reference ツリー: ユニット種別のクラスを就役日順に並べます。クラスのグループでは、各ユニットの後にそのロードアウト型が続き（日付順、Early が先頭）、"ユニット [型]" と表示されます（Default または単一の型には接尾辞なし）。Default のロードアウトがないユニットは型のみ表示します。この後に開く Unit Reference ウィンドウに適用されます。

help.UnitReference/ScrollToSelected = Unit Reference ツリー: 選択したユニットが見えるようにツリーをスクロールします（ウィンドウを開いたときやツリーを表示したときは中央に）。

help.UnitReference/EarliestVariantOnClick = Unit Reference ツリー: クラス（複数の型を持つノード）をクリックすると、その最も古い型が選ばれます。ゲームはミッション年に就役中の型を選び、なければ最新を選びます。

help.UnitReference/KeepOpenedUnit = Unit Reference: ウィンドウを開いた対象のユニットは、国/日付/検索/武装ありのみのフィルターで隠れる場合でも、そのクラスとともにツリーに残ります。

help.UnitReference/TreeWheelOnlyOver = Unit Reference ツリー: マウスホイールは、カーソルがツリー上にあるときだけツリーをスクロールします。

help.UnitReference/RememberSearchPanel = Unit Reference ウィンドウの検索パネル（カテゴリ、「日付で絞り込み」、「名前のみで検索」、検索テキスト）は .cfg に保存され（下のキー）、Unit Reference ウィンドウを開くときに再設定されます（ImprovedUnitReferenceUI 使用時）。

help.UnitReference/HideEmptyCountries = Unit Reference: 国リストには、現在の検索テキスト、「日付で絞り込み」、「武装ありのみ」に該当するユニットがある国だけを表示します（選択中の国は常に表示）。

help.UnitReference/SearchInDescriptionAndId = Unit Reference: 「名前のみで検索」がオフのとき、検索はユニットの説明とその ini の id (<Id>.ini) からもユニットを見つけます。

help.UnitReference/LinkHelp = Unit Reference: 強調表示されたリンクで、短いヘルプがある武器、センサー、システムについて、そのヘルプ（説明の冒頭）をツールチップで表示します。


