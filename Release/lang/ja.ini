lbl.UnitReference/ShowPropulsion = 艦のデータに推進を表示
help.UnitReference/ShowPropulsion = Unit Reference: 艦と潜水艦の主要パラメーターに、Max Speedの後ろに推進のセルを追加します: エンジンの種類と出力(主機関と補助機関)。次に表示するユニットから反映されます。
ref.propulsion.tip = 推進: エンジンの種類と出力(主機関と補助機関)
lbl.UnitStatus/DamageListsWheel = ホイールでセクション一覧をスクロール
help.UnitStatus/DamageListsWheel = Unit Statusウィンドウ、Damage Controlタブ: 各セクション(Aft ... Forward: 浸水、火災、損傷したシステム)の損傷一覧をマウスホイールでスクロールできます。次に表示するタブから反映されます。
lbl.General/NoFrameLimit = フレームレート制限を解除
unit.General/NoFrameLimit = スライダー無効
help.General/NoFrameLimit = フレームレートを制限しません。上のスライダーは無効になります。垂直同期がオンの場合は画面のリフレッシュレートが上限になります（Alternative Game Interface）。
lbl.General/AddAdaptiveVSync = アダプティブ V-Sync を追加
unit.General/AddAdaptiveVSync = V-Sync 一覧に
help.General/AddAdaptiveVSync = ビデオ設定の V-Sync 一覧に「Adaptive V-Sync」を追加します。フレームが画面に追いついている間は垂直同期をオン、追いつかない間はオフにします。ゲームには通常の垂直同期として保存されるため、このMODがなくても動作します。
