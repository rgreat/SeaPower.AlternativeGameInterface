help.General/Language = Ngôn ngữ của văn bản mod: mã của một ngôn ngữ trong trò chơi (en, ru ...); để trống = ngôn ngữ riêng của trò chơi. Văn bản nằm trong các tệp lang/<mã>.ini ở thư mục mod – hãy sửa chúng để dịch.

help.General/AllowDragOutside = Cho phép kéo bất kỳ cửa sổ nào một phần ra ngoài vùng nhìn thấy (cạnh trái, phải và dưới).

help.General/MinVisiblePixels = Với AllowDragOutside: ít nhất chừng này pixel chiều rộng của cửa sổ vẫn hiện ở cạnh trái/phải. Ở cạnh dưới, thanh tiêu đề của cửa sổ luôn hiện.

help.General/MaximizeOnDoubleClick = Nhấp đúp vào thanh tiêu đề của cửa sổ để phóng to ra toàn màn hình, nhấp đúp lần nữa để khôi phục (cửa sổ đổi được kích thước). Cửa sổ đóng khi đang phóng to sẽ mở ở trạng thái phóng to (',max' sau bố cục của nó trong [Layouts]).

help.General/RemoveSizeLimits = Không giới hạn kích thước cho các cửa sổ được nhớ (WindowPatterns, kể cả Thông tin đơn vị): không có kích thước tối thiểu hoặc tối đa riêng (xuống tới 100x60 px) và việc đổi kích thước bằng một cạnh không bị chặn bởi mép màn hình (phần trên vẫn ở trên màn hình để với tới thanh tiêu đề). Bật/tắt có hiệu lực ngay với các cửa sổ đang hiện.

help.General/SnapWindows = Khi một cửa sổ được kéo hoặc đổi kích thước bằng chuột, các cạnh của nó bám vào cạnh của các cửa sổ khác và của màn hình khi chúng lại gần hơn SnapDistance (các cạnh nhìn thấy, không tính vùng đổi kích thước vô hình quanh cửa sổ).

help.General/SnapDistance = SnapWindows: một cạnh phải lại gần bao nhiêu thì bám, tính bằng pixel (1 - 50).

help.General/BringToFrontOnClick = Nhấp vào cửa sổ sẽ đưa nó lên trước các cửa sổ khác; cửa sổ mới mở cũng lên trước. Chỉ cửa sổ được sắp xếp lại, và chỉ dưới mức mà trò chơi đã cho chúng (Panel.ZIndex), nên những gì chính trò chơi hiển thị – buổi thông báo, tin nhắn – vẫn ở trên. Màn hình chiến thuật / World View đang phóng to vẫn nằm dưới mọi cửa sổ khác.

help.General/CascadeOffset = Nhiều cửa sổ cùng một mẫu mở cùng lúc (vd. Thông tin vũ khí): cửa sổ đầu giữ bố cục đã lưu và chỉ thay đổi của nó được lưu; mỗi cửa sổ tiếp theo mở lệch sang phải và xuống dưới chừng này pixel cho mỗi cửa sổ đã mở (được giữ trong màn hình như cửa sổ bị kéo). 0 = tất cả mở ở vị trí đã lưu.

help.General/SettingsButton = Nút bánh răng trên thanh tiêu đề của mỗi cửa sổ được nhớ (WindowPatterns) mở cửa sổ cài đặt Alternative Game Interface.

help.Mission/UnitPanelMenu = Nhiệm vụ: nhấp chuột phải vào cờ hoặc tên của đơn vị đã chọn trong bảng đơn vị ở dưới sẽ mở cùng menu như nhấp chuột phải vào đơn vị trên bản đồ.


help.General/EncyclopediaSplit = Menu chính: "Bách khoa toàn thư" mở cửa sổ Thông tin đơn vị (không tải nhiệm vụ); "Bách khoa toàn thư 3D" là mục gốc của trò chơi, tải nhiệm vụ Bách khoa toàn thư.
lbl.General/FitNewsWindow = Cửa sổ tin tức lấp vùng trống
help.General/FitNewsWindow = Menu chính: cửa sổ tin tức chiếm vùng trống bên phải menu, từ mép trên đến thanh mẹo, trong suốt hoàn toàn với nội dung 120 %. Tự tắt khi bạn di chuyển, đổi cỡ hoặc đổi giao diện cửa sổ tin tức (kể cả nếu đã làm trước đó); bật lại sẽ xóa vị trí, kích thước và giao diện bạn đã đặt.
grp.Game = Trò chơi
lbl.General/ShowGameVersion = Dấu phiên bản game
help.General/ShowGameVersion = Dòng phiên bản của game trên màn hình: theo game quyết định (nhánh beta hoặc [Debug] ShowVersionWatermark), luôn hiện hoặc luôn ẩn. Chỉ đặt trong bộ nhớ, không sửa tệp của game.
val.General/ShowGameVersion.Game = Như game
val.General/ShowGameVersion.Show = Hiện
val.General/ShowGameVersion.Hide = Ẩn
tab.World View = World View
grp.Camera offset = Dịch camera
cam.conflict = Mod Camera Offset đang được nạp: dịch camera được chỉnh trong cửa sổ riêng của nó (F11); các thiết lập này không được dùng.
lbl.WorldView/CameraOffset = Dịch hình
help.WorldView/CameraOffset = Hình 3D của World View được dịch để vật thể đang bám không nằm giữa (như mod Camera Offset; bị làm mờ khi mod đó được nạp). Chỉ camera bám theo, không áp dụng với ống nhòm / kính tiềm vọng. Có hiệu lực ngay, trước Apply.
lbl.WorldView/CameraOffsetFollowX = Vật thể bám trên màn hình
unit.WorldView/CameraOffsetFollowX = % khung nhìn
help.WorldView/CameraOffsetFollowX = Vị trí vật thể đang bám trên màn hình, theo % khung nhìn từ tâm (±25 %). Kéo chấm trên tâm ngắm, bấm vào tâm ngắm hoặc dùng các mũi tên.
help.General/FixSoundOnReload = Tải bản lưu từ trong nhiệm vụ: âm thanh theo khoảng cách của trò chơi vẫn cập nhật khi không còn camera và mỗi khung hình hiện một hộp thoại lỗi. Các lỗi này sẽ không được hiển thị.
help.General/HideCustomMission = Menu chính: tệp mặc định của trình soạn "_Custom Mission" không hiện trong danh sách Kịch bản.

help.General/Backgrounds = Ảnh nền của menu chính và màn hình tải. Mod: nếu mod có ảnh riêng (ui/backgrounds) thì chỉ hiện ảnh đó. Trộn: như game - chọn ngẫu nhiên từ ảnh của game và mọi mod. Game: chỉ ảnh của game.
val.General/Backgrounds.Mods = Chỉ từ mod
val.General/Backgrounds.Mixed = Trộn
val.General/Backgrounds.Game = Chỉ game
help.Monitors/Enabled = Chế độ desktop: các màn hình khác hoạt động như màn hình chính - có thể đặt cửa sổ lên đó (Màn hình trong menu cửa sổ). Bản đồ màn hình thứ hai và màn hình World View của game sẽ không được dùng. Có hiệu lực từ lần bắt đầu nhiệm vụ sau.
help.General/RealPhotos = Ảnh riêng của mod này (ảnh thật, ui/backgrounds) trong số nền của menu và màn hình tải. Tắt: không hiển thị; nếu không mod nào khác mang ảnh tới, ảnh của game được hiển thị bất kể Ảnh nền đặt thế nào.
help.General/MenuBackground = Nền của menu chính. Video: video lặp của chính game. Trình chiếu: các ảnh nền (xem Ảnh nền), đổi sau khoảng thời gian đã đặt; khi đó video không được tải, giúp tiết kiệm tài nguyên.
val.General/MenuBackground.Video = Video của game
val.General/MenuBackground.Slideshow = Trình chiếu ảnh
help.General/SlideshowSeconds = Trình chiếu của menu chính: số giây mỗi ảnh được hiển thị.

help.MissionEditor/RememberMissionFolder = Ảnh nền của menu chính và màn hình tải: khi các mod mang ảnh riêng (ui/backgrounds), chỉ ảnh của chúng được hiện, không trộn với ảnh của trò chơi. Tắt = như trò chơi: chọn ngẫu nhiên một ảnh trong số ảnh của trò chơi và của mọi mod gộp lại.
help.General/RememberSaveFolder = Cửa sổ Lưu game và Tải game (menu tạm dừng, menu chính, chiến dịch) mở ở thư mục dùng lần trước. Bản lưu chiến dịch và nhiệm vụ nhớ thư mục riêng của mình.
help.General/DoubleClickOpen = Nhấp đúp mở tệp trong cửa sổ tải game và các cửa sổ mở tệp khác (như nút Mở) và bắt đầu kịch bản trong danh sách kịch bản của menu chính (như nút Chơi). Cửa sổ lưu không thay đổi.
lbl.General/AutoOpenLoad = Mở Tải game khi vào Kịch bản và Chiến dịch
help.General/AutoOpenLoad = Menu chính: vào Kịch bản hoặc Chiến dịch sẽ mở ngay cửa sổ Tải game.
lbl.General/MenuWindowsAside = Cửa sổ menu cạnh các nút
unit.General/MenuWindowsAside = Tải game... không đè lên menu
help.General/MenuWindowsAside = Màn hình menu chính (Kịch bản, Chiến dịch ...): cửa sổ (Tải game ...) mở cạnh các nút menu, không đè lên chúng.
lbl.General/FilePickerTall = Cửa sổ chọn tệp không giới hạn chiều cao
help.General/FilePickerTall = Cửa sổ chọn tệp (tải / lưu game, ...) không có chiều cao tối đa (game giới hạn ở 400).

help.General/ColorIniFiles = Hộp chọn tệp của trình soạn nhiệm vụ: tên các tệp *.ini có màu xanh nhạt.

help.Campaign/StrictLoadouts = Task Force Builder của chiến dịch: phiên bản tàu và loadout chỉ được đưa ra cho những tàu mà nhiệm vụ liệt kê là có sẵn hoặc bạn đã sở hữu (trò chơi còn đưa ra mọi tàu có chung thẻ bách khoa). Được lưu cùng chiến dịch; chọn khi bắt đầu chiến dịch mới.

help.General/DeleteOldLogs = Khi khởi động trò chơi, các tệp nhật ký của các phiên trước (thư mục Logs của trò chơi: *_session_*, *_sessionEventLog_*) bị xóa; tệp của phiên này được giữ.

help.General/Debug = Bật ghi nhật ký chi tiết và BepInEx/AlternativeGameInterface.trace.txt.
help.Debug/TracePeriodic = Khi bật theo dõi gỡ lỗi: ghi cả các chẩn đoán ghi liên tục (mọi nhãn của Màn hình chiến thuật mỗi 2 giây, cập nhật đội hình theo chỉ huy, bám cạnh cửa sổ, trình phân tích hiệu năng). Tắt: chỉ ghi sự kiện, tệp nhỏ. Chỉ bật cho thử nghiệm ngắn: tệp tăng thêm vài megabyte.

help.General/WindowPatterns = Tên các cửa sổ cần nhớ, phân tách bằng dấu phẩy. Không phân biệt hoa thường, khoảng trắng bị bỏ qua khi so sánh ('Unit Status*' cũng khớp với 'UnitStatusView'), '*' khớp với văn bản bất kỳ (kể cả không có). Mẫu được so sánh với tên cửa sổ, văn bản tiêu đề, kiểu nội dung và kiểu view-model, và phải khớp với một trong các chuỗi đó từ đầu ('Thông tin đơn vị*' khớp với 'Thông tin đơn vị - XYZ'; dùng '*văn bản*' để khớp ở bất kỳ đâu). Các cửa sổ khớp cùng một mẫu dùng chung một bố cục đã lưu.

help.General/AddWindowKey = Trỏ chuột vào một cửa sổ và nhấn phím này để thêm cửa sổ đó vào WindowPatterns.

help.General/RememberOpenWindows = Các mẫu cửa sổ phân tách bằng dấu phẩy (cùng quy tắc như WindowPatterns) có trạng thái mở / đóng được nhớ: sau màn hình tải (bắt đầu nhiệm vụ, bách khoa) các cửa sổ này được mở hoặc đóng như lúc để lại. Trạng thái được lưu trong [OpenWindows]. Chỉ mở được những cửa sổ mà trò chơi đã tạo (vd. Unit Status cần một đơn vị được chọn).

help.WindowBorder/Enabled = Khung mỏng quanh mỗi cửa sổ kéo được, ở mép phần nhìn thấy của nó. Vẽ đè lên giao diện riêng của cửa sổ; không đổi kích thước cửa sổ và không bắt chuột.

help.WindowBorder/Thickness = Độ dày của khung tính bằng pixel (0.5 - 10). Khung không có cạnh trên (nó sẽ chạy dưới thanh tiêu đề).

help.WindowBorder/Color = Màu của khung: #RRGGBB hoặc #AARRGGBB (AA = độ mờ đục, 00 trong suốt - FF đặc).

help.WindowBorder/ToolTips = Khung cả quanh tooltip (gợi ý bật lên) của trò chơi, ở cả bốn cạnh, với độ dày và màu ở trên.

help.UnitStatus/SectionsMinHeight = Cửa sổ Unit Status, thẻ Kiểm soát thiệt hại: chiều cao tối thiểu của các bảng phần (Aft ... Forward cùng danh sách hư hại), tính bằng pixel màn hình. Cửa sổ thấp hơn sẽ thu chúng xuống mức này; dưới mức đó thẻ không thu nhỏ nữa và bảng 'Auto Kiểm soát thiệt hại Status' ở dưới bị đẩy ra khỏi cửa sổ. 0 = như trong trò chơi (cả thẻ có mức tối thiểu cố định; các bảng nhận phần các hàng khác để lại – hiển thị trong cửa sổ cài đặt).

help.UnitStatus/UnitReferenceTab = Cửa sổ Unit Status: một thẻ "Reference" (cuối cùng) với Thông tin đơn vị của đơn vị đã chọn – tàu / biến thể và loadout của nó – không có cây đơn vị và bảng tìm kiếm.


help.General/ImprovedUnitReferenceUI = Cải tiến cửa sổ Thông tin đơn vị: ẩn cây đơn vị (nút '<' ở cạnh trái) cũng ẩn bảng tìm kiếm / bộ lọc, làm cửa sổ hẹp đi bằng chiều rộng của cây và dời sang phải một đoạn bằng đó, nên thông tin đơn vị vẫn ở nguyên chỗ và chiếm phần trống ở trên (hiện cây thì ngược lại; bố cục đã lưu lưu cửa sổ ở trạng thái hiện cây); cây đơn vị rộng hơn với thanh chia ở cạnh phải có thể kéo bằng chuột (chiều rộng lưu trong [UnitReference] TreeWidth); quốc gia đã chọn được nhớ ([UnitReference] Country). Áp dụng cho các cửa sổ Thông tin đơn vị mở sau đó.

help.UnitReference/ShowLoadoutList = Thông tin đơn vị: hiện bộ chọn loadout cả cho tàu, tàu ngầm và đơn vị trên bộ có nhiều loadout (trò chơi chỉ hiện cho máy bay); thông tin đơn vị theo loadout đã chọn.

help.UnitReference/OptimizeTree = Cây Thông tin đơn vị: các lớp của một loại đơn vị được sắp theo ngày vào biên chế; trong nhóm lớp, mỗi đơn vị theo sau là các biến thể loadout của nó (theo ngày, Early trước), ghi là "Đơn vị [Biến thể]" (không có hậu tố cho Default hoặc một biến thể duy nhất); đơn vị không có loadout Default chỉ hiện các biến thể. Áp dụng cho các cửa sổ Thông tin đơn vị mở sau đó.

help.UnitReference/ScrollToSelected = Cây Thông tin đơn vị: cuộn cây sao cho đơn vị đã chọn hiện ra (ở giữa khi cửa sổ mở hoặc cây được hiện).

help.UnitReference/EarliestVariantOnClick = Cây Thông tin đơn vị: nhấp vào một lớp (nút có nhiều biến thể) chọn biến thể sớm nhất của nó. Trò chơi chọn biến thể đang phục vụ vào năm của nhiệm vụ, nếu không thì chọn biến thể muộn nhất.

help.UnitReference/KeepOpenedUnit = Thông tin đơn vị: đơn vị mà cửa sổ được mở cho vẫn ở lại trong cây cùng lớp của nó, kể cả khi các bộ lọc quốc gia / ngày / tìm kiếm / Chỉ có vũ khí sẽ ẩn nó.

help.UnitReference/TreeWheelOnlyOver = Cây Thông tin đơn vị: con lăn chuột chỉ cuộn cây khi con trỏ ở trên nó.

help.UnitReference/RememberSearchPanel = Bảng tìm kiếm của cửa sổ Thông tin đơn vị – danh mục, 'lọc theo ngày', 'chỉ tìm theo tên' và văn bản tìm kiếm – được giữ trong .cfg (các khóa bên dưới) và đặt lại khi mở cửa sổ Thông tin đơn vị (với ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Thông tin đơn vị: danh sách quốc gia chỉ hiện các quốc gia có đơn vị cho văn bản tìm kiếm hiện tại, 'Lọc theo ngày' và 'Chỉ có vũ khí' (quốc gia đã chọn luôn được hiện).

help.UnitReference/SearchInDescriptionAndId = Thông tin đơn vị: khi tắt 'Chỉ tìm theo tên', việc tìm kiếm cũng tìm đơn vị theo mô tả và theo id ini của chúng (<Id>.ini).

help.UnitReference/LinkHelp = Thông tin đơn vị: tooltip với trợ giúp ngắn (phần đầu của mô tả) của vũ khí, cảm biến hoặc hệ thống trên các liên kết được tô sáng, khi có.


; --- new ---
tip.look = Độ mờ và tỷ lệ của cửa sổ
menu.button = Giao diện game
tab.track = Track State
up.button = Nâng cấp tàu...
up.title = Nâng cấp tàu
up.sell = Bán
up.buy = Mua
up.crew = Thủy thủ đoàn
up.min = cấp thấp nhất
up.do = Nâng cấp
up.cancel = Hủy
up.saleDismiss = Sa thải lấy {0} điểm
up.saleDecom = Cho ngừng hoạt động lấy {0} điểm
up.aircraft = {0} máy bay được phân bổ: tối đa {1} chuyển sang tàu mới (nếu nhà chứa đủ chỗ), số còn lại về lại nhóm chưa phân bổ.
up.price = Giá: {0} điểm
up.priceSur = Giá: {0} điểm (+{1} phụ phí khan hiếm)
up.damaged = Tàu bị hư hại: chi phí sửa chữa đã được trừ khỏi khoản hoàn ({0} điểm).
up.points2 = Điểm: {0} > {1}
up.fleet = Giá trị hạm đội: {0} > {1} / {2}
up.tip = Thay một tàu của đội đặc nhiệm bằng tàu đã chọn: tàu cũ được bán theo giá Sa thải (Ngừng hoạt động nếu chỉ có thể như vậy), tàu mới được mua, thủy thủ đoàn mất một cấp kỹ năng (Alternative Game Interface).
up.noSel = Hãy chọn một tàu trong danh sách.
up.noStatus = Đội đặc nhiệm không khả dụng ở đây.
up.hist = Không khả dụng với quân tiếp viện lịch sử.
up.pending = Hãy xác nhận hoặc xóa các giao dịch mua đang chờ trước.
up.none = Không có tàu nào của đội đặc nhiệm có thể được thay bằng tàu này.
up.points = không đủ điểm
up.cap = vượt giới hạn giá trị hạm đội
up.owned = phiên bản này đã có trong hạm đội
up.item = bán được {0} điểm, thủy thủ đoàn {1} > {2}
up.itemDecom = ngừng hoạt động lấy {0} điểm, thủy thủ đoàn {1} > {2}
look.opacity = Độ mờ
look.scale = Tỷ lệ
look.outline = Độ tương phản chữ
look.level = Lớp
look.level.bottom = Dưới cùng
look.level.default = Mặc định
look.monitor = Màn hình
look.level.top = Trên cùng
look.outline.tip = Chữ của cửa sổ trong suốt luôn dễ đọc: chữ xám thành trắng hoặc đen thuần kèm viền sáng, và trên nền sáng mọi chữ đều tối đi (độ sáng theo độ sáng của những gì màn hình hiển thị dưới cửa sổ; sắc độ giữ nguyên). Tự bật khi độ mờ dưới 50%, có thể đổi.
tab.Desktop mode = Desktop
tab.Tactical Display = Màn hình chiến thuật
lbl.General/ResizeDockedWindows = Đổi kích thước cửa sổ đã gắn
unit.General/ResizeDockedWindows = vùng lấn vào trong ở mép màn hình
help.General/ResizeDockedWindows = Cửa sổ gắn vào mép màn hình (hoặc thanh dưới của HUD nhiệm vụ) có vùng đổi kích thước vô hình nằm ngoài màn hình, nên chuột không nắm được mép đó. Bật: ở mép như vậy vùng này lấn vào trong cửa sổ vài điểm ảnh.
lbl.General/FixGameResizeCursors = Sửa con trỏ đổi kích thước của game
unit.General/FixGameResizeCursors = menu và chiến dịch
help.General/FixGameResizeCursors = Ngoài nhiệm vụ, game chỉ hiện mũi tên thường ở các mép đổi kích thước của cửa sổ (News, Task Force Builder): con trỏ của nó chưa được tải và chưa có trình xử lý con trỏ. Bật: mod đọc các con trỏ của game và cài trình xử lý mà các nhiệm vụ dùng.
grp.Map = Bản đồ
grp.Map drawing = Vẽ bản đồ
lbl.General/KeepMapView = Giữ góc nhìn bản đồ khi đổi kích thước
unit.General/KeepMapView = thu phóng theo kích thước cửa sổ
help.General/KeepMapView = Khi kích thước cửa sổ Màn hình chiến thuật đổi, mức thu phóng bản đồ đổi theo để vùng đang thấy vẫn còn thấy (bản đồ giữ tỷ lệ). Tắt: thu phóng giữ nguyên, cửa sổ lớn hơn hiện nhiều bản đồ hơn, nhỏ hơn thì ít hơn.
lbl.General/MapFineZoomShift = Thu phóng mịn với Shift
unit.General/MapFineZoomShift = bước con lăn nhỏ hơn 5 lần
help.General/MapFineZoomShift = Bản đồ: khi giữ Shift, con lăn chuột thu phóng bản đồ theo bước nhỏ hơn 5 lần so với bình thường.
grp.Desktop mode = Chế độ desktop
lbl.General/WindowedMapAndWorldView = Bật chế độ desktop
unit.General/WindowedMapAndWorldView = di chuyển và đổi cỡ tự do
help.General/WindowedMapAndWorldView = Chế độ desktop. Màn hình chiến thuật và World View chỉ hoạt động như cửa sổ thường, có thể di chuyển và đổi cỡ tự do (như các cửa sổ khác): chúng không được nhớ là phóng to (không có ',max' trong [Layouts]), cả hai luôn hiển thị (game được đặt một lần vào trạng thái bản đồ toàn màn hình + World View), luôn nằm dưới mọi cửa sổ khác và chỉ đổi chỗ cho nhau. Phím Toggle fullscreen minimap (mặc định Tab) không còn chuyển bản đồ nữa (nó chuyển giữa các desktop, DesktopCount), các nút phóng to / khôi phục chỉ tác động lên cửa sổ, và màn hình phía sau cửa sổ do mod xóa (game không vẽ nó ở trạng thái này).
lbl.General/DesktopCount = Số lượng desktop
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Chế độ desktop: số lượng desktop (2 - 5). Phím Toggle fullscreen minimap của game (Điều khiển - Chung, mặc định Tab) chuyển giữa chúng: mỗi desktop giữ vị trí và kích thước, mở / đóng, độ mờ, tỷ lệ và lớp của các cửa sổ, cũng như World View có đang mở hay không. Các desktop bắt đầu bằng bố cục dựng sẵn của mod (1: World View (3D) ở trên, 2: Màn hình chiến thuật (bản đồ) ở trên, 3: bản đồ toàn màn hình, 4: khung nhìn 3D toàn màn hình, 5: bản đồ và khung nhìn 3D cạnh nhau).
lbl.General/WorldViewKey = Phím bật / tắt World View
unit.General/WorldViewKey = mặc định là Insert
help.General/WorldViewKey = Chế độ desktop: phím mở và đóng cửa sổ World View. Phím mà game đã dùng (Điều khiển - các gán phím của nó, kể cả những phím bạn đã đổi) sẽ không bao giờ bị lấy: nó bị bỏ qua và nhật ký ghi lại. Không = không có phím. Không có tác dụng khi bảng điều khiển, menu hoặc ô văn bản đang giữ bàn phím, hoặc khi đang giữ Shift / Ctrl / Alt.
lbl.InMission/DragTimePanel = Bảng thời gian kéo được
unit.InMission/DragTimePanel = nhấp đúp: về lại góc
help.InMission/DragTimePanel = Bảng thời gian của HUD nhiệm vụ (ngày / giờ, tốc độ, chạy / tạm dừng) có thể kéo bằng chuột ở khung, chữ tốc độ hoặc khoảng trống giữa các nút; nhấp đúp để đặt lại vào góc.
grp.Task Force = Đội đặc nhiệm
lbl.Campaign/DismissDamaged = Sa thải tàu bị hư hại
unit.Campaign/DismissDamaged = hoàn tiền trừ sửa chữa
help.Campaign/DismissDamaged = Trạng thái đội đặc nhiệm chiến dịch: tàu hư hại có thể sửa chữa được phép sa thải; khoản hoàn bị giảm đi chi phí sửa chữa.
lbl.Campaign/SortLoadoutsByDate = Sắp xếp trang bị theo ngày
unit.Campaign/SortLoadoutsByDate = phiên bản của chính tàu trước
help.Campaign/SortLoadoutsByDate = Đội đặc nhiệm chiến dịch, thẻ Trang bị: các trang bị riêng của tàu được sắp xếp theo ngày và hiển thị trước các phiên bản mới hơn của lớp (game hiển thị chúng cuối cùng).
lbl.Campaign/FixVersionSwapPrice = Sửa giá khi đổi phiên bản
unit.Campaign/FixVersionSwapPrice = giá trong danh sách
help.Campaign/FixVersionSwapPrice = Đội đặc nhiệm chiến dịch, thẻ Trang bị: việc đổi thân tàu sang phiên bản khác của lớp được tính giá theo danh sách của chiến dịch như khi mua (game dùng giá ini của đơn vị cho thân tàu mới và giá trong danh sách cho tàu bạn có: giá danh sách khác nhau biến việc nâng cấp thành khoản hoàn).
lbl.Campaign/UpgradeShip = Nút Nâng cấp tàu trong Builder
unit.Campaign/UpgradeShip = thủy thủ đoàn -1 cấp
help.Campaign/UpgradeShip = Task Force Builder của chiến dịch: nút “Nâng cấp tàu” thay một tàu của đội đặc nhiệm bằng tàu đã chọn (bán theo giá Sa thải / Ngừng hoạt động, thủy thủ đoàn mất một cấp kỹ năng).
lbl.Campaign/FixReserveSubmarines = Sửa lỗi tàu ngầm đang bảo dưỡng
help.Campaign/FixReserveSubmarines = Sửa lỗi của game với tàu ngầm được gửi đi nạp đạn hoặc sửa chữa. Nó không bị mất khỏi Dự bị khi đổi đội hình, được hiện trong thẻ Tàu ngầm khi đang bảo dưỡng như các tàu trong Dự bị, và tàu ngầm đã mất được đưa lại vào Dự bị khi tải bản đồ chiến dịch.
lbl.Campaign/EventShipState = Trạng thái tàu ở sự kiện thông báo và báo chí
unit.Campaign/EventShipState = sau nhiệm vụ gần nhất
help.Campaign/EventShipState = Bản đồ chiến dịch: khi chọn sự kiện thông báo hoặc báo chí, Task Force hiển thị tàu như sau nhiệm vụ gần nhất (trò chơi hiển thị trạng thái trước nhiệm vụ đầu tiên: đạn đầy, hư hại đã sửa).
grp.Game UI = Giao diện game
grp.Diagnostics = Chẩn đoán
grp.Mods = Mod
lbl.Debug/DumpXaml = Xuất XAML ngay
help.Debug/DumpXaml = Dành cho phát triển: bật lên sẽ ghi XAML của các tài nguyên giao diện game đã tải đến lúc này vào BepInEx/AlternativeGameInterface_xaml rồi tự tắt (hãy mở trước các cửa sổ cần).
lbl.Debug/Snapshot = Chụp ảnh nhanh ngay
help.Debug/Snapshot = Ghi thêm trạng thái trò chơi (thời gian khung hình, bộ nhớ, đối tượng theo loại, lỗi trong nhật ký, các tập hợp của mod) vào BepInEx/AlternativeGameInterface_snapshots.txt rồi tự tắt. Chụp một lần trước khi lưu và một lần sau khi tải, hoặc đầu và cuối một phiên dài: mỗi số cho thấy thay đổi so với lần chụp trước.
lbl.Debug/ScreenshotTabs = Chụp ngay tất cả tab của mọi mod
help.Debug/ScreenshotTabs = Dùng để chẩn đoán: khi bật, nó chụp ảnh toàn bộ cửa sổ tùy chọn cho từng tab (và từng trang) của cửa sổ cài đặt này, rồi làm tương tự với cửa sổ của các mod rgreat khác đã cài, và lưu tệp PNG vào BepInEx/<Mod>_screens, sau đó tự tắt. Cửa sổ phải đang mở.
lbl.Debug/CollectGarbage = Dọn bộ nhớ ngay
help.Debug/CollectGarbage = Chạy một lần thu gom rác đầy đủ và gỡ các tài nguyên không dùng; bộ nhớ trước và sau được ghi vào nhật ký BepInEx.
lbl.General/ModCreateFill = Tự điền Tạo Mod
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Cửa sổ Tạo Mod (menu Mods): với Update Existing, chọn một mục Workshop sẽ tự điền Pick Folder (thư mục mod trong StreamingAssets) và Pick Image (thumbnail.jpg trong thư mục đó).
grp.Track State = Track State
lbl.UnitStatus/TrackState = Track State của liên lạc đã chọn
help.UnitStatus/TrackState = Cửa sổ Unit Status: khi một liên lạc của phe khác (một dấu vết, không phải đơn vị của bạn) được chọn, cửa sổ hiển thị Track State của nó (cửa sổ thông tin của liên lạc: trạng thái, độ tin cậy, các lần phát hiện, đặc trưng) thay vì để trống.
lbl.UnitStatus/TrackLayout = Bố cục Track State được sắp xếp lại
help.UnitStatus/TrackLayout = Track State: cửa sổ được bố trí lại - thông tin gọn, các bộ phát hiện trong vùng cuộn có chiều cao giới hạn, phần còn lại dành cho bảng ứng viên. Tắt: bố cục cửa sổ thông tin của trò chơi.
lbl.Map/ClipContactEllipse = Cắt elip mục tiêu
unit.Map/ClipContactEllipse = phía sau cảm biến
help.Map/ClipContactEllipse = Bản đồ: ước lượng vị trí mục tiêu từ phương vị được nén dọc theo phương vị để elip sai số không vượt ra sau cảm biến (phía đối diện phương vị). Biểu tượng, khoảng cách trong nhãn và elip theo ước lượng mới. Dữ liệu của bộ theo dõi không bị thay đổi.
lbl.Map/CompactSonobuoys = Phao sonar gọn
unit.Map/CompactSonobuoys = nhỏ một nửa, không chữ
help.Map/CompactSonobuoys = Bản đồ: khi nhiều phao sonar cùng hiển thị trên bản đồ, biểu tượng của chúng nhỏ đi một nửa và chữ bị ẩn. Khi phóng to và còn ít phao hơn, chúng hiển thị như bình thường.
lbl.Map/SonobuoysThreshold = Ngưỡng số phao sonar
unit.Map/SonobuoysThreshold = hiển thị cùng lúc
help.Map/SonobuoysThreshold = Phao sonar gọn: số phao sonar hiển thị cùng lúc trên bản đồ vượt quá giá trị này thì bật chế độ gọn. Chế độ tắt lại khi số phao xuống dưới 90% giá trị này.
lbl.Map/GroupSpreadMiles = Giới hạn phân tán: tàu, mặt đất
unit.Map/GroupSpreadMiles = hải lý từ đơn vị dẫn đầu
help.Map/GroupSpreadMiles = Bản đồ: đơn vị của nhóm (tàu, đơn vị mặt đất) cách đơn vị dẫn đầu xa hơn số hải lý này là đơn vị độc lập: có nhãn riêng, không nằm trong khung đặt tên nhóm.
lbl.Map/GroupSpreadMilesAir = Giới hạn phân tán: máy bay
unit.Map/GroupSpreadMilesAir = hải lý từ đơn vị dẫn đầu
help.Map/GroupSpreadMilesAir = Bản đồ: tương tự cho máy bay và trực thăng: đơn vị của nhóm bay xa hơn số hải lý này so với đơn vị dẫn đầu là đơn vị độc lập.
lbl.Map/FormationLines = Đường nối nhóm
unit.Map/FormationLines = đơn vị dẫn đầu tới các đơn vị, khi chọn
help.Map/FormationLines = Bản đồ: khi chọn một đơn vị của nhóm, vẽ đường từ đơn vị dẫn đầu tới mọi đơn vị trong nhóm.
lbl.Map/AirGroupInfo = Đội hình máy bay: cự ly và độ cao
unit.Map/AirGroupInfo = dưới tên
help.Map/AirGroupInfo = Bản đồ: nhãn của đội hình máy bay hoặc trực thăng chưa được chọn hiện cự ly và độ cao của đội trưởng bên dưới tên đội hình (áp dụng các quy tắc nhãn thông thường).
lbl.Map/FormationUpdateByLeader = Cập nhật đội hình theo đội trưởng
unit.Map/FormationUpdateByLeader = máy bay di chuyển cùng nhau
help.Map/FormationUpdateByLeader = Bản đồ: máy bay và trực thăng của cùng một đội hình nhận vị trí mới trên bản đồ cùng lúc, vào thời điểm đội trưởng nhận vị trí của mình (trò chơi nhận vào những lúc ngẫu nhiên, từng đơn vị một). Các vị trí khác có thể chậm tới một giây.
lbl.Map/DrawingImprovements = Cải thiện cách vẽ đơn vị và nhãn
unit.Map/DrawingImprovements = công tắc chung
help.Map/DrawingImprovements = Bản đồ: công tắc chung của việc cải thiện cách vẽ đơn vị và nhãn (phao âm thanh thu gọn, vị trí và bộ lọc nhãn, đường nối nhóm, cắt elip liên lạc). Tắt: game vẽ như thường và các tùy chọn bên dưới bị ẩn.
lbl.Map/FriendlyBadgeInLabel = Huy hiệu FRND trong nhãn
unit.Map/FriendlyBadgeInLabel = dòng riêng
help.Map/FriendlyBadgeInLabel = Bản đồ: huy hiệu 'FRND' của đơn vị thân thiện thuộc phe khác được ghi thành một dòng riêng phía trên dòng đầu của nhãn, không vẽ cạnh biểu tượng.
lbl.Map/LabelPlacement = Vị trí nhãn
help.Map/LabelPlacement = Bản đồ: nhãn của đơn vị đặt ở đâu so với biểu tượng, căn giữa theo cạnh đó (khi chật vẫn có thể dịch ra). 'Như trong game' là cách đặt gốc.
val.Map/LabelPlacement.Game = Như trong game
val.Map/LabelPlacement.Bottom = Giữa phía dưới
val.Map/LabelPlacement.Top = Giữa phía trên
val.Map/LabelPlacement.Right = Giữa bên phải
val.Map/LabelPlacement.Left = Giữa bên trái
lbl.Map/GroupNameOnly = Chỉ tên nhóm
unit.Map/GroupNameOnly = đến khi chọn
help.Map/GroupNameOnly = Bản đồ: các đơn vị trong nhóm chỉ hiện tên nhóm cho đến khi nhóm được chọn. Nhãn riêng của chúng được thêm sau cùng, chỉ ở nơi còn chỗ (trừ máy bay và trực thăng).
lbl.Map/LabelOverlapFilter = Lọc nhãn chồng nhau
unit.Map/LabelOverlapFilter = giữ đơn vị lớn nhất
help.Map/LabelOverlapFilter = Bản đồ: khi nhãn của tàu hoặc máy bay (và tên nhóm) chồng lên nhau, chỉ giữ nhãn của đơn vị hoặc nhóm lớn nhất. Đơn vị không rõ loại không thắng đơn vị đã biết; cùng kích thước thì giữ nhãn đầu tiên. Nếu nhãn không vừa, các dòng của nó được cắt bớt trước (từ dòng cuối); chỉ bị loại khi ngay cả dòng đầu cũng chồng.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = Tiến độ nhận dạng
unit.UnitStatus/TrackIdentProgress = tương đối, hàng chục %
help.UnitStatus/TrackIdentProgress = Track State: tiến độ nhận dạng mục tiêu ở mức tương đối, theo hàng chục phần trăm (thời gian ESM của bạn quan sát các nguồn phát so với thời gian trò chơi cần để nhận dạng). 100% khi mục tiêu đã được nhận dạng. Chỉ trong bố cục được sắp xếp lại và chỉ khi có ESM của bạn đang quan sát mục tiêu. Nếu ESM đã xong phần của mình mà lớp vẫn chưa rõ, dòng sẽ ghi "không đủ dữ liệu"; ẩn khi mục tiêu đã được nhận dạng.
track.identProgress = Tiến độ nhận dạng
track.identNoData = không đủ dữ liệu

; --- new ---
tab.Event Log = Nhật ký sự kiện
grp.Links = Liên kết
lbl.EventLog/AllTracksAreLinks = Mọi liên lạc trong nhật ký là liên kết
unit.EventLog/AllTracksAreLinks = số hiệu dấu vết
help.EventLog/AllTracksAreLinks = Mọi số hiệu dấu vết trong Nhật ký sự kiện là một liên kết, như những cái do chính game tạo (Liên lạc mới, Dấu vết đã phân loại, Dấu vết mờ đi và tương tự là văn bản thường trong game): nhấp để chọn đối tượng, với CenterMapOnClick thì nhấp lại sẽ căn giữa bản đồ vào nó. Chỉ các dấu vết trong danh sách riêng của người chơi mới có liên kết.
lbl.EventLog/CenterMapOnClick = Căn giữa bản đồ khi nhấp lại
unit.EventLog/CenterMapOnClick = Màn hình chiến thuật
help.EventLog/CenterMapOnClick = Nhấp lại vào cùng liên kết liên lạc hoặc đơn vị trong Nhật ký sự kiện sẽ căn giữa bản đồ Màn hình chiến thuật vào đó (nhấp đầu tiên chỉ chọn, như trong game).
grp.Layout = Bố cục
lbl.EventLog/Compact = Bố cục gọn
unit.EventLog/Compact = ít khoảng cách
help.EventLog/Compact = Cửa sổ nhật ký sự kiện: lề, tiêu đề thẻ và khoảng cách dòng nhỏ hơn để hiện được nhiều dòng hơn. Cỡ chữ giữ nguyên.
lbl.Camera/BinocularsBelowHorizon = Ống nhòm tàu dưới đường chân trời
unit.Camera/BinocularsBelowHorizon = độ · 0 = game
help.Camera/BinocularsBelowHorizon = Ống nhòm tàu (góc nhìn quang học của tàu): có thể hạ thấp dưới đường chân trời bao nhiêu độ. Game dừng nó ở đường chân trời. 0 = như trong game.
lbl.Camera/BinocularsNormalView = Chế độ nhìn thường ở ống nhòm khi zoom tối đa
lbl.Camera/BinocularsNormalViewDayOnly = Chế độ nhìn thường chỉ ban ngày
help.Camera/BinocularsNormalView = Ống nhòm ở độ phóng đại tối đa bắt đầu với chế độ nhìn thường (game bắt đầu với bộ lọc đêm / nhiệt đang bật). Phím bộ lọc của game bật bộ lọc.
help.Camera/BinocularsNormalViewDayOnly = Chế độ nhìn thường là mặc định chỉ vào ban ngày; ban đêm giữ bộ lọc mặc định của game.
ref.propulsion = Động cơ
ref.pp.nuclear = Hạt nhân
ref.pp.steam = Hơi nước
ref.pp.gasturbine = Tua-bin khí
ref.pp.diesel = Diesel
ref.pp.electric = Điện
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = Động cơ trong dữ liệu tàu
help.UnitReference/ShowPropulsion = Thông tin đơn vị: thêm ô Động cơ vào các thông số chính của tàu và tàu ngầm, sau Max Speed: loại và công suất động cơ (hệ động lực chính và phụ). Áp dụng cho đơn vị hiển thị kế tiếp.
ref.propulsion.tip = Động cơ: loại và công suất động cơ (hệ động lực chính và phụ)
lbl.UnitStatus/DamageListsWheel = Con lăn cuộn danh sách các khu vực
help.UnitStatus/DamageListsWheel = Cửa sổ Unit Status, thẻ Kiểm soát thiệt hại: danh sách hư hại của các khu vực (Aft ... Forward: ngập nước, cháy, hệ thống hỏng) cuộn bằng con lăn chuột. Áp dụng cho thẻ hiển thị kế tiếp.
lbl.General/NoFrameLimit = Bỏ giới hạn FPS
unit.General/NoFrameLimit = tắt thanh trượt
help.General/NoFrameLimit = Không giới hạn tốc độ khung hình; thanh trượt phía trên bị tắt. Khi bật đồng bộ dọc, màn hình vẫn giới hạn tốc độ (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Thêm V-Sync thích ứng
unit.General/AddAdaptiveVSync = vào danh sách V-Sync
help.General/AddAdaptiveVSync = Thêm mục «Adaptive V-Sync» vào danh sách V-Sync trong tùy chọn video: đồng bộ dọc bật khi khung hình theo kịp màn hình và tắt khi không. Game lưu nó như V-Sync thông thường nên vẫn chạy bình thường khi không có mod này.
grp.Performance = Hiệu năng
grp.Text by background = Chữ theo nền
lbl.General/TextDarkAbove = Chữ tối khi sáng hơn
lbl.General/TextLightBelow = Chữ sáng khi tối hơn
unit.General/TextDarkAbove = độ sáng 0 - 1
unit.General/TextLightBelow = độ sáng 0 - 1
help.General/TextDarkAbove = Cửa sổ bật độ tương phản chữ và dải la bàn của cửa sổ World View: độ sáng của hình phía sau chữ (0 = đen, 1 = trắng) mà trên đó chữ chuyển sang tối. Thấp hơn = chữ tối đi trên hình tối hơn.
help.General/TextLightBelow = Độ sáng của hình phía sau chữ mà dưới đó chữ tối trở lại sáng (cửa sổ có độ tương phản chữ, dải la bàn). Không cao hơn “Chữ tối khi sáng hơn”; khoảng cách giữa hai giá trị tránh nhấp nháy ở độ sáng đó.

