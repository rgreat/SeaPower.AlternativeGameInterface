help.General/Language = Ngôn ngữ của văn bản mod: mã của một ngôn ngữ trong trò chơi (en, ru ...); để trống = ngôn ngữ riêng của trò chơi. Văn bản nằm trong các tệp lang/<mã>.ini ở thư mục mod – hãy sửa chúng để dịch.

help.General/AllowDragOutside = Cho phép kéo bất kỳ cửa sổ nào một phần ra ngoài vùng nhìn thấy (cạnh trái, phải và dưới).

help.General/MinVisiblePixels = Với AllowDragOutside: ít nhất chừng này pixel chiều rộng của cửa sổ vẫn hiện ở cạnh trái/phải. Ở cạnh dưới, thanh tiêu đề của cửa sổ luôn hiện.

help.General/MaximizeOnDoubleClick = Nhấp đúp vào thanh tiêu đề của cửa sổ để phóng to ra toàn màn hình, nhấp đúp lần nữa để khôi phục (cửa sổ đổi được kích thước). Cửa sổ đóng khi đang phóng to sẽ mở ở trạng thái phóng to (',max' sau bố cục của nó trong [Layouts]).

help.General/RemoveSizeLimits = Không giới hạn kích thước cho các cửa sổ được nhớ (WindowPatterns, kể cả Unit Reference): không có kích thước tối thiểu hoặc tối đa riêng (xuống tới 100x60 px) và việc đổi kích thước bằng một cạnh không bị chặn bởi mép màn hình (phần trên vẫn ở trên màn hình để với tới thanh tiêu đề). Bật/tắt có hiệu lực ngay với các cửa sổ đang hiện.

help.General/SnapWindows = Khi một cửa sổ được kéo hoặc đổi kích thước bằng chuột, các cạnh của nó bám vào cạnh của các cửa sổ khác và của màn hình khi chúng lại gần hơn SnapDistance (các cạnh nhìn thấy, không tính vùng đổi kích thước vô hình quanh cửa sổ).

help.General/SnapDistance = SnapWindows: một cạnh phải lại gần bao nhiêu thì bám, tính bằng pixel (1 - 50).

help.General/BringToFrontOnClick = Nhấp vào cửa sổ sẽ đưa nó lên trước các cửa sổ khác; cửa sổ mới mở cũng lên trước. Chỉ cửa sổ được sắp xếp lại, và chỉ dưới mức mà trò chơi đã cho chúng (Panel.ZIndex), nên những gì chính trò chơi hiển thị – buổi thông báo, tin nhắn – vẫn ở trên. Tactical Display / World View đang phóng to vẫn nằm dưới mọi cửa sổ khác.

help.General/CascadeOffset = Nhiều cửa sổ cùng một mẫu mở cùng lúc (vd. Weapon Reference): cửa sổ đầu giữ bố cục đã lưu và chỉ thay đổi của nó được lưu; mỗi cửa sổ tiếp theo mở lệch sang phải và xuống dưới chừng này pixel cho mỗi cửa sổ đã mở (được giữ trong màn hình như cửa sổ bị kéo). 0 = tất cả mở ở vị trí đã lưu.

help.General/SettingsButton = Nút bánh răng trên thanh tiêu đề của mỗi cửa sổ được nhớ (WindowPatterns) mở cửa sổ cài đặt Alternative Game Interface.

help.Mission/UnitPanelMenu = Nhiệm vụ: nhấp chuột phải vào cờ hoặc tên của đơn vị đã chọn trong bảng đơn vị ở dưới sẽ mở cùng menu như nhấp chuột phải vào đơn vị trên bản đồ.

help.General/FixContactInfo = Cửa sổ Information của một mục tiêu (ai phát hiện, bằng cảm biến nào, cách đây bao lâu): các lần phát hiện được tính tuổi theo cùng đồng hồ mà trò chơi dùng để đóng dấu chúng (trò chơi trộn hai đồng hồ, trong ván đã tải các trường bị để trống).

help.General/HideCustomMission = Menu chính: tệp mặc định của trình soạn "_Custom Mission" không hiện trong danh sách SCENARIOS.

help.General/Backgrounds = Ảnh nền của menu chính và màn hình tải. Mod: nếu mod có ảnh riêng (ui/backgrounds) thì chỉ hiện ảnh đó. Trộn: như game - chọn ngẫu nhiên từ ảnh của game và mọi mod. Game: chỉ ảnh của game.
val.General/Backgrounds.Mods = Chỉ từ mod
val.General/Backgrounds.Mixed = Trộn
val.General/Backgrounds.Game = Chỉ game

help.MissionEditor/RememberMissionFolder = Ảnh nền của menu chính và màn hình tải: khi các mod mang ảnh riêng (ui/backgrounds), chỉ ảnh của chúng được hiện, không trộn với ảnh của trò chơi. Tắt = như trò chơi: chọn ngẫu nhiên một ảnh trong số ảnh của trò chơi và của mọi mod gộp lại.

help.General/ColorIniFiles = Hộp chọn tệp của trình soạn nhiệm vụ: tên các tệp *.ini có màu xanh nhạt.

help.Campaign/StrictLoadouts = Task Force Builder của chiến dịch: phiên bản tàu và loadout chỉ được đưa ra cho những tàu mà nhiệm vụ liệt kê là có sẵn hoặc bạn đã sở hữu (trò chơi còn đưa ra mọi tàu có chung thẻ bách khoa). Được lưu cùng chiến dịch; chọn khi bắt đầu chiến dịch mới.

help.General/DeleteOldLogs = Khi khởi động trò chơi, các tệp nhật ký của các phiên trước (thư mục Logs của trò chơi: *_session_*, *_sessionEventLog_*) bị xóa; tệp của phiên này được giữ.

help.General/Debug = Bật ghi nhật ký chi tiết và BepInEx/AlternativeGameInterface.trace.txt.

help.General/WindowPatterns = Tên các cửa sổ cần nhớ, phân tách bằng dấu phẩy. Không phân biệt hoa thường, khoảng trắng bị bỏ qua khi so sánh ('Unit Status*' cũng khớp với 'UnitStatusView'), '*' khớp với văn bản bất kỳ (kể cả không có). Mẫu được so sánh với tên cửa sổ, văn bản tiêu đề, kiểu nội dung và kiểu view-model, và phải khớp với một trong các chuỗi đó từ đầu ('Unit Reference*' khớp với 'Unit Reference - XYZ'; dùng '*văn bản*' để khớp ở bất kỳ đâu). Các cửa sổ khớp cùng một mẫu dùng chung một bố cục đã lưu.

help.General/AddWindowKey = Trỏ chuột vào một cửa sổ và nhấn phím này để thêm cửa sổ đó vào WindowPatterns.

help.General/RememberOpenWindows = Các mẫu cửa sổ phân tách bằng dấu phẩy (cùng quy tắc như WindowPatterns) có trạng thái mở / đóng được nhớ: sau màn hình tải (bắt đầu nhiệm vụ, bách khoa) các cửa sổ này được mở hoặc đóng như lúc để lại. Trạng thái được lưu trong [OpenWindows]. Chỉ mở được những cửa sổ mà trò chơi đã tạo (vd. Unit Status cần một đơn vị được chọn).

help.WindowBorder/Enabled = Khung mỏng quanh mỗi cửa sổ kéo được, ở mép phần nhìn thấy của nó. Vẽ đè lên giao diện riêng của cửa sổ; không đổi kích thước cửa sổ và không bắt chuột.

help.WindowBorder/Thickness = Độ dày của khung tính bằng pixel (0.5 - 10). Khung không có cạnh trên (nó sẽ chạy dưới thanh tiêu đề).

help.WindowBorder/Color = Màu của khung: #RRGGBB hoặc #AARRGGBB (AA = độ mờ đục, 00 trong suốt - FF đặc).

help.WindowBorder/ToolTips = Khung cả quanh tooltip (gợi ý bật lên) của trò chơi, ở cả bốn cạnh, với độ dày và màu ở trên.

help.UnitStatus/SectionsMinHeight = Cửa sổ Unit Status, thẻ Damage Control: chiều cao tối thiểu của các bảng phần (Aft ... Forward cùng danh sách hư hại), tính bằng pixel màn hình. Cửa sổ thấp hơn sẽ thu chúng xuống mức này; dưới mức đó thẻ không thu nhỏ nữa và bảng 'Auto Damage Control Status' ở dưới bị đẩy ra khỏi cửa sổ. 0 = như trong trò chơi (cả thẻ có mức tối thiểu cố định; các bảng nhận phần các hàng khác để lại – hiển thị trong cửa sổ cài đặt).

help.UnitStatus/UnitReferenceTab = Cửa sổ Unit Status: một thẻ "Reference" (cuối cùng) với Unit Reference của đơn vị đã chọn – tàu / biến thể và loadout của nó – không có cây đơn vị và bảng tìm kiếm.

help.UnitStatus/FullUnitName = Cửa sổ Unit Status: tên đầy đủ của đơn vị trong tiêu đề (trò chơi hiện tên ngắn).

help.General/ImprovedUnitReferenceUI = Cải tiến cửa sổ Unit Reference: ẩn cây đơn vị (nút '<' ở cạnh trái) cũng ẩn bảng tìm kiếm / bộ lọc, làm cửa sổ hẹp đi bằng chiều rộng của cây và dời sang phải một đoạn bằng đó, nên thông tin đơn vị vẫn ở nguyên chỗ và chiếm phần trống ở trên (hiện cây thì ngược lại; bố cục đã lưu lưu cửa sổ ở trạng thái hiện cây); cây đơn vị rộng hơn với thanh chia ở cạnh phải có thể kéo bằng chuột (chiều rộng lưu trong [UnitReference] TreeWidth); quốc gia đã chọn được nhớ ([UnitReference] Country). Áp dụng cho các cửa sổ Unit Reference mở sau đó.

help.UnitReference/ShowLoadoutList = Unit Reference: hiện bộ chọn loadout cả cho tàu, tàu ngầm và đơn vị trên bộ có nhiều loadout (trò chơi chỉ hiện cho máy bay); thông tin đơn vị theo loadout đã chọn.

help.UnitReference/OptimizeTree = Cây Unit Reference: các lớp của một loại đơn vị được sắp theo ngày vào biên chế; trong nhóm lớp, mỗi đơn vị theo sau là các biến thể loadout của nó (theo ngày, Early trước), ghi là "Đơn vị [Biến thể]" (không có hậu tố cho Default hoặc một biến thể duy nhất); đơn vị không có loadout Default chỉ hiện các biến thể. Áp dụng cho các cửa sổ Unit Reference mở sau đó.

help.UnitReference/ScrollToSelected = Cây Unit Reference: cuộn cây sao cho đơn vị đã chọn hiện ra (ở giữa khi cửa sổ mở hoặc cây được hiện).

help.UnitReference/EarliestVariantOnClick = Cây Unit Reference: nhấp vào một lớp (nút có nhiều biến thể) chọn biến thể sớm nhất của nó. Trò chơi chọn biến thể đang phục vụ vào năm của nhiệm vụ, nếu không thì chọn biến thể muộn nhất.

help.UnitReference/KeepOpenedUnit = Unit Reference: đơn vị mà cửa sổ được mở cho vẫn ở lại trong cây cùng lớp của nó, kể cả khi các bộ lọc quốc gia / ngày / tìm kiếm / Chỉ có vũ khí sẽ ẩn nó.

help.UnitReference/TreeWheelOnlyOver = Cây Unit Reference: con lăn chuột chỉ cuộn cây khi con trỏ ở trên nó.

help.UnitReference/RememberSearchPanel = Bảng tìm kiếm của cửa sổ Unit Reference – danh mục, 'lọc theo ngày', 'chỉ tìm theo tên' và văn bản tìm kiếm – được giữ trong .cfg (các khóa bên dưới) và đặt lại khi mở cửa sổ Unit Reference (với ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference: danh sách quốc gia chỉ hiện các quốc gia có đơn vị cho văn bản tìm kiếm hiện tại, 'Lọc theo ngày' và 'Chỉ có vũ khí' (quốc gia đã chọn luôn được hiện).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: khi tắt 'Chỉ tìm theo tên', việc tìm kiếm cũng tìm đơn vị theo mô tả và theo id ini của chúng (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference: tooltip với trợ giúp ngắn (phần đầu của mô tả) của vũ khí, cảm biến hoặc hệ thống trên các liên kết được tô sáng, khi có.


