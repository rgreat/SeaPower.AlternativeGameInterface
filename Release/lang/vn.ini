pg.General = Chung
pg.Moving and snapping = Di chuyển và bám cạnh
pg.Order and look = Thứ tự và giao diện
pg.Menus = Menu
pg.Save and load = Lưu và tải
pg.Backgrounds = Hình nền
lang.default = Mặc định
lang.caption = Ngôn ngữ
