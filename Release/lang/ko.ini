grp.Text by background = 배경에 따른 글자색
lbl.General/TextDarkAbove = 글자가 어두워지는 밝기
lbl.General/TextLightBelow = 글자가 밝아지는 밝기
unit.General/TextDarkAbove = 밝기 0 - 1
unit.General/TextLightBelow = 밝기 0 - 1
help.General/TextDarkAbove = 글자 대비가 켜진 창과 월드 뷰 창의 나침반 띠: 글자 뒤 화면의 밝기(0 = 검정, 1 = 흰색)가 이 값을 넘으면 글자가 어두워집니다. 낮출수록 더 어두운 화면에서도 글자가 어두워집니다.
help.General/TextLightBelow = 글자 뒤 화면의 밝기가 이 값 아래로 내려가면 어두운 글자가 다시 밝아집니다(글자 대비 창, 나침반 띠). '글자가 어두워지는 밝기'보다 높지 않아야 하며, 둘 사이의 간격이 그 밝기 근처에서의 깜박임을 막습니다.

