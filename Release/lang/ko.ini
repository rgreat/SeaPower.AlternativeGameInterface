help.General/Language = 모드 텍스트의 언어: 게임 언어의 코드(en, ru ...). 비어 있으면 = 게임 자체의 언어. 텍스트는 모드 폴더의 lang/<코드>.ini 파일에 있으며, 편집하여 번역할 수 있습니다.

help.General/AllowDragOutside = 모든 창을 보이는 영역 밖으로 일부 끌 수 있도록 허용합니다(왼쪽, 오른쪽, 아래쪽 가장자리).

help.General/MinVisiblePixels = AllowDragOutside 사용 시: 창 너비 중 최소 이 픽셀 수가 왼쪽/오른쪽 가장자리에 보이도록 남습니다. 아래쪽 가장자리에서는 창의 제목 표시줄이 항상 보입니다.

help.General/MaximizeOnDoubleClick = 창의 제목 표시줄을 더블 클릭하면 전체 화면으로 최대화되고, 다시 더블 클릭하면 복원됩니다(크기를 조절할 수 있는 창). 최대화된 상태로 닫은 창은 최대화되어 열립니다([Layouts]의 레이아웃 뒤에 ',max').

help.General/RemoveSizeLimits = 기억된 창(유닛 상세정보를 포함한 WindowPatterns)의 크기 제한 없음: 자체 최소/최대 크기가 없으며(100x60 px까지) 가장자리로 크기를 조절할 때 화면 가장자리에서 멈추지 않습니다(위쪽은 화면에 남아 제목 표시줄에 닿을 수 있습니다). 전환하면 화면에 있는 창에 즉시 적용됩니다.

help.General/SnapWindows = 창을 마우스로 끌거나 크기를 조절할 때, 가장자리가 다른 창과 화면의 가장자리에 SnapDistance보다 가까워지면 스냅됩니다(보이는 가장자리 기준이며, 창 주위의 보이지 않는 크기 조절 영역은 제외).

help.General/SnapDistance = SnapWindows: 가장자리가 스냅되려면 얼마나 가까워야 하는지(픽셀, 1 - 50).

help.General/BringToFrontOnClick = 창을 클릭하면 다른 창보다 앞으로 나오며, 새로 열린 창도 앞으로 나옵니다. 창만 순서가 바뀌고 게임이 부여한 수준(Panel.ZIndex) 아래에서만 바뀌므로 게임이 직접 표시하는 것(브리핑, 메시지)은 위에 남습니다. 최대화된 전술 화면 / 월드 뷰는 다른 모든 창 아래에 남습니다.

help.General/CascadeOffset = 같은 패턴의 창이 여러 개 동시에 열릴 때(예: 무장 정보): 첫 번째는 저장된 레이아웃을 유지하고 그 변경 사항만 저장됩니다. 이후 창은 이미 열린 창 하나당 이 픽셀 수만큼 오른쪽 아래로 이동하여 열립니다(끈 창처럼 화면 안에 유지됨). 0 = 모두 저장된 위치에서 엽니다.

help.General/SettingsButton = 기억된 각 창(WindowPatterns)의 제목 표시줄에 있는 톱니바퀴 버튼이 Alternative Game Interface 설정 창을 엽니다.

help.Mission/UnitPanelMenu = 미션: 아래쪽 유닛 패널에서 선택한 유닛의 깃발이나 이름을 마우스 오른쪽 버튼으로 클릭하면 지도의 유닛을 오른쪽 클릭했을 때와 같은 메뉴가 열립니다.


help.General/EncyclopediaSplit = 메인 메뉴: "백과사전"은 유닛 상세정보 창을 엽니다(미션을 불러오지 않음). "백과사전 3D"는 게임의 기존 항목으로 백과사전 미션을 불러옵니다.
lbl.General/FitNewsWindow = 뉴스 창이 빈 영역을 채움
help.General/FitNewsWindow = 메인 메뉴: 뉴스 창이 메뉴 오른쪽의 빈 영역(화면 위쪽부터 팁 표시줄까지)을 차지하며 완전히 투명하고 내용은 120 %입니다. 뉴스 창을 옮기거나 크기나 모양을 바꾸면(이미 바꿨던 경우도) 자동으로 꺼지며, 다시 켜면 직접 정한 위치, 크기, 모양이 지워집니다.
grp.Game = 게임
lbl.General/ShowGameVersion = 게임 버전 워터마크
help.General/ShowGameVersion = 화면의 게임 버전 텍스트: 게임이 정한 대로(베타 브랜치 또는 [Debug] ShowVersionWatermark), 항상 표시 또는 항상 숨김. 메모리에서만 설정하며 게임 파일은 바꾸지 않습니다.
val.General/ShowGameVersion.Game = 게임대로
val.General/ShowGameVersion.Show = 표시
val.General/ShowGameVersion.Hide = 숨김
tab.World View = 월드 뷰
grp.Camera offset = 카메라 오프셋
cam.conflict = Camera Offset 모드가 로드되어 있습니다: 카메라 오프셋은 그 모드의 창(F11)에서 설정합니다. 이 설정은 사용되지 않습니다.
lbl.WorldView/CameraOffset = 화면 이동
help.WorldView/CameraOffset = 월드 뷰의 3D 화면을 이동해 추적 중인 대상이 중앙에서 벗어나게 합니다(Camera Offset 모드와 같음; 그 모드가 로드되면 회색으로 표시). 추적 카메라에서만, 쌍안경 / 잠망경에서는 적용 안 됨. Apply 전에 바로 적용.
lbl.WorldView/CameraOffsetFollowX = 화면 속 추적 대상
unit.WorldView/CameraOffsetFollowX = % (화면 비율)
help.WorldView/CameraOffsetFollowX = 추적 대상이 화면에서 놓이는 위치, 중앙 기준 화면 대비 % (±25 %). 조준선 위의 점을 끌거나, 조준선을 클릭하거나, 화살표를 사용하세요.
help.General/FixSoundOnReload = 미션에서 저장 파일을 불러올 때 카메라가 없는 동안에도 거리 기반 효과음이 계속 갱신되어 매 프레임 오류 창이 뜹니다. 이러한 오류를 표시하지 않습니다.
help.General/HideCustomMission = 메인 메뉴: 편집기의 기본 파일 "_Custom Mission"이 시나리오 목록에 표시되지 않습니다.

help.General/Backgrounds = 메인 메뉴와 로딩 화면의 배경 이미지. 모드: 모드가 자체 이미지(ui/backgrounds)를 제공하면 그것만 표시. 혼합: 게임과 동일 - 게임과 모든 모드의 이미지 중 무작위. 게임: 게임 기본 이미지만.
val.General/Backgrounds.Mods = 모드만
val.General/Backgrounds.Mixed = 혼합
val.General/Backgrounds.Game = 게임만
help.Monitors/Enabled = 데스크톱 모드: 다른 모니터도 주 모니터처럼 동작하며 창을 놓을 수 있습니다(창 메뉴의 '모니터'). 게임 자체의 두 번째 모니터 지도와 월드 뷰 모니터는 사용되지 않습니다. 다음 임무 시작부터 적용됩니다.
help.General/RealPhotos = 이 모드 자체 이미지(실제 사진, ui/backgrounds)를 메뉴와 로딩 화면 배경에 포함합니다. 끔: 표시되지 않으며, 다른 모드가 이미지를 제공하지 않으면 '배경 이미지' 설정과 관계없이 게임 기본 이미지가 표시됩니다.
help.General/MenuBackground = 메인 메뉴의 배경입니다. 비디오: 게임 기본 반복 영상. 슬라이드쇼: 배경 이미지('배경 이미지' 참조)가 설정한 시간마다 바뀝니다. 이때 비디오는 불러오지 않아 자원을 절약합니다.
val.General/MenuBackground.Video = 게임 비디오
val.General/MenuBackground.Slideshow = 이미지 슬라이드쇼
help.General/SlideshowSeconds = 메인 메뉴 슬라이드쇼: 이미지 한 장이 표시되는 시간(초).

help.MissionEditor/RememberMissionFolder = 메인 메뉴와 로딩 화면의 배경 이미지: 모드가 자체 이미지(ui/backgrounds)를 제공하면 그것만 표시하고 게임 이미지와 섞지 않습니다. 끔 = 게임과 동일: 게임과 모든 모드의 이미지를 합쳐 무작위로 하나를 고릅니다.
help.General/RememberSaveFolder = 게임 저장/불러오기 창(일시정지 메뉴, 메인 메뉴, 캠페인)이 마지막으로 사용한 폴더에서 열립니다. 캠페인 저장과 미션 저장은 각자의 폴더를 기억합니다.
help.General/DoubleClickOpen = 불러오기 등 파일을 여는 창에서 더블 클릭하면 열기 버튼처럼 파일이 열리고, 메인 메뉴의 시나리오 목록에서는 플레이 버튼처럼 시나리오가 시작됩니다. 저장 창은 바뀌지 않습니다.
lbl.General/AutoOpenLoad = 시나리오·캠페인 진입 시 불러오기 열기
help.General/AutoOpenLoad = 메인 메뉴: 시나리오나 캠페인에 들어가면 바로 불러오기 창을 엽니다.
lbl.General/MenuWindowsAside = 메뉴 창을 버튼 옆에
unit.General/MenuWindowsAside = 불러오기 등, 메뉴를 가리지 않음
help.General/MenuWindowsAside = 메인 메뉴 화면(시나리오, 캠페인 등): 창(불러오기 등)이 메뉴 버튼 위가 아니라 옆에 열립니다.
lbl.General/FilePickerTall = 파일 선택 창 높이 제한 없음
help.General/FilePickerTall = 파일 선택 창(불러오기/저장 등)의 최대 높이 제한을 없앱니다(게임 기본은 400).

help.General/ColorIniFiles = 미션 편집기 파일 선택기: *.ini 파일 이름이 연한 파란색으로 표시됩니다.

help.Campaign/StrictLoadouts = 캠페인 기동부대 만들기: 미션이 사용 가능으로 지정했거나 이미 보유한 함정에 대해서만 함정 버전과 로드아웃을 제공합니다(게임은 백과사전 태그를 공유하는 모든 함정도 제공합니다). 캠페인과 함께 저장되며 새 캠페인을 시작할 때 선택합니다.

help.General/DeleteOldLogs = 게임 시작 시 이전 세션의 로그 파일(게임의 Logs 폴더: *_session_*, *_sessionEventLog_*)을 삭제합니다. 이번 세션의 것은 남습니다.

help.General/Debug = 자세한 로깅과 BepInEx/AlternativeGameInterface.trace.txt를 켭니다.
help.Debug/TracePeriodic = 디버그 추적이 켜져 있을 때: 계속 기록되는 진단 정보도 함께 남깁니다(전술 화면의 모든 라벨을 2초마다, 리더에 의한 편대 갱신, 창 스냅, 프로파일러). 끄면 이벤트만 기록되어 파일이 작습니다. 짧은 테스트에만 켜세요. 파일이 수 MB씩 커집니다.

help.General/WindowPatterns = 기억할 창의 이름을 쉼표로 구분하여 입력합니다. 대소문자를 구분하지 않으며 비교 시 공백은 무시합니다('유닛 상태*'는 'UnitStatusView'와도 일치). '*'는 임의의 텍스트(없는 경우 포함)와 일치합니다. 패턴은 창의 이름, 헤더 텍스트, 콘텐츠 형식, view-model 형식과 비교되며 그중 하나와 처음부터 일치해야 합니다('유닛 상세정보*'는 '유닛 상세정보 - XYZ'와 일치하며, 어디서든 일치시키려면 '*텍스트*' 사용). 같은 패턴과 일치하는 창은 저장된 레이아웃 하나를 공유합니다.

help.General/AddWindowKey = 창 위에 마우스를 올리고 이 키를 누르면 그 창이 WindowPatterns에 추가됩니다.

help.General/RememberOpenWindows = 열림/닫힘 상태를 기억할 창 패턴을 쉼표로 구분하여 입력합니다(WindowPatterns와 같은 규칙). 로딩 화면(미션 시작, 백과사전) 후 이 창들은 마지막 상태대로 열리거나 닫힙니다. 상태는 [OpenWindows]에 저장됩니다. 게임이 이미 만든 창만 열 수 있습니다(예: 유닛 상태는 선택된 유닛이 필요).

help.WindowBorder/Enabled = 끌 수 있는 모든 창의 보이는 부분 가장자리에 얇은 테두리를 표시합니다. 창 자체의 모양 위에 그려지며 창 크기를 바꾸거나 마우스를 가로채지 않습니다.

help.WindowBorder/Thickness = 테두리 두께(픽셀, 0.5 - 10). 테두리에는 위쪽 변이 없습니다(제목 표시줄 아래로 지나가기 때문).

help.WindowBorder/Color = 테두리 색상: #RRGGBB 또는 #AARRGGBB(AA = 불투명도, 00 투명 - FF 불투명).

help.WindowBorder/ToolTips = 게임의 툴팁(팝업 힌트) 주위에도 위의 두께와 색상으로 네 면에 테두리를 표시합니다.

help.UnitStatus/SectionsMinHeight = 유닛 상태 창, 보수반 설정 탭: 섹션 패널(Aft ... Forward 및 피해 목록)의 최소 높이(화면 픽셀). 창이 더 낮으면 이 값까지 줄어들고, 그 이하로는 탭이 더 줄어들지 않으며 아래의 'Auto 보수반 설정 Status' 패널이 창 밖으로 밀려납니다. 0 = 게임과 동일(탭 전체에 고정된 최소값이 있으며 패널은 다른 행이 남기는 만큼을 받습니다. 설정 창에 표시됨).

help.UnitStatus/UnitReferenceTab = 유닛 상태 창: 선택한 유닛의 유닛 상세정보(함정/형식과 로드아웃)를 유닛 트리와 검색 패널 없이 보여 주는 "Reference" 탭(마지막).


help.General/ImprovedUnitReferenceUI = 유닛 상세정보 창 개선: 유닛 트리를 숨기면('<' 버튼, 왼쪽 가장자리) 검색/필터 패널도 숨겨지고 창이 트리 너비만큼 좁아지며 같은 만큼 오른쪽으로 이동하므로 유닛 정보는 제자리에 남고 위쪽의 빈 공간을 차지합니다(트리를 표시하면 반대로 됨. 저장된 레이아웃은 트리가 표시된 창을 저장). 오른쪽 가장자리에 마우스로 끌 수 있는 분할선이 있는 더 넓은 유닛 트리(너비는 [UnitReference] TreeWidth에 저장). 선택한 국가를 기억합니다([UnitReference] Country). 이후에 여는 유닛 상세정보 창에 적용됩니다.

help.UnitReference/ShowLoadoutList = 유닛 상세정보: 로드아웃이 여러 개인 함정, 잠수함, 지상 유닛에도 로드아웃 선택기를 표시합니다(게임은 항공기에만 표시). 유닛 정보는 선택한 로드아웃을 따릅니다.

help.UnitReference/OptimizeTree = 유닛 상세정보 트리: 유닛 종류의 클래스를 취역일순으로 정렬합니다. 클래스 그룹에서는 각 유닛 뒤에 로드아웃 형식이 따르며(날짜순, Early가 먼저) "유닛 [형식]"으로 표시됩니다(Default 또는 단일 형식은 접미사 없음). Default 로드아웃이 없는 유닛은 형식만 표시합니다. 이후에 여는 유닛 상세정보 창에 적용됩니다.

help.UnitReference/ScrollToSelected = 유닛 상세정보 트리: 선택한 유닛이 보이도록 트리를 스크롤합니다(창을 열거나 트리를 표시할 때 가운데로).

help.UnitReference/EarliestVariantOnClick = 유닛 상세정보 트리: 클래스(형식이 여러 개인 노드)를 클릭하면 가장 이른 형식이 선택됩니다. 게임은 미션 연도에 현역인 형식을 선택하고, 없으면 가장 최신을 선택합니다.

help.UnitReference/KeepOpenedUnit = 유닛 상세정보: 창을 열 때 대상이던 유닛은 국가/날짜/검색/무장 있는 것만 필터가 숨기려 해도 클래스와 함께 트리에 남습니다.

help.UnitReference/TreeWheelOnlyOver = 유닛 상세정보 트리: 마우스 휠은 커서가 트리 위에 있을 때만 트리를 스크롤합니다.

help.UnitReference/RememberSearchPanel = 유닛 상세정보 창의 검색 패널(범주, '날짜로 필터', '이름으로만 검색', 검색 텍스트)은 .cfg(아래 키)에 보관되고 유닛 상세정보 창을 열 때 다시 설정됩니다(ImprovedUnitReferenceUI 사용 시).

help.UnitReference/HideEmptyCountries = 유닛 상세정보: 국가 목록은 현재 검색 텍스트, '날짜로 필터', '무장 있는 것만'에 해당하는 유닛이 있는 국가만 표시합니다(선택한 국가는 항상 표시).

help.UnitReference/SearchInDescriptionAndId = 유닛 상세정보: '이름으로만 검색'이 꺼져 있으면 검색은 유닛의 설명과 ini id(<Id>.ini)로도 유닛을 찾습니다.

help.UnitReference/LinkHelp = 유닛 상세정보: 강조된 링크에서 짧은 도움말이 있는 무기, 센서 또는 시스템의 도움말(설명의 시작 부분)을 툴팁으로 표시합니다.


