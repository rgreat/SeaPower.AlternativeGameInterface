lbl.UnitReference/ShowPropulsion = Propulsion in ship data
help.UnitReference/ShowPropulsion = Unit Reference: a Propulsion cell in the main parameters of ships and submarines, after Max Speed: the type and power of the engines (main and auxiliary power plant). Applies to the next unit shown.
ref.propulsion.tip = Propulsion: type and power of the engines (main and auxiliary power plant)
