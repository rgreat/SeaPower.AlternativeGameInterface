lbl.UnitReference/ShowPropulsion = 함정 데이터에 추진 표시
help.UnitReference/ShowPropulsion = 유닛 상세정보: 함정과 잠수함의 주요 매개변수에서 Max Speed 뒤에 추진 칸을 추가합니다: 엔진의 종류와 출력(주 및 보조 동력). 다음에 표시되는 유닛부터 적용됩니다.
ref.propulsion.tip = 추진: 엔진의 종류와 출력(주 및 보조 동력)
lbl.UnitStatus/DamageListsWheel = 휠로 구역 목록 스크롤
help.UnitStatus/DamageListsWheel = 유닛 상태 창, 보수반 설정 탭: 구역(Aft ... Forward: 침수, 화재, 손상된 장비)의 피해 목록이 마우스 휠로 스크롤됩니다. 다음에 표시되는 탭부터 적용됩니다.
lbl.General/NoFrameLimit = 프레임 제한 해제
unit.General/NoFrameLimit = 슬라이더 비활성
help.General/NoFrameLimit = 프레임 속도를 제한하지 않으며 위의 슬라이더는 비활성화됩니다. 수직 동기화가 켜져 있으면 화면 주사율이 계속 상한이 됩니다 (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = 적응형 V-Sync 추가
unit.General/AddAdaptiveVSync = V-Sync 목록에
help.General/AddAdaptiveVSync = 비디오 옵션의 V-Sync 목록에 'Adaptive V-Sync' 항목을 추가합니다. 프레임이 화면을 따라가는 동안에는 수직 동기화가 켜지고, 따라가지 못하면 꺼집니다. 게임에는 일반 수직 동기화로 저장되므로 이 모드가 없어도 정상 동작합니다.
