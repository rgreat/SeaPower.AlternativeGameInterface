help.General/Language = 모드 텍스트의 언어: 게임 언어의 코드(en, ru ...). 비어 있으면 = 게임 자체의 언어. 텍스트는 모드 폴더의 lang/<코드>.ini 파일에 있으며, 편집하여 번역할 수 있습니다.

help.General/AllowDragOutside = 모든 창을 보이는 영역 밖으로 일부 끌 수 있도록 허용합니다(왼쪽, 오른쪽, 아래쪽 가장자리).

help.General/MinVisiblePixels = AllowDragOutside 사용 시: 창 너비 중 최소 이 픽셀 수가 왼쪽/오른쪽 가장자리에 보이도록 남습니다. 아래쪽 가장자리에서는 창의 제목 표시줄이 항상 보입니다.

help.General/MaximizeOnDoubleClick = 창의 제목 표시줄을 더블 클릭하면 전체 화면으로 최대화되고, 다시 더블 클릭하면 복원됩니다(크기를 조절할 수 있는 창). 최대화된 상태로 닫은 창은 최대화되어 열립니다([Layouts]의 레이아웃 뒤에 ',max').

help.General/RemoveSizeLimits = 기억된 창(Unit Reference를 포함한 WindowPatterns)의 크기 제한 없음: 자체 최소/최대 크기가 없으며(100x60 px까지) 가장자리로 크기를 조절할 때 화면 가장자리에서 멈추지 않습니다(위쪽은 화면에 남아 제목 표시줄에 닿을 수 있습니다). 전환하면 화면에 있는 창에 즉시 적용됩니다.

help.General/SnapWindows = 창을 마우스로 끌거나 크기를 조절할 때, 가장자리가 다른 창과 화면의 가장자리에 SnapDistance보다 가까워지면 스냅됩니다(보이는 가장자리 기준이며, 창 주위의 보이지 않는 크기 조절 영역은 제외).

help.General/SnapDistance = SnapWindows: 가장자리가 스냅되려면 얼마나 가까워야 하는지(픽셀, 1 - 50).

help.General/BringToFrontOnClick = 창을 클릭하면 다른 창보다 앞으로 나오며, 새로 열린 창도 앞으로 나옵니다. 창만 순서가 바뀌고 게임이 부여한 수준(Panel.ZIndex) 아래에서만 바뀌므로 게임이 직접 표시하는 것(브리핑, 메시지)은 위에 남습니다. 최대화된 Tactical Display / World View는 다른 모든 창 아래에 남습니다.

help.General/CascadeOffset = 같은 패턴의 창이 여러 개 동시에 열릴 때(예: Weapon Reference): 첫 번째는 저장된 레이아웃을 유지하고 그 변경 사항만 저장됩니다. 이후 창은 이미 열린 창 하나당 이 픽셀 수만큼 오른쪽 아래로 이동하여 열립니다(끈 창처럼 화면 안에 유지됨). 0 = 모두 저장된 위치에서 엽니다.

help.General/SettingsButton = 기억된 각 창(WindowPatterns)의 제목 표시줄에 있는 톱니바퀴 버튼이 Alternative Game Interface 설정 창을 엽니다.

help.Mission/UnitPanelMenu = 미션: 아래쪽 유닛 패널에서 선택한 유닛의 깃발이나 이름을 마우스 오른쪽 버튼으로 클릭하면 지도의 유닛을 오른쪽 클릭했을 때와 같은 메뉴가 열립니다.

help.General/FixContactInfo = 접촉의 Information 창(누가, 어떤 센서로, 얼마 전에 탐지했는지): 탐지 기록은 게임이 찍는 것과 같은 시계로 경과 시간이 계산됩니다(게임은 두 시계를 섞어 쓰며, 불러온 게임에서는 필드가 비어 있습니다).

help.General/HideCustomMission = 메인 메뉴: 편집기의 기본 파일 "_Custom Mission"이 SCENARIOS 목록에 표시되지 않습니다.

help.General/Backgrounds = 메인 메뉴와 로딩 화면의 배경 이미지. 모드: 모드가 자체 이미지(ui/backgrounds)를 제공하면 그것만 표시. 혼합: 게임과 동일 - 게임과 모든 모드의 이미지 중 무작위. 게임: 게임 기본 이미지만.
val.General/Backgrounds.Mods = 모드만
val.General/Backgrounds.Mixed = 혼합
val.General/Backgrounds.Game = 게임만

help.MissionEditor/RememberMissionFolder = 메인 메뉴와 로딩 화면의 배경 이미지: 모드가 자체 이미지(ui/backgrounds)를 제공하면 그것만 표시하고 게임 이미지와 섞지 않습니다. 끔 = 게임과 동일: 게임과 모든 모드의 이미지를 합쳐 무작위로 하나를 고릅니다.

help.General/ColorIniFiles = 미션 편집기 파일 선택기: *.ini 파일 이름이 연한 파란색으로 표시됩니다.

help.Campaign/StrictLoadouts = 캠페인 Task Force Builder: 미션이 사용 가능으로 지정했거나 이미 보유한 함정에 대해서만 함정 버전과 로드아웃을 제공합니다(게임은 백과사전 태그를 공유하는 모든 함정도 제공합니다). 캠페인과 함께 저장되며 새 캠페인을 시작할 때 선택합니다.

help.General/DeleteOldLogs = 게임 시작 시 이전 세션의 로그 파일(게임의 Logs 폴더: *_session_*, *_sessionEventLog_*)을 삭제합니다. 이번 세션의 것은 남습니다.

help.General/Debug = 자세한 로깅과 BepInEx/AlternativeGameInterface.trace.txt를 켭니다.

help.General/WindowPatterns = 기억할 창의 이름을 쉼표로 구분하여 입력합니다. 대소문자를 구분하지 않으며 비교 시 공백은 무시합니다('Unit Status*'는 'UnitStatusView'와도 일치). '*'는 임의의 텍스트(없는 경우 포함)와 일치합니다. 패턴은 창의 이름, 헤더 텍스트, 콘텐츠 형식, view-model 형식과 비교되며 그중 하나와 처음부터 일치해야 합니다('Unit Reference*'는 'Unit Reference - XYZ'와 일치하며, 어디서든 일치시키려면 '*텍스트*' 사용). 같은 패턴과 일치하는 창은 저장된 레이아웃 하나를 공유합니다.

help.General/AddWindowKey = 창 위에 마우스를 올리고 이 키를 누르면 그 창이 WindowPatterns에 추가됩니다.

help.General/RememberOpenWindows = 열림/닫힘 상태를 기억할 창 패턴을 쉼표로 구분하여 입력합니다(WindowPatterns와 같은 규칙). 로딩 화면(미션 시작, 백과사전) 후 이 창들은 마지막 상태대로 열리거나 닫힙니다. 상태는 [OpenWindows]에 저장됩니다. 게임이 이미 만든 창만 열 수 있습니다(예: Unit Status는 선택된 유닛이 필요).

help.WindowBorder/Enabled = 끌 수 있는 모든 창의 보이는 부분 가장자리에 얇은 테두리를 표시합니다. 창 자체의 모양 위에 그려지며 창 크기를 바꾸거나 마우스를 가로채지 않습니다.

help.WindowBorder/Thickness = 테두리 두께(픽셀, 0.5 - 10). 테두리에는 위쪽 변이 없습니다(제목 표시줄 아래로 지나가기 때문).

help.WindowBorder/Color = 테두리 색상: #RRGGBB 또는 #AARRGGBB(AA = 불투명도, 00 투명 - FF 불투명).

help.WindowBorder/ToolTips = 게임의 툴팁(팝업 힌트) 주위에도 위의 두께와 색상으로 네 면에 테두리를 표시합니다.

help.UnitStatus/SectionsMinHeight = Unit Status 창, Damage Control 탭: 섹션 패널(Aft ... Forward 및 피해 목록)의 최소 높이(화면 픽셀). 창이 더 낮으면 이 값까지 줄어들고, 그 이하로는 탭이 더 줄어들지 않으며 아래의 'Auto Damage Control Status' 패널이 창 밖으로 밀려납니다. 0 = 게임과 동일(탭 전체에 고정된 최소값이 있으며 패널은 다른 행이 남기는 만큼을 받습니다. 설정 창에 표시됨).

help.UnitStatus/UnitReferenceTab = Unit Status 창: 선택한 유닛의 Unit Reference(함정/형식과 로드아웃)를 유닛 트리와 검색 패널 없이 보여 주는 "Reference" 탭(마지막).

help.UnitStatus/FullUnitName = Unit Status 창: 헤더에 유닛의 전체 이름을 표시합니다(게임은 짧은 이름을 표시).

help.General/ImprovedUnitReferenceUI = Unit Reference 창 개선: 유닛 트리를 숨기면('<' 버튼, 왼쪽 가장자리) 검색/필터 패널도 숨겨지고 창이 트리 너비만큼 좁아지며 같은 만큼 오른쪽으로 이동하므로 유닛 정보는 제자리에 남고 위쪽의 빈 공간을 차지합니다(트리를 표시하면 반대로 됨. 저장된 레이아웃은 트리가 표시된 창을 저장). 오른쪽 가장자리에 마우스로 끌 수 있는 분할선이 있는 더 넓은 유닛 트리(너비는 [UnitReference] TreeWidth에 저장). 선택한 국가를 기억합니다([UnitReference] Country). 이후에 여는 Unit Reference 창에 적용됩니다.

help.UnitReference/ShowLoadoutList = Unit Reference: 로드아웃이 여러 개인 함정, 잠수함, 지상 유닛에도 로드아웃 선택기를 표시합니다(게임은 항공기에만 표시). 유닛 정보는 선택한 로드아웃을 따릅니다.

help.UnitReference/OptimizeTree = Unit Reference 트리: 유닛 종류의 클래스를 취역일순으로 정렬합니다. 클래스 그룹에서는 각 유닛 뒤에 로드아웃 형식이 따르며(날짜순, Early가 먼저) "유닛 [형식]"으로 표시됩니다(Default 또는 단일 형식은 접미사 없음). Default 로드아웃이 없는 유닛은 형식만 표시합니다. 이후에 여는 Unit Reference 창에 적용됩니다.

help.UnitReference/ScrollToSelected = Unit Reference 트리: 선택한 유닛이 보이도록 트리를 스크롤합니다(창을 열거나 트리를 표시할 때 가운데로).

help.UnitReference/EarliestVariantOnClick = Unit Reference 트리: 클래스(형식이 여러 개인 노드)를 클릭하면 가장 이른 형식이 선택됩니다. 게임은 미션 연도에 현역인 형식을 선택하고, 없으면 가장 최신을 선택합니다.

help.UnitReference/KeepOpenedUnit = Unit Reference: 창을 열 때 대상이던 유닛은 국가/날짜/검색/무장 있는 것만 필터가 숨기려 해도 클래스와 함께 트리에 남습니다.

help.UnitReference/TreeWheelOnlyOver = Unit Reference 트리: 마우스 휠은 커서가 트리 위에 있을 때만 트리를 스크롤합니다.

help.UnitReference/RememberSearchPanel = Unit Reference 창의 검색 패널(범주, '날짜로 필터', '이름으로만 검색', 검색 텍스트)은 .cfg(아래 키)에 보관되고 Unit Reference 창을 열 때 다시 설정됩니다(ImprovedUnitReferenceUI 사용 시).

help.UnitReference/HideEmptyCountries = Unit Reference: 국가 목록은 현재 검색 텍스트, '날짜로 필터', '무장 있는 것만'에 해당하는 유닛이 있는 국가만 표시합니다(선택한 국가는 항상 표시).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: '이름으로만 검색'이 꺼져 있으면 검색은 유닛의 설명과 ini id(<Id>.ini)로도 유닛을 찾습니다.

help.UnitReference/LinkHelp = Unit Reference: 강조된 링크에서 짧은 도움말이 있는 무기, 센서 또는 시스템의 도움말(설명의 시작 부분)을 툴팁으로 표시합니다.


