look.level.bottom = 맨 아래
look.level.default = 기본값
look.monitor = 모니터
look.level.top = 맨 위
look.outline.tip = 투명 창의 글자를 읽기 쉽게 유지합니다. 회색 글자는 순백 또는 순흑이 되어 외곽 효과가 붙고, 밝은 배경에서는 모든 글자가 어두워집니다(명도가 창 아래 화면의 밝기를 따르고 색조는 유지됩니다). 불투명도가 50% 미만이면 자동으로 켜지며 직접 바꿀 수 있습니다.
tab.Desktop mode = 데스크톱
tab.Tactical Display = 전술 화면
lbl.General/ResizeDockedWindows = 도킹한 창 크기 조절
unit.General/ResizeDockedWindows = 화면 가장자리에서 영역이 안쪽으로
help.General/ResizeDockedWindows = 화면 가장자리(또는 임무 HUD 하단 바)에 도킹된 창은 보이지 않는 크기 조절 영역이 화면 밖에 있어 마우스로 그 가장자리를 잡을 수 없습니다. 켜짐: 그런 가장자리에서는 영역이 창 안쪽으로 몇 픽셀 들어옵니다.
lbl.General/FixGameResizeCursors = 게임 크기 조절 커서 수정
unit.General/FixGameResizeCursors = 메뉴와 캠페인
help.General/FixGameResizeCursors = 임무 밖에서는 게임이 창(News, 기동부대 만들기)의 크기 조절 가장자리에 일반 화살표를 표시합니다. 커서가 로드되지 않았고 커서 처리기도 설치되지 않았기 때문입니다. 켜짐: 모드가 게임의 커서를 읽고 임무에서 쓰는 처리기를 설치합니다.
grp.Map = 지도
grp.Map drawing = 지도 그리기
lbl.General/KeepMapView = 크기 변경 시 지도 시야 유지
unit.General/KeepMapView = 확대가 창 크기를 따름
help.General/KeepMapView = 전술 화면 창 크기가 바뀌면 보이던 영역이 계속 보이도록 지도 확대도 함께 바뀝니다(지도 비율은 유지됨). 꺼짐: 확대는 그대로이며 큰 창은 지도를 더 많이, 작은 창은 더 적게 보여 줍니다.
lbl.General/MapFineZoomShift = Shift로 세밀한 확대/축소
unit.General/MapFineZoomShift = 휠 단계 5배 작게
help.General/MapFineZoomShift = 지도: Shift를 누른 채 마우스 휠을 돌리면 평소보다 5배 작은 단계로 지도를 확대/축소합니다.
grp.Desktop mode = 데스크톱 모드
lbl.General/WindowedMapAndWorldView = 데스크톱 모드 사용
unit.General/WindowedMapAndWorldView = 자유로운 이동과 크기 조절
help.General/WindowedMapAndWorldView = 데스크톱 모드. 전술 화면와 월드 뷰는 자유롭게 이동하고 크기를 바꿀 수 있는 일반 창으로만 동작합니다(다른 창과 같음): 최대화로 기억되지 않고([Layouts]에 ',max' 없음), 둘 다 항상 표시되며(게임이 지도 전체 화면 + 월드 뷰 상태로 한 번 전환됨), 다른 모든 창 아래에 있고 둘끼리만 자리를 바꿉니다. Toggle fullscreen minimap 키(기본 Tab)는 더 이상 지도를 전환하지 않고(데스크톱을 전환함, DesktopCount), 최대화 / 복원 버튼은 창에만 작용하며, 창 뒤 화면은 모드가 지웁니다(이 상태에서는 게임이 그리지 않음).
lbl.General/DesktopCount = 데스크톱 수
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = 데스크톱 모드: 데스크톱의 수(2 - 5). 게임의 Toggle fullscreen minimap 키(조작 - 일반, 기본 Tab)로 전환합니다. 각 데스크톱은 창의 위치와 크기, 열림 / 닫힘, 불투명도, 배율, 레벨, 월드 뷰 열림 여부를 유지합니다. 데스크톱은 모드의 기본 배치로 시작합니다(1: 월드 뷰(3D)가 위, 2: 전술 화면(지도)가 위, 3: 지도 전체 화면, 4: 3D 화면 전체, 5: 지도와 3D 화면 나란히).
lbl.General/WorldViewKey = 월드 뷰 켜기 / 끄기 키
unit.General/WorldViewKey = 기본값 Insert
help.General/WorldViewKey = 데스크톱 모드: 월드 뷰 창을 열고 닫는 키. 게임이 이미 쓰는 키(조작 - 해당 설정, 바꾼 것 포함)는 절대 사용되지 않습니다. 무시되고 로그에 기록됩니다. 없음 = 키 없음. 콘솔, 메뉴, 텍스트 상자가 키보드를 사용 중이거나 Shift / Ctrl / Alt를 누르고 있을 때는 동작하지 않습니다.
lbl.InMission/DragTimePanel = 끌 수 있는 시간 패널
unit.InMission/DragTimePanel = 더블클릭: 모서리로 복귀
help.InMission/DragTimePanel = 임무 HUD의 시간 패널(날짜 / 시간, 속도, 재생 / 일시정지)은 테두리, 속도 글자 또는 버튼 사이 빈 곳을 마우스로 끌어 옮길 수 있습니다. 더블클릭하면 모서리로 돌아갑니다.
grp.Task Force = 기동부대
lbl.Campaign/DismissDamaged = 손상된 함정 해임
unit.Campaign/DismissDamaged = 환급액 − 수리비
help.Campaign/DismissDamaged = 캠페인 기동부대 상태: 수리할 수 있는 손상된 함정을 해임할 수 있습니다. 환급액은 수리 비용만큼 줄어듭니다.
lbl.Campaign/SortLoadoutsByDate = 장비를 날짜순으로 정렬
unit.Campaign/SortLoadoutsByDate = 자체 버전 먼저
help.Campaign/SortLoadoutsByDate = 캠페인 기동부대, 장비 탭: 함정 자체 장비를 날짜순으로 정렬해 클래스의 더 새로운 버전보다 앞에 표시합니다(게임은 마지막에 표시).
lbl.Campaign/FixVersionSwapPrice = 버전 교체 가격 수정
unit.Campaign/FixVersionSwapPrice = 명부 가격
help.Campaign/FixVersionSwapPrice = 캠페인 기동부대, 장비 탭: 클래스의 다른 버전으로 선체를 교체하면 구매처럼 캠페인 명부의 가격으로 책정됩니다(게임은 새 선체에는 유닛의 ini 가격을, 보유한 함정에는 명부 가격을 써서, 명부 가격이 다르면 업그레이드가 환급이 되었습니다).
lbl.Campaign/UpgradeShip = 빌더의 함정 업그레이드 버튼
unit.Campaign/UpgradeShip = 승조원 -1 레벨
help.Campaign/UpgradeShip = 캠페인 기동부대 만들기: '함정 업그레이드' 버튼이 기동부대의 함정을 선택한 함정으로 교체합니다(해임 / 퇴역 가격으로 판매, 승조원은 숙련도가 한 단계 떨어짐).
lbl.Campaign/FixReserveSubmarines = 정비 중인 잠수함 수정
help.Campaign/FixReserveSubmarines = 재무장이나 수리를 보낸 잠수함에 대한 게임 버그를 고칩니다. 편성을 바꿔도 예비대에서 사라지지 않고, 정비 중에는 예비대의 함정처럼 잠수함 탭에 표시되며, 이미 사라진 잠수함은 캠페인 지도를 불러올 때 예비대로 돌아옵니다.
lbl.Campaign/EventShipState = 브리핑·신문 이벤트의 함선 상태
unit.Campaign/EventShipState = 마지막 임무 이후
help.Campaign/EventShipState = 캠페인 지도: 브리핑이나 신문 이벤트를 선택한 동안 Task Force가 마지막 임무 이후의 함선 상태를 표시합니다(게임은 첫 임무 이전 상태, 즉 탄약 가득·손상 수리됨으로 표시합니다).
grp.Game UI = 게임 인터페이스
grp.Diagnostics = 진단
grp.Mods = 모드
lbl.Debug/DumpXaml = 지금 XAML 덤프
help.Debug/DumpXaml = 개발용: 켜면 지금까지 로드된 게임 UI 에셋의 XAML을 BepInEx/AlternativeGameInterface_xaml에 기록한 뒤 스스로 꺼집니다(먼저 필요한 창을 여세요).
lbl.Debug/Snapshot = 지금 스냅샷 찍기
help.Debug/Snapshot = 게임 상태(프레임 시간, 메모리, 유형별 오브젝트, 로그 오류, 모드의 컬렉션)를 BepInEx/AlternativeGameInterface_snapshots.txt에 추가한 뒤 스스로 꺼집니다. 저장 전과 불러오기 후에 한 번씩, 또는 긴 세션의 초반과 후반에 찍으세요. 각 수치에 이전 스냅샷 대비 변화가 표시됩니다.
lbl.Debug/ScreenshotTabs = 모든 모드의 모든 탭 스크린샷 찍기
help.Debug/ScreenshotTabs = 진단용: 켜면 이 설정 창의 각 탭(과 각 페이지)에 대해 옵션 창 전체의 스크린샷을 찍고, 이어서 설치된 다른 rgreat 모드의 창에서도 같은 작업을 한 뒤 PNG 파일을 BepInEx/<Mod>_screens에 저장하고 스스로 꺼집니다. 창이 열려 있어야 합니다.
lbl.Debug/CollectGarbage = 지금 메모리 정리
help.Debug/CollectGarbage = 전체 가비지 컬렉션과 미사용 에셋 언로드를 한 번 실행하고, 전후 메모리를 BepInEx 로그에 기록합니다.
lbl.General/ModCreateFill = 모드 생성 자동 입력
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = 모드 생성 창(Mods 메뉴): Update Existing에서 워크샵 항목을 고르면 Pick Folder(StreamingAssets의 모드 폴더)와 Pick Image(그 폴더의 thumbnail.jpg)가 자동으로 채워집니다.
grp.Track State = Track State
lbl.UnitStatus/TrackState = 선택한 접촉의 Track State
help.UnitStatus/TrackState = 유닛 상태 창: 다른 진영의 접촉(항적, 자기 유닛이 아님)이 선택되어 있는 동안, 창은 비어 있는 대신 그 Track State(접촉의 정보 창: 상태, 신뢰도, 탐지, 신호 특성)를 표시합니다.
lbl.UnitStatus/TrackLayout = Track State 레이아웃 재구성
help.UnitStatus/TrackLayout = Track State: 창을 재구성합니다 - 핵심 정보는 간결하게, 탐지 장비는 높이가 제한된 스크롤 영역에, 나머지는 후보 표에 할당합니다. 끔: 게임 정보 창의 기본 레이아웃.
lbl.Map/ClipContactEllipse = 접촉 타원 자르기
unit.Map/ClipContactEllipse = 센서 뒤쪽
help.Map/ClipContactEllipse = 지도: 방위로 구한 접촉의 위치 추정을 방위 방향으로 압축하여 오차 타원이 센서 뒤쪽(방위의 반대편)으로 넘어가지 않게 합니다. 아이콘, 라벨의 거리, 타원이 새 추정을 따릅니다. 트래커 자체의 데이터는 바뀌지 않습니다.
lbl.Map/CompactSonobuoys = 소노부이 간략 표시
unit.Map/CompactSonobuoys = 절반 크기, 텍스트 없음
help.Map/CompactSonobuoys = 지도: 많은 소노부이가 동시에 보이면 아이콘을 절반 크기로 줄이고 텍스트를 없앱니다. 확대하여 수가 줄어들면 평소처럼 표시됩니다.
lbl.Map/SonobuoysThreshold = 소노부이 임계값
unit.Map/SonobuoysThreshold = 동시에 보이는 수
help.Map/SonobuoysThreshold = 소노부이 간략 표시: 지도에 동시에 보이는 소노부이가 이 수를 넘으면 간략 표시가 켜집니다. 이 값의 90% 아래로 내려가면 다시 꺼집니다.
lbl.Map/GroupSpreadMiles = 그룹 분산 한계: 함선·지상
unit.Map/GroupSpreadMiles = 해리(리더 기준)
help.Map/GroupSpreadMiles = 지도: 리더에서 이 해리 수보다 먼 편대 유닛(함선, 지상)은 독립 유닛으로 봅니다: 자체 라벨을 가지며 편대 이름을 두는 상자에 들어가지 않습니다.
lbl.Map/GroupSpreadMilesAir = 그룹 분산 한계: 항공기
unit.Map/GroupSpreadMilesAir = 해리(리더 기준)
help.Map/GroupSpreadMilesAir = 지도: 항공기와 헬기도 마찬가지로, 리더에서 이 해리 수보다 멀리 나는 유닛은 독립 유닛으로 봅니다.
lbl.Map/FormationLines = 그룹 연결선
unit.Map/FormationLines = 선택 시 리더에서 각 유닛으로
help.Map/FormationLines = 지도: 그룹의 유닛을 선택하면 리더에서 그룹의 모든 유닛으로 선을 그립니다.
lbl.Map/AirGroupInfo = 항공기 편대: 거리와 고도
unit.Map/AirGroupInfo = 이름 아래
help.Map/AirGroupInfo = 지도: 선택되지 않은 항공기·헬리콥터 편대의 라벨에 편대 이름 아래로 리더의 거리와 고도를 표시합니다(일반 라벨 규칙이 적용됩니다).
lbl.Map/FormationUpdateByLeader = 리더 기준 편대 갱신
unit.Map/FormationUpdateByLeader = 항공기가 함께 이동
help.Map/FormationUpdateByLeader = 지도: 같은 편대의 항공기와 헬리콥터는 리더가 새 위치를 받는 순간에 함께 새 지도 위치를 받습니다(게임은 무작위 시점에 유닛 하나씩 받습니다). 나머지 위치는 최대 1초 늦습니다.
lbl.Map/DrawingImprovements = 유닛 및 라벨 그리기 개선
unit.Map/DrawingImprovements = 마스터 스위치
help.Map/DrawingImprovements = 지도: 유닛과 라벨 그리기 개선의 마스터 스위치(소형 소노부이, 라벨 위치와 필터, 그룹 선, 접촉 타원 자르기). 끄면 게임이 기본대로 그리고 아래 옵션은 숨겨집니다.
lbl.Map/FriendlyBadgeInLabel = 라벨에 FRND 표시 넣기
unit.Map/FriendlyBadgeInLabel = 별도 줄
help.Map/FriendlyBadgeInLabel = 지도: 다른 진영 아군 유닛의 'FRND' 표시를 아이콘 옆이 아니라 라벨 첫 줄 위의 별도 줄로 넣습니다.
lbl.Map/LabelPlacement = 라벨 위치
help.Map/LabelPlacement = 지도: 유닛 라벨을 아이콘 기준 어느 쪽에 가운데 정렬로 둘지 정합니다(혼잡하면 옆으로 밀릴 수 있음). '게임 기본'은 기본 배치입니다.
val.Map/LabelPlacement.Game = 게임 기본
val.Map/LabelPlacement.Bottom = 가운데 아래
val.Map/LabelPlacement.Top = 가운데 위
val.Map/LabelPlacement.Right = 가운데 오른쪽
val.Map/LabelPlacement.Left = 가운데 왼쪽
lbl.Map/GroupNameOnly = 그룹 이름만 표시
unit.Map/GroupNameOnly = 선택 전까지
help.Map/GroupNameOnly = 지도: 그룹이 선택되기 전까지 그룹 내 유닛에는 그룹 이름만 표시합니다. 유닛 자신의 라벨은 마지막에, 공간이 있는 곳에만 추가됩니다(항공기와 헬리콥터 제외).
lbl.Map/LabelOverlapFilter = 겹치는 라벨 걸러내기
unit.Map/LabelOverlapFilter = 가장 큰 유닛 유지
help.Map/LabelOverlapFilter = 지도: 함선이나 항공기(및 그룹 이름)의 라벨이 겹치면 가장 큰 유닛 또는 그룹의 라벨만 남깁니다. 종류를 모르는 유닛은 아는 유닛보다 우선하지 않으며, 크기가 같으면 첫 번째 라벨을 남깁니다. 라벨이 맞지 않으면 먼저 줄 수를 줄이고(마지막 줄부터), 첫 줄까지 겹칠 때만 제거합니다.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = 식별 진행도
unit.UnitStatus/TrackIdentProgress = 대략, 10% 단위
help.UnitStatus/TrackIdentProgress = Track State: 접촉의 식별 진행도를 10% 단위로 대략 표시합니다(아군 ESM이 방사원을 관측한 시간 대비 게임이 식별에 필요로 하는 시간). 식별되면 100%. 재구성된 레이아웃에서만, 그리고 아군 ESM이 접촉을 관측하는 동안에만 표시됩니다. ESM 관측이 끝났는데도 클래스를 알 수 없으면 "데이터 부족"이라고 표시하고, 접촉이 식별되면 숨겨집니다.
track.identProgress = 식별 진행도
track.identNoData = 데이터 부족

; --- new ---
tab.Event Log = 이벤트 로그
grp.Links = 링크
lbl.EventLog/AllTracksAreLinks = 로그의 모든 접촉을 링크로
unit.EventLog/AllTracksAreLinks = 항적 번호
help.EventLog/AllTracksAreLinks = 이벤트 로그의 모든 항적 번호가 게임이 직접 만드는 것처럼 링크가 됩니다(새 접촉, 항적 분류, 항적 소실 등은 게임에서 일반 텍스트): 클릭하면 객체가 선택되고, CenterMapOnClick을 쓰면 다시 클릭할 때 지도가 그 위치로 중앙 이동합니다. 플레이어 자신의 목록에 있는 항적만 링크됩니다.
lbl.EventLog/CenterMapOnClick = 다시 클릭하면 지도 중앙으로
unit.EventLog/CenterMapOnClick = 전술 화면
help.EventLog/CenterMapOnClick = 이벤트 로그에서 같은 접촉 또는 유닛 링크를 다시 클릭하면 전술 화면 지도가 그 위치로 중앙 이동합니다(첫 클릭은 게임처럼 선택만 합니다).
grp.Layout = 레이아웃
lbl.EventLog/Compact = 간결한 레이아웃
unit.EventLog/Compact = 여백 축소
help.EventLog/Compact = 이벤트 로그 창: 여백, 탭 머리글, 행 간격을 줄여 더 많은 행을 표시합니다. 글자 크기는 그대로입니다.
lbl.Camera/BinocularsBelowHorizon = 수평선 아래 함정 쌍안경
unit.Camera/BinocularsBelowHorizon = 도 · 0 = 게임
help.Camera/BinocularsBelowHorizon = 함정 쌍안경(함선의 광학 시점): 수평선 아래로 얼마나 내릴 수 있는지(도). 게임에서는 수평선에서 멈춥니다. 0 = 게임과 동일.
lbl.Camera/BinocularsNormalView = 최대 확대 쌍안경에서 일반 화면
lbl.Camera/BinocularsNormalViewDayOnly = 일반 화면은 낮에만
help.Camera/BinocularsNormalView = 최대 배율의 쌍안경은 일반 화면으로 시작합니다(게임은 야간 / 열상 필터를 켠 채 시작). 게임의 필터 키로 필터를 켭니다.
help.Camera/BinocularsNormalViewDayOnly = 일반 화면은 낮에만 기본입니다. 밤에는 게임 자체의 기본 필터가 유지됩니다.
