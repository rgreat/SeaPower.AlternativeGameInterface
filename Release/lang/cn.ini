lbl.Map/ClipContactEllipse = 裁剪接触椭圆
unit.Map/ClipContactEllipse = 传感器后方
help.Map/ClipContactEllipse = 地图：由方位得出的接触位置估计沿方位方向被压缩，使其误差椭圆不会延伸到传感器后方（方位的另一侧）。图标、标签中的距离和椭圆都会跟随新的估计。跟踪器自身的数据不会改变。
