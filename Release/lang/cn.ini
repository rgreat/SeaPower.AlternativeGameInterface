help.General/Language = 模组文本的语言：游戏某种语言的代码（en、ru ...）；留空 = 游戏自身的语言。文本位于模组文件夹中的 lang/<代码>.ini 文件里——编辑它们即可翻译。

help.General/AllowDragOutside = 允许将任何窗口部分拖出可见区域（左、右和下边缘）。

help.General/MinVisiblePixels = 启用 AllowDragOutside 时：窗口在左/右边缘至少保留这么多像素的宽度可见。在下边缘，窗口的标题栏始终保持可见。

help.General/MaximizeOnDoubleClick = 双击窗口标题栏可将其最大化至全屏，再次双击则还原（可调整大小的窗口）。以最大化状态关闭的窗口会以最大化状态打开（[Layouts] 中其布局后带 ',max'）。

help.General/RemoveSizeLimits = 已记住的窗口（WindowPatterns，包括 单位参考资料）不限制大小：没有自己的最小或最大尺寸（最小可至 100x60 px），并且按边缘调整大小时不会被屏幕边缘阻止（顶部仍留在屏幕上，以便能够点到标题栏）。切换后立即对屏幕上的窗口生效。

help.General/SnapWindows = 用鼠标拖动窗口或调整其大小时，当其边缘与其他窗口及屏幕边缘的距离小于 SnapDistance 时会吸附（指可见边缘，不含窗口周围不可见的调整大小区域）。

help.General/SnapDistance = SnapWindows：边缘靠近到多近才吸附，单位为像素 (1 - 50)。

help.General/BringToFrontOnClick = 点击窗口会将其置于其他窗口之前；新打开的窗口也会置于最前。仅对窗口重新排序，且仅低于游戏赋予它们的层级 (Panel.ZIndex)，因此游戏自己显示的内容（简报、消息）仍在其上。最大化的 战术显示 / 世界视图 始终位于其他所有窗口之下。

help.General/CascadeOffset = 同一模式的多个窗口同时打开（例如 武器参考资料）：第一个保留已保存的布局，只保存它的更改；之后的每一个按已打开窗口数，每个向右和向下偏移这么多像素（像拖动的窗口一样保持在屏幕内）。0 = 全部在已保存的位置打开。

help.General/SettingsButton = 每个已记住窗口（WindowPatterns）标题栏中的齿轮按钮可打开 Alternative Game Interface 设置窗口。

help.Mission/UnitPanelMenu = 任务：在底部单位面板中右键点击所选单位的旗帜或名称，会打开与在地图上右键点击该单位相同的菜单。
help.Mission/PauseAfterLoad = 任务:载入存档后立即暂停,如同按下暂停键。若显示任务简报,则在按下简报的播放按钮后暂停。
help.Mission/HideBriefingOnLoad = 任务:载入存档时立即关闭任务简报,如同按下播放;从头开始的任务仍显示简报。若同时开启暂停选项,游戏随后暂停。


help.General/EncyclopediaSplit = 主菜单:“百科全书”打开 单位参考资料 窗口(不加载任务);“百科全书 3D”是游戏原有的菜单项,会加载百科全书任务。
lbl.General/FitNewsWindow = 新闻窗口填满空闲区域
help.General/FitNewsWindow = 主菜单:新闻窗口占据菜单右侧的空闲区域(屏幕顶部到提示栏),完全透明,内容 120 %。开启之后，一旦你移动、调整大小或更改新闻窗口的外观，此项会自动关闭；开启时会清除你设定的位置、大小和外观。
grp.Game = 游戏
lbl.General/ShowGameVersion = 游戏版本水印
help.General/ShowGameVersion = 屏幕上的游戏版本文字:由游戏决定(测试分支或 [Debug] ShowVersionWatermark)、始终显示或始终隐藏。仅在内存中设置,不修改游戏文件。
val.General/ShowGameVersion.Game = 按游戏
val.General/ShowGameVersion.Show = 显示
val.General/ShowGameVersion.Hide = 隐藏
tab.World View = 世界视图
grp.Camera offset = 镜头偏移
cam.conflict = 已加载 Camera Offset 模组:镜头偏移在其自身窗口(F11)中设置;这些设置不起作用。
lbl.WorldView/CameraOffset = 偏移画面
help.WorldView/CameraOffset = 世界视图 的 3D 画面会偏移,使跟随的对象不在中心(与 Camera Offset 模组相同;加载该模组时显示为灰色)。仅限跟随镜头,望远镜 / 潜望镜中不偏移。立即生效,无需 Apply。
lbl.WorldView/CameraOffsetFollowX = 跟随对象在屏幕上的位置
unit.WorldView/CameraOffsetFollowX = % 视图
help.WorldView/CameraOffsetFollowX = 跟随对象在屏幕上的位置,相对中心占视图的百分比(±25 %)。拖动准星上的圆点、点击准星或使用箭头。
help.General/FixSoundOnReload = 在任务中读取存档:依赖距离的游戏音效在相机消失后仍在更新,每一帧都会弹出错误框。这些错误将被屏蔽。
help.General/HideCustomMission = 主菜单：编辑器的默认文件 "_Custom Mission" 不在 场景 列表中显示。

help.General/Backgrounds = 主菜单和载入画面的背景图片。模组：模组自带背景 (ui/backgrounds) 时只显示它们。混合：与游戏相同 - 从游戏和所有模组的图片中随机选一张。游戏：仅使用游戏自带的。
val.General/Backgrounds.Mods = 仅模组
val.General/Backgrounds.Mixed = 混合
val.General/Backgrounds.Game = 仅游戏
help.Monitors/Enabled = 桌面模式:其他显示器与主显示器一样工作,可将窗口放到上面(窗口菜单中的“显示器”)。此时不使用游戏自带的第二显示器地图和 世界视图 显示器。下次开始任务时生效。
help.General/RealPhotos = 本模组自带的图片(真实照片,ui/backgrounds)用于菜单和加载界面的背景。关闭:不显示;如果没有其他模组提供图片,则无论“背景图片”如何设置都显示游戏自带图片。
help.General/MenuBackground = 主菜单的背景。视频:游戏自带的循环视频。幻灯片:背景图片(见“背景图片”),按设定的时间切换;此时不加载视频,可节省资源。
val.General/MenuBackground.Video = 游戏视频
val.General/MenuBackground.Slideshow = 图片幻灯片
help.General/SlideshowSeconds = 主菜单幻灯片:每张图片显示的秒数。

help.MissionEditor/RememberMissionFolder = 主菜单和加载画面的背景图片：当模组带有自己的图片 (ui/backgrounds) 时，只显示它们，不与游戏自带的混合。关 = 与游戏一致：从游戏自带的和所有模组的图片中随机选一张。
help.General/RememberSaveFolder = 保存游戏和载入游戏窗口（暂停菜单、主菜单、战役）会在上次使用的文件夹中打开。战役存档和任务存档各自记住自己的文件夹。
help.General/RememberSaveSort = “Save game”和“Load game”窗口会记住点击“名称”或“修改日期”表头选择的排序方式（升序或降序）：打开窗口时以及之后进入其他文件夹时都会应用。战役存档和任务存档各自记住自己的排序。
help.General/DoubleClickOpen = 在载入游戏等打开文件的窗口中双击文件即可打开（等同于“打开”按钮），在主菜单的场景列表中双击场景即可开始（等同于“开始”按钮）。保存窗口不受影响。
lbl.General/AutoOpenLoad = 进入场景与战役时打开读取存档
lbl.General/AutoLoadCloseOnCampaign = 选择战役时关闭读取存档
help.General/AutoOpenLoad = 主菜单：进入场景或战役时立即打开读取存档窗口。
help.General/AutoLoadCloseOnCampaign = 战役界面：由“进入场景与战役时打开读取存档”打开的读取存档窗口，会在您点击某个战役（打开初始条件）时关闭，因为它会遮挡初始条件。您自己打开的窗口保持不变。
lbl.General/MenuWindowsAside = 菜单窗口显示在按钮旁
unit.General/MenuWindowsAside = 读取等，不遮挡菜单
help.General/MenuWindowsAside = 主菜单界面（场景、战役等）：窗口（读取存档等）在菜单按钮旁打开，而不是盖在按钮上。
lbl.General/FilePickerTall = 文件选择窗口不限制高度
help.General/FilePickerTall = 文件选择窗口（读取/保存存档等）没有最大高度限制（游戏默认限制为 400）。

help.General/ColorIniFiles = 任务编辑器文件选择器：*.ini 文件的名称显示为浅蓝色。

help.Campaign/StrictLoadouts = 战役 特遣舰队组建器：只为任务列为可用或你已拥有的舰船提供舰船版本和配置（游戏还会提供共享同一百科标签的所有舰船）。随战役一同保存；在新战役开始时选择。

help.General/DeleteOldLogs = 游戏启动时，会删除之前会话的日志文件（游戏的 Logs 文件夹：*_session_*、*_sessionEventLog_*）；本次会话的保留。

help.General/Debug = 启用详细日志记录和 BepInEx/AlternativeGameInterface.trace.txt。
help.Debug/TracePeriodic = 开启调试跟踪时：同时记录持续写入的诊断信息（战术显示 每个标签每 2 秒一次、编队跟随领队的更新、窗口吸附、性能分析器）。关闭：只记录事件，文件很小。仅在简短测试时开启：文件会增长数兆字节。

help.General/WindowPatterns = 要记住的窗口名称，以逗号分隔。不区分大小写，比较时忽略空格（'单位状态*' 也匹配 'UnitStatusView'），'*' 匹配任意文本（包括没有）。模式会与窗口的名称、标题文本、内容类型和 view-model 类型比较，并且必须从开头起匹配其中一个字符串（'单位参考资料*' 匹配 '单位参考资料 - XYZ'；用 '*文本*' 可在任意位置匹配）。匹配同一模式的窗口共用一个已保存的布局。

help.General/AddWindowKey = 将鼠标指向某个窗口并按此键，即可将该窗口添加到 WindowPatterns。

help.General/RememberOpenWindows = 以逗号分隔的窗口模式（规则与 WindowPatterns 相同），其打开/关闭状态会被记住：在加载画面（任务开始、百科）之后，这些窗口会按离开时的状态打开或关闭。状态保存在 [OpenWindows] 中。只能打开游戏已经创建的窗口（例如 单位状态 需要先选中一个单位）。

help.WindowBorder/Enabled = 在每个可拖动窗口可见部分的边缘绘制细边框。绘制在窗口自身外观之上；不改变窗口大小，也不拦截鼠标。

help.WindowBorder/Thickness = 边框宽度，单位为像素 (0.5 - 10)。边框没有上边（否则会在标题栏下方）。

help.WindowBorder/Color = 边框颜色：#RRGGBB 或 #AARRGGBB（AA = 不透明度，00 透明 - FF 不透明）。

help.WindowBorder/ToolTips = 游戏的提示框（弹出提示）周围也加边框，四边都有，宽度和颜色同上。

help.UnitStatus/SectionsMinHeight = 单位状态 窗口，损害管制 标签页：各区段面板（Aft ... Forward 及其损伤列表）的最小高度，单位为屏幕像素。较矮的窗口会将它们压缩到此值；低于此值后标签页不再缩小，底部的 'Auto 损害管制 Status' 面板会移出窗口。0 = 与游戏一致（整个标签页有固定的最小值；面板获得其他行剩下的部分——显示在设置窗口中）。

help.UnitStatus/UnitReferenceTab = 单位状态 窗口：一个 "Reference" 标签页（最后一个），显示所选单位的 单位参考资料——其舰船/型号和配置——不含单位树和搜索面板。


help.General/ImprovedUnitReferenceUI = 单位参考资料 窗口改进：隐藏单位树（左边缘的 '<' 按钮）同时隐藏搜索/筛选面板，使窗口缩窄树的宽度并向右移动同样的距离，因此单位信息保持原位并占用顶部腾出的空间（显示树则恢复；已保存的布局按显示树的状态存储窗口）；带有可用鼠标拖动的右边缘分隔条的更宽单位树（宽度保存在 [UnitReference] TreeWidth）；记住所选国家（[UnitReference] Country）。对之后打开的 单位参考资料 窗口生效。

help.UnitReference/ShowLoadoutList = 单位参考资料：对有多个配置的舰船、潜艇和陆上单位也显示配置选择器（游戏只对飞机显示）；单位信息随所选配置变化。

help.UnitReference/OptimizeTree = 单位参考资料 树：同一单位类型的类别按入役日期排序；在类别组中，每个单位后面跟着它的配置型号（按日期，Early 在前），标为 "单位 [型号]"（Default 或仅一个型号时无后缀）；没有 Default 配置的单位只显示其型号。对之后打开的 单位参考资料 窗口生效。

help.UnitReference/ScrollToSelected = 单位参考资料 树：滚动树使所选单位可见（窗口打开或显示树时居中）。
help.UnitReference/ReferenceTabs = 单位参考资料：在单位页面上方显示标签栏。双击树中的单位会为其添加一个标签页（同一单位不会重复添加）。游戏本会以新窗口打开的单位参考资料，改为在已打开的窗口中添加为标签页。点击标签页上的叉号可将其关闭。默认开启。

help.UnitReference/EarliestVariantOnClick = 单位参考资料 树：点击类别（有多个型号的节点）会选择其最早的型号。游戏会选择任务年份在役的型号，否则选最晚的。

help.UnitReference/KeepOpenedUnit = 单位参考资料：打开窗口时对应的单位及其类别会保留在树中，即使国家/日期/搜索/仅有武器筛选会把它隐藏。

help.UnitReference/TreeWheelOnlyOver = 单位参考资料 树：鼠标滚轮仅在光标位于树上时才滚动树。

help.UnitReference/RememberSearchPanel = 单位参考资料 窗口的搜索面板——类别、“按日期筛选”、“仅按名称搜索”和搜索文本——保存在 .cfg 中（下面的键），并在打开 单位参考资料 窗口时重新设置（需要 ImprovedUnitReferenceUI）。

help.UnitReference/HideEmptyCountries = 单位参考资料：国家列表只显示对当前搜索文本、“按日期筛选”和“仅有武器”有单位的国家（所选国家始终显示）。

help.UnitReference/SearchInDescriptionAndId = 单位参考资料：关闭“仅按名称搜索”时，搜索还会按单位的描述及其 ini id (<Id>.ini) 查找单位。

help.UnitReference/LinkHelp = 单位参考资料：在高亮的链接上，为有简短帮助的武器、传感器或系统显示带有简短帮助（描述开头）的提示。


