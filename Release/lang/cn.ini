lbl.General/KeepMapView = 调整大小时保持地图视野
unit.General/KeepMapView = 缩放跟随窗口大小
help.General/KeepMapView = Tactical Display 窗口大小改变时,地图缩放随之改变,使原来可见的区域保持可见(地图保持比例)。关闭:缩放不变,窗口越大看到的地图越多,越小越少。
grp.Desktop mode = 桌面模式
lbl.General/WindowedMapAndWorldView = 启用桌面模式
unit.General/WindowedMapAndWorldView = 自由移动和调整大小
help.General/WindowedMapAndWorldView = 桌面模式。Tactical Display 和 World View 只作为可自由移动和调整大小的普通窗口工作(与其他窗口一样):不会被记为最大化([Layouts] 中没有 ',max'),两者始终显示(游戏被一次性设为地图全屏 + World View 状态),始终位于所有其他窗口下方,只在彼此之间交换位置。Toggle fullscreen minimap 键(默认 Tab)不再切换地图(而是在各桌面之间切换,DesktopCount),最大化 / 还原按钮只作用于窗口,窗口后面的屏幕由模组清除(此状态下游戏不绘制它)。
lbl.General/DesktopCount = 桌面数量
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = 桌面模式:桌面数量(2 - 5)。游戏的 Toggle fullscreen minimap 键(控制 - 通用,默认 Tab)在它们之间切换:每个桌面保存窗口的位置和大小、打开 / 关闭、不透明度、缩放和层级,以及 World View 是否打开。桌面以模组内置布局开始(1:World View(3D)在上,2:Tactical Display(地图)在上,3:地图占满屏幕,4:3D 视图占满屏幕,5:地图与 3D 视图并排)。
lbl.General/WorldViewKey = World View 开 / 关键
unit.General/WorldViewKey = 默认为 Insert
help.General/WorldViewKey = 桌面模式:打开和关闭 World View 窗口的键。游戏已使用的键(控制 - 其按键绑定,包括你修改过的)不会被占用:它会被忽略,日志中会注明。无 = 没有按键。控制台、菜单或文本框占用键盘时,或按住 Shift / Ctrl / Alt 时无效。
lbl.InMission/DragTimePanel = 可拖动的时间面板
unit.InMission/DragTimePanel = 双击:回到角落
help.InMission/DragTimePanel = 任务 HUD 的时间面板(日期 / 时间、速度、播放 / 暂停)可用鼠标拖动其边框、速度文字或按钮之间的空隙;双击可放回角落。
grp.Task Force = 特遣舰队
lbl.Campaign/DismissDamaged = 遣散受损舰艇
unit.Campaign/DismissDamaged = 退款减去维修费
help.Campaign/DismissDamaged = 战役特遣舰队状态:可修复的受损舰艇可以遣散;退款会减去维修费用。
lbl.Campaign/SortLoadoutsByDate = 按日期排序装备
unit.Campaign/SortLoadoutsByDate = 本舰版本优先
help.Campaign/SortLoadoutsByDate = 战役特遣舰队,装备页:舰艇自己的装备按日期排序,显示在该级更新版本之前(游戏把它们放在最后)。
lbl.Campaign/FixVersionSwapPrice = 修复版本互换价格
unit.Campaign/FixVersionSwapPrice = 名册价格
help.Campaign/FixVersionSwapPrice = 战役特遣舰队,装备页:换成该级的另一版本舰体时,按战役名册的价格像购买一样计价(游戏对新舰体用单位 ini 的价格,对你拥有的舰艇用名册价格:名册价格不同会让升级变成退款)。
lbl.Campaign/UpgradeShip = Builder 中的升级舰艇按钮
unit.Campaign/UpgradeShip = 船员 -1 级
help.Campaign/UpgradeShip = 战役 Task Force Builder:“升级舰艇”按钮用所选舰艇替换特遣舰队中的一艘(按遣散 / 退役价出售,船员技能等级降低一级)。
grp.Game UI = 游戏界面
lbl.Debug/DumpXaml = 立即转储 XAML
unit.Debug/DumpXaml = 自动关闭
help.Debug/DumpXaml = 用于开发:开启后把目前已加载的游戏界面资源的 XAML 写入 BepInEx/AlternativeGameInterface_xaml,然后自动关闭(请先打开需要的窗口)。
grp.Track State = Track State
lbl.UnitStatus/TrackState = 所选接触的 Track State
help.UnitStatus/TrackState = Unit Status 窗口:选中其他阵营的接触(航迹,不是己方单位)时,窗口显示其 Track State(该接触的信息窗口:状态、可信度、探测、特征),而不是保持空白。

; --- new ---
tab.Event Log = 事件日志
grp.Links = 链接
lbl.EventLog/AllTracksAreLinks = 日志中的所有接触均为链接
unit.EventLog/AllTracksAreLinks = 航迹编号
help.EventLog/AllTracksAreLinks = 事件日志中的每个航迹编号都是链接,与游戏自己生成的一样(新接触、航迹已分类、航迹消失等在游戏中是纯文本):单击选中该对象,配合 CenterMapOnClick,再次单击会把地图居中到它。只有玩家自己列表中的航迹才有链接。
lbl.EventLog/CenterMapOnClick = 再次点击时居中地图
unit.EventLog/CenterMapOnClick = Tactical Display
help.EventLog/CenterMapOnClick = 在事件日志中再次点击同一个接触或单位链接,会把 Tactical Display 地图居中到它(第一次点击与游戏一样仅选中)。
lbl.Camera/BinocularsBelowHorizon = 舰艇望远镜低于地平线
unit.Camera/BinocularsBelowHorizon = 度 · 0 = 游戏
help.Camera/BinocularsBelowHorizon = 舰艇望远镜(舰船的光学视角):可低于地平线多少度。游戏会在地平线处停住。0 = 与游戏相同。
lbl.Camera/BinocularsNormalView = 最大变焦时望远镜使用普通视图
lbl.Camera/BinocularsNormalViewDayOnly = 普通视图仅限白天
help.Camera/BinocularsNormalView = 最大放大倍率的望远镜以普通视图开始(游戏默认开启夜视 / 热成像滤镜)。游戏的滤镜键可开启滤镜。
help.Camera/BinocularsNormalViewDayOnly = 仅在白天默认使用普通视图;夜间保留游戏自己的默认滤镜。
ref.propulsion = 动力
ref.pp.nuclear = 核动力
ref.pp.steam = 蒸汽
ref.pp.gasturbine = 燃气轮机
ref.pp.diesel = 柴油
ref.pp.electric = 电动
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = 舰艇数据中显示动力
help.UnitReference/ShowPropulsion = Unit Reference:在舰艇和潜艇的主要参数中,Max Speed 之后增加动力一栏:发动机的类型和功率(主动力和辅助动力装置)。对下一个显示的单位生效。
ref.propulsion.tip = 动力:发动机的类型和功率(主动力和辅助动力装置)
lbl.UnitStatus/DamageListsWheel = 滚轮滚动各区段列表
lbl.UnitStatus/RememberTab = 记住每个单位的标签页
help.UnitStatus/DamageListsWheel = Unit Status 窗口,Damage Control 页:各区段(Aft ... Forward:进水、火灾、受损系统)的损伤列表可用鼠标滚轮滚动。对下一个显示的页生效。
help.UnitStatus/RememberTab = Unit Status 窗口:记住每个单位(接触)打开过的标签页,再次选中该单位时,如果该标签页可用,则重新打开。
