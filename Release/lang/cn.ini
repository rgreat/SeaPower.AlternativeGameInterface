lbl.Map/DrawingImprovements = 改进的单位与标签绘制
unit.Map/DrawingImprovements = 总开关
help.Map/DrawingImprovements = 地图：单位与标签改进绘制的总开关（紧凑声呐浮标、标签位置与过滤、编队连线、裁剪接触椭圆）。关闭时游戏按原样绘制，下方选项隐藏。
lbl.Map/FriendlyBadgeInLabel = 标签中显示 FRND 标记
unit.Map/FriendlyBadgeInLabel = 单独一行
help.Map/FriendlyBadgeInLabel = 地图：其他阵营友军单位的“FRND”标记单独占一行，写在其标签第一行之上，而不是画在图标旁边。
lbl.Map/LabelPlacement = 标签位置
help.Map/LabelPlacement = 地图：单位文字标签相对于图标的位置，居中于该侧（拥挤时仍可能移开）。“与游戏一致”为游戏原有位置。
val.Map/LabelPlacement.Game = 与游戏一致
val.Map/LabelPlacement.Bottom = 居中靠下
val.Map/LabelPlacement.Top = 居中靠上
val.Map/LabelPlacement.Right = 居中靠右
val.Map/LabelPlacement.Left = 居中靠左
lbl.Map/GroupNameOnly = 仅显示编队名称
unit.Map/GroupNameOnly = 选中前
help.Map/GroupNameOnly = 地图：在编队被选中之前，编队内的单位只显示编队名称。单位自己的标签最后添加，仅在有空位时显示（飞机和直升机除外）。
lbl.Map/LabelOverlapFilter = 过滤重叠标签
unit.Map/LabelOverlapFilter = 保留最大单位
help.Map/LabelOverlapFilter = 地图：舰船或飞机的标签（含编队名称）重叠时，只保留最大单位或编队的标签。类型未知的单位不会压过已知单位；大小相同则保留第一个标签。标签放不下时，先减少其行数（从最后一行起）；只有第一行也重叠时才移除。
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = 识别进度
unit.UnitStatus/TrackIdentProgress = 大致，以10%为单位
help.UnitStatus/TrackIdentProgress = Track State：以10%为单位大致显示接触的识别进度（己方ESM对其辐射源的观测时间与游戏识别所需时间之比）。接触已识别时为100%。仅在重新排版的布局中显示，且仅在己方某个ESM正在观测该接触时显示。 若ESM已完成观测但类别仍未知，该行显示“数据不足”；接触被识别后隐藏。
track.identProgress = 识别进度
track.identNoData = 数据不足

; --- new ---
tab.Event Log = 事件日志
grp.Links = 链接
lbl.EventLog/AllTracksAreLinks = 日志中的所有接触均为链接
unit.EventLog/AllTracksAreLinks = 航迹编号
help.EventLog/AllTracksAreLinks = 事件日志中的每个航迹编号都是链接,与游戏自己生成的一样(新接触、航迹已分类、航迹消失等在游戏中是纯文本):单击选中该对象,配合 CenterMapOnClick,再次单击会把地图居中到它。只有玩家自己列表中的航迹才有链接。
lbl.EventLog/CenterMapOnClick = 再次点击时居中地图
unit.EventLog/CenterMapOnClick = 战术显示
help.EventLog/CenterMapOnClick = 在事件日志中再次点击同一个接触或单位链接,会把 战术显示 地图居中到它(第一次点击与游戏一样仅选中)。
grp.Layout = 布局
lbl.EventLog/Compact = 紧凑布局
unit.EventLog/Compact = 更少间距
help.EventLog/Compact = 事件日志窗口:缩小边距、标签页标题和行距,以显示更多行。文字大小不变。
lbl.EventLog/WrapLines = 长行自动换行
unit.EventLog/WrapLines = 按窗口宽度
help.EventLog/WrapLines = 事件日志窗口:事件日志标签页中的长行按窗口宽度换行(游戏会在窗口边缘将其截断)。
tab.Formation Manager = Formation Manager
tab.Formation Editor = 编队编辑器
grp.Clicks = 点击
grp.Range rings = 射程圈
lbl.FormationManager/ClickGoesToUnit = 单击即前往该单位
help.FormationManager/ClickGoesToUnit = Formation Manager：单击单位或编队会选中它并将镜头移到它那里，与双击相同。双击照旧可用。默认关闭。
lbl.FormationManager/DoubleClickCentersMap = 双击时居中地图
unit.FormationManager/DoubleClickCentersMap = 战术显示
help.FormationManager/DoubleClickCentersMap = Formation Manager：双击单位时，Tactical Display 的地图也会居中到该单位（游戏中对选中的单位按 C 键即可）。在编队行上，双击只展开或收起分支。镜头照常移到该单位。默认关闭。
lbl.FormationEditor/ScaleStep = 比例滑块步长
unit.FormationEditor/ScaleStep = nm
help.FormationEditor/ScaleStep = 编队编辑器(任务中及战役任务准备中):比例滑块(射程圈)的步长。游戏自带为 0.05 nm。步长大于 0.05 时,滑块的最小值即为该步长。
lbl.FormationEditor/ScaleButtons = 比例按钮 1 - 5 nm
help.FormationEditor/ScaleButtons = 编队编辑器:比例滑块下方有一排 1、2、3、4、5 nm 按钮,点击即可立即设置比例。
lbl.FormationEditor/RememberScale = 记住每个编队的比例
help.FormationEditor/RememberScale = 任务中的编队编辑器:记住每个编队的比例(游戏在关闭编辑器时会忘记),并保存在存档中。
lbl.FormationEditor/MinimizeScale = 缩小新编队的比例
help.FormationEditor/MinimizeScale = 任务中的编队编辑器:尚未记住比例的编队会以能容纳其全部单位的最小比例打开,但不低于最小比例。
lbl.FormationEditor/MinimizeScaleFloor = 最小比例
unit.FormationEditor/MinimizeScaleFloor = nm
help.FormationEditor/MinimizeScaleFloor = 缩小新编队的比例:可选的最小比例。
lbl.Camera/BinocularsBelowHorizon = 舰艇望远镜低于地平线
unit.Camera/BinocularsBelowHorizon = 度 · 0 = 游戏
help.Camera/BinocularsBelowHorizon = 舰艇望远镜(舰船的光学视角):可低于地平线多少度。游戏会在地平线处停住。0 = 与游戏相同。
lbl.Camera/BinocularsNormalView = 最大变焦时望远镜使用普通视图
lbl.Camera/BinocularsNormalViewDayOnly = 普通视图仅限白天
help.Camera/BinocularsNormalView = 最大放大倍率的望远镜以普通视图开始(游戏默认开启夜视 / 热成像滤镜)。游戏的滤镜键可开启滤镜。
help.Camera/BinocularsNormalViewDayOnly = 仅在白天默认使用普通视图;夜间保留游戏自己的默认滤镜。
ref.propulsion = 动力
ref.pp.nuclear = 核动力
ref.pp.steam = 蒸汽
ref.pp.gasturbine = 燃气轮机
ref.pp.diesel = 柴油
ref.pp.electric = 电动
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = 舰艇数据中显示动力
help.UnitReference/ShowPropulsion = 单位参考资料:在舰艇和潜艇的主要参数中,Max Speed 之后增加动力一栏:发动机的类型和功率(主动力和辅助动力装置)。对下一个显示的单位生效。
ref.propulsion.tip = 动力:发动机的类型和功率(主动力和辅助动力装置)
lbl.UnitStatus/DamageListsWheel = 滚轮滚动各区段列表
help.UnitStatus/DamageListsWheel = 单位状态 窗口,损害管制 页:各区段(Aft ... Forward:进水、火灾、受损系统)的损伤列表可用鼠标滚轮滚动。对下一个显示的页生效。
lbl.General/NoFrameLimit = 取消帧率限制
unit.General/NoFrameLimit = 滑块禁用
help.General/NoFrameLimit = 不限制帧率；上方的滑块将被禁用。开启垂直同步时仍受屏幕刷新率限制（Alternative Game Interface）。
lbl.General/AddAdaptiveVSync = 添加自适应垂直同步
unit.General/AddAdaptiveVSync = 在垂直同步列表中
help.General/AddAdaptiveVSync = 在视频选项的垂直同步列表中添加“Adaptive V-Sync”：帧率跟得上屏幕时开启垂直同步，跟不上时关闭。游戏将其保存为普通垂直同步，因此没有此模组也能正常运行。
grp.Performance = 性能
grp.Text by background = 按背景调整文字
lbl.General/TextDarkAbove = 文字变暗的亮度
lbl.General/TextLightBelow = 文字变亮的亮度
unit.General/TextDarkAbove = 亮度 0 - 1
unit.General/TextLightBelow = 亮度 0 - 1
help.General/TextDarkAbove = 开启文字对比度的窗口和 世界视图 窗口的罗盘带：文字后方画面的亮度（0 = 黑，1 = 白）高于此值时文字变暗。数值越低，在越暗的画面上文字就会变暗。
help.General/TextLightBelow = 文字后方画面的亮度低于此值时，深色文字重新变亮（文字对比度窗口、罗盘带）。不得高于“文字变暗的亮度”；两者之间的间隔可避免在该亮度附近闪烁。

