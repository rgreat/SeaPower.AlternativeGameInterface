help.General/KeepMapView = 战术显示 窗口大小改变时,地图缩放随之改变,使原来可见的区域保持可见(地图保持比例)。关闭:缩放不变,窗口越大看到的地图越多,越小越少。
lbl.General/MapFineZoomShift = 按住 Shift 精细缩放
unit.General/MapFineZoomShift = 滚轮步长缩小为 1/5
help.General/MapFineZoomShift = 地图：按住 Shift 时，鼠标滚轮以普通步长的 1/5 缩放地图。
grp.Desktop mode = 桌面模式
lbl.General/WindowedMapAndWorldView = 启用桌面模式
unit.General/WindowedMapAndWorldView = 自由移动和调整大小
help.General/WindowedMapAndWorldView = 桌面模式。战术显示 和 世界视图 只作为可自由移动和调整大小的普通窗口工作(与其他窗口一样):不会被记为最大化([Layouts] 中没有 ',max'),两者始终显示(游戏被一次性设为地图全屏 + 世界视图 状态),始终位于所有其他窗口下方,只在彼此之间交换位置。Toggle fullscreen minimap 键(默认 Tab)不再切换地图(而是在各桌面之间切换,DesktopCount),最大化 / 还原按钮只作用于窗口,窗口后面的屏幕由模组清除(此状态下游戏不绘制它)。
lbl.General/DesktopCount = 桌面数量
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = 桌面模式:桌面数量(2 - 5)。游戏的 Toggle fullscreen minimap 键(控制 - 通用,默认 Tab)在它们之间切换:每个桌面保存窗口的位置和大小、打开 / 关闭、不透明度、缩放和层级,以及 世界视图 是否打开。桌面以模组内置布局开始(1:世界视图(3D)在上,2:战术显示(地图)在上,3:地图占满屏幕,4:3D 视图占满屏幕,5:地图与 3D 视图并排)。
lbl.General/WorldViewKey = 世界视图 开 / 关键
unit.General/WorldViewKey = 默认为 Insert
help.General/WorldViewKey = 桌面模式:打开和关闭 世界视图 窗口的键。游戏已使用的键(控制 - 其按键绑定,包括你修改过的)不会被占用:它会被忽略,日志中会注明。无 = 没有按键。控制台、菜单或文本框占用键盘时,或按住 Shift / Ctrl / Alt 时无效。
lbl.InMission/DragTimePanel = 可拖动的时间面板
unit.InMission/DragTimePanel = 双击:回到角落
help.InMission/DragTimePanel = 任务 HUD 的时间面板(日期 / 时间、速度、播放 / 暂停)可用鼠标拖动其边框、速度文字或按钮之间的空隙;双击可放回角落。
grp.Task Force = 特遣舰队
lbl.Campaign/DismissDamaged = 遣散受损舰艇
unit.Campaign/DismissDamaged = 退款减去维修费
help.Campaign/DismissDamaged = 战役特遣舰队状态:可修复的受损舰艇可以遣散;退款会减去维修费用。
lbl.Campaign/SortLoadoutsByDate = 按日期排序装备
unit.Campaign/SortLoadoutsByDate = 本舰版本优先
help.Campaign/SortLoadoutsByDate = 战役特遣舰队,装备页:舰艇自己的装备按日期排序,显示在该级更新版本之前(游戏把它们放在最后)。
lbl.Campaign/FixVersionSwapPrice = 修复版本互换价格
unit.Campaign/FixVersionSwapPrice = 名册价格
help.Campaign/FixVersionSwapPrice = 战役特遣舰队,装备页:换成该级的另一版本舰体时,按战役名册的价格像购买一样计价(游戏对新舰体用单位 ini 的价格,对你拥有的舰艇用名册价格:名册价格不同会让升级变成退款)。
lbl.Campaign/UpgradeShip = Builder 中的升级舰艇按钮
unit.Campaign/UpgradeShip = 船员 -1 级
help.Campaign/UpgradeShip = 战役 特遣舰队组建器:“升级舰艇”按钮用所选舰艇替换特遣舰队中的一艘(按遣散 / 退役价出售,船员技能等级降低一级)。
lbl.Campaign/FixReserveSubmarines = 修复维护中的潜艇
help.Campaign/FixReserveSubmarines = 修复游戏中潜艇被送去补给或维修时的错误:更改编成时不会从预备队丢失;维护期间会像预备队中的舰艇一样显示在潜艇标签页中;已丢失的潜艇会在加载战役地图时放回预备队,之后游戏照常让它返回。
lbl.Campaign/EventShipState = 简报和报纸事件时的舰艇状态
unit.Campaign/EventShipState = 最近一次任务之后
help.Campaign/EventShipState = 战役地图：选中简报或报纸事件时，Task Force 显示舰艇在最近一次任务之后的状态（游戏会显示第一次任务之前的状态：弹药满载、损伤已修复）。
grp.Game UI = 游戏界面
grp.Diagnostics = 诊断
grp.Mods = 模组
lbl.Debug/DumpXaml = 立即转储 XAML
help.Debug/DumpXaml = 用于开发:开启后把目前已加载的游戏界面资源的 XAML 写入 BepInEx/AlternativeGameInterface_xaml,然后自动关闭(请先打开需要的窗口)。
lbl.Debug/Snapshot = 立即拍摄快照
help.Debug/Snapshot = 将游戏状态（帧时间、内存、按类型统计的对象、日志错误、模组的集合）追加到 BepInEx/AlternativeGameInterface_snapshots.txt，然后自动关闭。请在存档前和读档后各拍一次，或在长时间游戏的早期和后期各拍一次：每个数值都会显示相对上一张快照的变化。
lbl.Debug/ScreenshotTabs = 立即截取所有模组的全部选项卡
help.Debug/ScreenshotTabs = 用于诊断：开启后，会为本设置窗口的每个选项卡（及每一页）截取整个选项窗口，然后对其他已安装的 rgreat 模组的窗口做同样的事，并把 PNG 文件保存到 BepInEx/<模组>_screens，随后自动关闭。设置窗口必须处于打开状态。
lbl.Debug/CollectGarbage = 立即回收内存
help.Debug/CollectGarbage = 执行一次完整的垃圾回收并卸载未使用的资源；回收前后的内存会写入 BepInEx 日志。
lbl.General/ModCreateFill = 自动填写 创建模组
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = 创建模组 窗口（Mods 菜单）：勾选 Update Existing 后，选择创意工坊条目会自动填写 Pick Folder（StreamingAssets 中的模组文件夹）和 Pick Image（该文件夹中的 thumbnail.jpg）。
grp.Track State = Track State
lbl.UnitStatus/TrackState = 所选接触的 Track State
