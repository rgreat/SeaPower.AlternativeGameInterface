lbl.Map/SonobuoysThreshold = 声呐浮标阈值
unit.Map/SonobuoysThreshold = 同时可见数量
help.Map/SonobuoysThreshold = 精简声呐浮标：地图上同时可见的声呐浮标超过该数量时启用精简显示；低于该值的90%时恢复。
lbl.Map/GroupSpreadMiles = 编队分散上限：舰船、地面
unit.Map/GroupSpreadMiles = 海里（距领队）
help.Map/GroupSpreadMiles = 地图：距领队超过此海里数的编队单位（舰船、地面单位）视为独立单位：有自己的标签，不计入放置编队名称的框内。
lbl.Map/GroupSpreadMilesAir = 编队分散上限：飞机
unit.Map/GroupSpreadMilesAir = 海里（距领队）
help.Map/GroupSpreadMilesAir = 地图：飞机和直升机同理：编队中飞行距领队超过此海里数的单位视为独立单位。
lbl.Map/FormationLines = 编队连线
unit.Map/FormationLines = 选中时，领队连各单位
help.Map/FormationLines = 地图：选中编队中的单位时，绘制从领队到编队内各单位的连线。
lbl.Map/AirGroupInfo = 飞机编队：距离与高度
unit.Map/AirGroupInfo = 显示在名称下方
help.Map/AirGroupInfo = 地图：未选中的飞机或直升机编队的标签，在编队名称下方显示长机的距离和高度（适用通常的标签规则）。
