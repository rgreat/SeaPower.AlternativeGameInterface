unit.Debug/MonitorFpsInfo = 显示器、刷新率、V-Sync
help.Debug/MonitorFpsInfo = 帧数计数器中的诊断行：显示器、其刷新率以及 V-Sync 同步到的显示器。
lbl.General/AdaptiveVSyncDisplay = 自适应 V-Sync 显示器
help.General/AdaptiveVSyncDisplay = 有多个活动显示器时的自适应 V-Sync（Unity 会等待每个显示器）：帧与一个显示器同步，其他显示器不使用垂直同步。自动 = 最快的显示器（刷新率最高）；1、2 …… = 该显示器（列表显示名称、分辨率和刷新率）。
val.display.auto = 自动（最快）
val.display.missing = 未连接
