help.General/Language = Sprache der Mod-Texte: ein Code einer Spielsprache (en, ru ...); leer = die Sprache des Spiels. Die Texte stehen in den Dateien lang/<Code>.ini im Mod-Ordner – bearbeiten Sie sie, um zu übersetzen.

help.General/AllowDragOutside = Erlaubt, jedes Fenster teilweise außerhalb des sichtbaren Bereichs zu ziehen (linker, rechter und unterer Rand).

help.General/MinVisiblePixels = Mit AllowDragOutside: Mindestens so viele Pixel der Fensterbreite bleiben am linken/rechten Rand sichtbar. Am unteren Rand bleibt die Titelleiste des Fensters immer sichtbar.

help.General/MaximizeOnDoubleClick = Doppelklick auf die Titelleiste eines Fensters maximiert es auf den ganzen Bildschirm, erneuter Doppelklick stellt es wieder her (Fenster mit änderbarer Größe). Ein maximiert geschlossenes Fenster öffnet sich maximiert (',max' hinter seinem Layout in [Layouts]).

help.General/RemoveSizeLimits = Keine Größenbeschränkung für die gemerkten Fenster (WindowPatterns, auch Unit Reference): keine eigene Mindest- oder Höchstgröße – bis herunter auf 100x60 px – und das Ändern der Größe an einer Kante wird nicht von den Bildschirmrändern gestoppt (die Oberkante bleibt auf dem Bildschirm, damit die Titelleiste erreichbar bleibt). Das Umschalten wirkt sofort auf die Fenster auf dem Bildschirm.

help.General/SnapWindows = Wird ein Fenster mit der Maus gezogen oder in der Größe geändert, rasten seine Kanten an den Kanten anderer Fenster und des Bildschirms ein, sobald sie näher als SnapDistance kommen (die sichtbaren Kanten, ohne die unsichtbare Zone zum Ändern der Größe um das Fenster).

help.General/SnapDistance = SnapWindows: Wie nah eine Kante kommen muss, um einzurasten, in Pixeln (1 - 50).

help.General/BringToFrontOnClick = Ein Klick auf ein Fenster bringt es vor die anderen Fenster; ein neu geöffnetes Fenster kommt ebenfalls nach vorn. Nur Fenster werden umsortiert, und nur unterhalb der Ebene, die das Spiel ihnen gegeben hat (Panel.ZIndex); was das Spiel selbst anzeigt – Briefings, Meldungen – bleibt darüber. Ein maximiertes Tactical Display / World View bleibt unter allen anderen Fenstern.

help.General/CascadeOffset = Mehrere Fenster eines Musters sind gleichzeitig offen (z. B. Weapon Reference): Das erste behält das gespeicherte Layout, und nur seine Änderungen werden gespeichert; jedes weitere öffnet sich um so viele Pixel pro bereits offenem Fenster nach rechts und unten versetzt (wie ein gezogenes Fenster auf dem Bildschirm gehalten). 0 = alle öffnen an der gespeicherten Position.

help.General/SettingsButton = Ein Zahnrad-Button in der Titelleiste jedes gemerkten Fensters (WindowPatterns) öffnet das Einstellungsfenster von Alternative Game Interface.

help.Mission/UnitPanelMenu = Mission: Ein Rechtsklick auf die Flagge oder den Namen der gewählten Einheit im Einheitenpanel unten öffnet dasselbe Menü wie ein Rechtsklick auf die Einheit auf der Karte.


help.General/HideCustomMission = Hauptmenü: Die Standarddatei des Editors "_Custom Mission" wird in der Liste SCENARIOS nicht angezeigt.

help.General/Backgrounds = Hintergrundbilder des Hauptmenüs und der Ladebildschirme. Mods: bringen Mods eigene mit (ui/backgrounds), werden nur diese gezeigt. Gemischt: wie im Spiel - zufällig aus denen des Spiels und aller Mods. Spiel: nur die des Spiels.
val.General/Backgrounds.Mods = Nur aus Mods
val.General/Backgrounds.Mixed = Gemischt
val.General/Backgrounds.Game = Nur Spiel
help.Monitors/Enabled = Desktop-Modus: Die anderen Monitore funktionieren wie der Hauptmonitor - Fenster lassen sich darauf legen (Monitor im Fenstermenü). Die Karte auf dem zweiten Monitor und der World-View-Monitor des Spiels werden dann nicht benutzt. Gilt ab dem nächsten Missionsstart.
help.General/RealPhotos = Die eigenen Bilder dieses Mods (echte Fotos, ui/backgrounds) unter den Hintergründen von Menü und Ladebildschirmen. Aus: sie werden nicht gezeigt; bringt kein anderer Mod Bilder mit, werden die des Spiels gezeigt, was auch unter Hintergrundbilder steht.
help.General/MenuBackground = Hintergrund des Hauptmenüs. Video: das eigene, geloopte Video des Spiels. Diashow: die Hintergrundbilder (siehe Hintergrundbilder), die nach der eingestellten Zeit wechseln; das Video wird dann nicht geladen - das spart Ressourcen.
val.General/MenuBackground.Video = Spielvideo
val.General/MenuBackground.Slideshow = Bilder-Diashow
help.General/SlideshowSeconds = Diashow des Hauptmenüs: wie viele Sekunden ein Bild angezeigt wird.

help.MissionEditor/RememberMissionFolder = Hintergrundbilder des Hauptmenüs und der Ladebildschirme: Bringen Mods eigene mit (ui/backgrounds), werden nur deren gezeigt, nicht mit denen des Spiels gemischt. Aus = wie im Spiel: eines zufällig aus denen des Spiels und aller Mods zusammen.

help.General/ColorIniFiles = Dateidialoge des Missionseditors: Namen von *.ini-Dateien sind hellblau.

help.Campaign/StrictLoadouts = Task Force Builder der Kampagne: Schiffsversionen und Loadouts werden nur für Schiffe angeboten, die die Mission als verfügbar nennt oder die Sie bereits besitzen (das Spiel bietet außerdem jedes Schiff mit demselben Enzyklopädie-Tag an). Wird mit der Kampagne gespeichert; beim Start einer neuen Kampagne gewählt.

help.General/DeleteOldLogs = Beim Spielstart werden die Protokolldateien früherer Sitzungen (Ordner Logs des Spiels: *_session_*, *_sessionEventLog_*) gelöscht; die der aktuellen Sitzung bleiben.

help.General/Debug = Aktiviert ausführliches Protokollieren und BepInEx/AlternativeGameInterface.trace.txt.

help.General/WindowPatterns = Durch Komma getrennte Namen der zu merkenden Fenster. Ohne Beachtung der Groß-/Kleinschreibung, Leerzeichen werden beim Vergleich ignoriert ('Unit Status*' passt auch zu 'UnitStatusView'), '*' steht für beliebigen Text (auch keinen). Ein Muster wird mit Name, Kopfzeilentext, Inhaltstyp und View-Model-Typ des Fensters verglichen und muss ab dem Anfang zu einer dieser Zeichenketten passen ('Unit Reference*' passt zu 'Unit Reference - XYZ'; mit '*Text*' wird überall gesucht). Fenster, die zum selben Muster passen, teilen ein gespeichertes Layout.

help.General/AddWindowKey = Zeigen Sie mit der Maus auf ein Fenster und drücken Sie diese Taste, um das Fenster zu WindowPatterns hinzuzufügen.

help.General/RememberOpenWindows = Durch Komma getrennte Fenstermuster (dieselben Regeln wie bei WindowPatterns), deren Zustand offen/geschlossen gemerkt wird: Nach einem Ladebildschirm (Missionsstart, Enzyklopädie) werden diese Fenster so geöffnet oder geschlossen, wie sie verlassen wurden. Der Zustand steht in [OpenWindows]. Nur Fenster, die das Spiel bereits erstellt hat, können geöffnet werden (z. B. braucht Unit Status eine gewählte Einheit).

help.WindowBorder/Enabled = Dünner Rahmen um jedes verschiebbare Fenster, am Rand seines sichtbaren Teils. Über das eigene Aussehen des Fensters gezeichnet; ändert weder die Größe des Fensters noch fängt er die Maus ab.

help.WindowBorder/Thickness = Breite des Rahmens in Pixeln (0.5 - 10). Der Rahmen hat keine Oberseite (sie würde unter der Titelleiste verlaufen).

help.WindowBorder/Color = Farbe des Rahmens: #RRGGBB oder #AARRGGBB (AA = Deckkraft, 00 transparent - FF deckend).

help.WindowBorder/ToolTips = Rahmen auch um die Tooltips (Hinweise) des Spiels, an allen vier Seiten, mit Breite und Farbe von oben.

help.UnitStatus/SectionsMinHeight = Fenster Unit Status, Registerkarte Damage Control: Mindesthöhe der Sektionspanels (Aft ... Forward mit ihren Schadenslisten), in Bildschirmpixeln. Ein niedrigeres Fenster staucht sie bis auf diesen Wert; darunter schrumpft die Registerkarte nicht mehr, und das Panel 'Auto Damage Control Status' unten wandert aus dem Fenster. 0 = wie im Spiel (die ganze Registerkarte hat ein festes Minimum; die Panels erhalten, was die anderen Zeilen davon übrig lassen – im Einstellungsfenster angezeigt).

help.UnitStatus/UnitReferenceTab = Fenster Unit Status: eine Registerkarte "Reference" (zuletzt) mit der Unit Reference der gewählten Einheit – ihr Schiff / ihre Variante und Loadout – ohne Einheitenbaum und Suchpanel.

help.UnitStatus/FullUnitName = Fenster Unit Status: der volle Name der Einheit in der Kopfzeile (das Spiel zeigt den kurzen).

help.General/ImprovedUnitReferenceUI = Verbesserungen des Fensters Unit Reference: Das Ausblenden des Einheitenbaums (Button '<' am linken Rand) blendet auch das Such-/Filterpanel aus, macht das Fenster um die Breite des Baums schmaler und verschiebt es um denselben Betrag nach rechts, sodass die Einheiteninformation an ihrem Platz bleibt und den frei gewordenen Platz oben einnimmt (das Einblenden des Baums kehrt es um; gespeicherte Layouts speichern das Fenster mit sichtbarem Baum); ein breiterer Einheitenbaum mit einem Teiler am rechten Rand, der mit der Maus gezogen werden kann (Breite in [UnitReference] TreeWidth); das gewählte Land wird gemerkt ([UnitReference] Country). Gilt für danach geöffnete Unit-Reference-Fenster.

help.UnitReference/ShowLoadoutList = Unit Reference: Die Loadout-Auswahl auch für Schiffe, U-Boote und Landeinheiten mit mehreren Loadouts zeigen (das Spiel zeigt sie nur für Flugzeuge); die Information der Einheit folgt dem gewählten Loadout.

help.UnitReference/OptimizeTree = Baum der Unit Reference: Klassen eines Einheitentyps nach Dienstbeginn sortiert; in einer Klassengruppe folgen auf jede Einheit ihre Loadout-Varianten (nach Datum, Early zuerst), beschriftet "Einheit [Variante]" (kein Zusatz für Default oder eine einzelne Variante); eine Einheit ohne Default-Loadout zeigt nur ihre Varianten. Gilt für danach geöffnete Unit-Reference-Fenster.

help.UnitReference/ScrollToSelected = Baum der Unit Reference: den Baum so scrollen, dass die gewählte Einheit sichtbar ist (zentriert, wenn das Fenster geöffnet oder der Baum eingeblendet wird).

help.UnitReference/EarliestVariantOnClick = Baum der Unit Reference: Ein Klick auf eine Klasse (einen Knoten mit mehreren Varianten) wählt ihre früheste Variante. Das Spiel wählt die im Missionsjahr im Dienst befindliche, sonst die späteste.

help.UnitReference/KeepOpenedUnit = Unit Reference: Die Einheit, für die das Fenster geöffnet wurde, bleibt mit ihrer Klasse im Baum, auch wenn die Filter Land / Datum / Suche / Nur bewaffnet sie ausblenden würden.

help.UnitReference/TreeWheelOnlyOver = Baum der Unit Reference: Das Mausrad scrollt den Baum nur, solange der Cursor darüber ist.

help.UnitReference/RememberSearchPanel = Das Suchpanel des Fensters Unit Reference – Kategorie, 'Nach Datum filtern', 'Nur nach Namen suchen' und der Suchtext – wird in der .cfg gespeichert (die Schlüssel darunter) und beim Öffnen eines Unit-Reference-Fensters wieder gesetzt (mit ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference: Die Länderliste zeigt nur die Länder, die Einheiten für den aktuellen Suchtext, 'Nach Datum filtern' und 'Nur bewaffnet' haben (das gewählte Land wird immer gezeigt).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: Bei ausgeschaltetem 'Nur nach Namen suchen' findet die Suche Einheiten auch über ihre Beschreibung und ihre ini-ID (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference: ein Tooltip mit der Kurzhilfe (dem Anfang der Beschreibung) der Waffe, des Sensors oder Systems an den hervorgehobenen Links, wenn es eine gibt.


