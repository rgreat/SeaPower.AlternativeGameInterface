up.points2 = Punkte: {0} > {1}
up.fleet = Flottenwert: {0} > {1} / {2}
up.tip = Ein Schiff des Verbands durch das gewählte ersetzen: das alte Schiff wird zum Preis von Entlassen verkauft (Außer Dienst stellen, wenn nur das möglich ist), das neue gekauft, die Besatzung verliert eine Fertigkeitsstufe (Alternative Game Interface).
up.noSel = Wähle ein Schiff in der Liste.
up.noStatus = Der Verband ist hier nicht verfügbar.
up.hist = Bei historischen Verstärkungen nicht verfügbar.
up.pending = Bestätige oder entferne zuerst die ausstehenden Käufe.
up.none = Kein Schiff des Verbands kann durch dieses ersetzt werden.
up.points = nicht genug Punkte
up.cap = über der Flottenwert-Grenze
up.owned = diese Version ist bereits in Ihrer Flotte
up.item = für {0} Pkt. verkauft, Besatzung {1} > {2}
up.itemDecom = für {0} Pkt. außer Dienst gestellt, Besatzung {1} > {2}
look.opacity = Deckkraft
look.scale = Skalierung
look.outline = Textkontrast
look.level = Ebene
look.level.bottom = Unten
look.level.default = Standard
look.monitor = Monitor
look.level.top = Oben
look.outline.tip = Texte eines transparenten Fensters bleiben lesbar: Graue Texte werden reinweiß oder schwarz mit Heiligenschein, und auf hellem Hintergrund werden alle Texte dunkler (ihre Helligkeit folgt dem, was der Bildschirm unter dem Fenster zeigt; der Farbton bleibt). Schaltet sich bei einer Deckkraft unter 50% selbst ein, änderbar.
tab.Desktop mode = Desktop
tab.Tactical Display = Tactical Display
lbl.General/ResizeDockedWindows = Angedockte Fenster skalieren
unit.General/ResizeDockedWindows = Zone reicht an Bildschirmrändern nach innen
help.General/ResizeDockedWindows = Bei einem Fenster, das an einem Bildschirmrand (oder an der unteren Leiste des Missions-HUD) angedockt ist, liegt die unsichtbare Größenzone außerhalb des Bildschirms, und die Maus kann diesen Rand nicht greifen. An: An so einem Rand reicht die Zone einige Pixel ins Fenster hinein.
lbl.General/FixGameResizeCursors = Größen-Cursor des Spiels korrigieren
unit.General/FixGameResizeCursors = Menüs und Kampagne
help.General/FixGameResizeCursors = Außerhalb einer Mission zeigt das Spiel an den Größenrändern seiner Fenster (News, Task Force Builder) nur den normalen Pfeil: seine Cursor sind nicht geladen und es ist kein Cursor-Handler installiert. An: Der Mod liest die Cursor des Spiels und installiert den Handler, den die Missionen verwenden.
grp.Map = Karte
grp.Map drawing = Kartendarstellung
lbl.General/KeepMapView = Kartenausschnitt bei Größenänderung halten
unit.General/KeepMapView = Zoom folgt der Fenstergröße
help.General/KeepMapView = Ändert sich die Größe des Tactical-Display-Fensters, ändert sich der Kartenzoom mit, sodass der zuvor sichtbare Bereich sichtbar bleibt (die Karte behält ihre Proportionen). Aus: Der Zoom bleibt, ein größeres Fenster zeigt mehr von der Karte, ein kleineres weniger.
lbl.General/MapFineZoomShift = Feiner Zoom mit Umschalt
unit.General/MapFineZoomShift = Mausradschritte 5-mal kleiner
help.General/MapFineZoomShift = Karte: Bei gedrückter Umschalttaste zoomt das Mausrad die Karte in 5-mal kleineren Schritten als ohne sie.
grp.Desktop mode = Desktop-Modus
lbl.General/WindowedMapAndWorldView = Desktop-Modus aktivieren
unit.General/WindowedMapAndWorldView = freies Verschieben und Skalieren
help.General/WindowedMapAndWorldView = Desktop-Modus. Tactical Display und World View arbeiten nur als normale Fenster, die frei verschoben und skaliert werden können (wie die anderen Fenster): Sie werden nicht als maximiert gespeichert (kein ',max' in [Layouts]), beide werden immer angezeigt (das Spiel wird einmal in seinen Zustand Karte im Vollbild + World View versetzt), sie bleiben unter allen anderen Fenstern und tauschen die Plätze nur untereinander. Die Taste Toggle fullscreen minimap (standardmäßig Tab) schaltet die Karte nicht mehr um (sie wechselt zwischen den Desktops, DesktopCount), die Schaltflächen Maximieren / Wiederherstellen wirken nur auf das Fenster, und den Bildschirm hinter den Fenstern löscht der Mod (das Spiel zeichnet ihn in diesem Zustand nicht).
lbl.General/DesktopCount = Anzahl der Desktops
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Desktop-Modus: die Anzahl der Desktops (2 - 5). Die Taste Toggle fullscreen minimap des Spiels (Steuerung - Allgemein, standardmäßig Tab) wechselt zwischen ihnen: Jeder Desktop behält Position und Größe, geöffnet / geschlossen, Deckkraft, Skalierung und Ebene der Fenster sowie ob die World View offen ist. Die Desktops starten mit den eingebauten Anordnungen des Mods (1: World View (3D) oben, 2: Tactical Display (Karte) oben, 3: Karte auf dem ganzen Bildschirm, 4: 3D-Ansicht auf dem ganzen Bildschirm, 5: Karte und 3D-Ansicht nebeneinander).
lbl.General/WorldViewKey = Taste World View an / aus
unit.General/WorldViewKey = standardmäßig Einfg
help.General/WorldViewKey = Desktop-Modus: die Taste, die das World-View-Fenster öffnet und schließt. Eine Taste, die das Spiel schon verwendet (Steuerung - seine Belegungen, auch geänderte), wird nie genommen: Sie wird ignoriert und das Log meldet es. Keine = keine Taste. Sie wirkt nicht, solange Konsole, ein Menü oder ein Textfeld die Tastatur hat oder Umschalt / Strg / Alt gedrückt ist.
lbl.InMission/DragTimePanel = Verschiebbares Zeitpanel
unit.InMission/DragTimePanel = Doppelklick: zurück in die Ecke
help.InMission/DragTimePanel = Das Zeitpanel des Missions-HUD (Datum / Uhrzeit, Geschwindigkeit, Wiedergabe / Pause) lässt sich mit der Maus am Rahmen, am Geschwindigkeitstext oder an den Lücken zwischen den Schaltflächen ziehen; Doppelklick setzt es zurück in die Ecke.
grp.Task Force = Verband
lbl.Campaign/DismissDamaged = Beschädigte Schiffe entlassen
unit.Campaign/DismissDamaged = Erstattung abzüglich Reparatur
help.Campaign/DismissDamaged = Status des Kampagnen-Verbands: Ein beschädigtes Schiff, das repariert werden kann, darf entlassen werden; die Erstattung wird um die Reparaturkosten gemindert.
lbl.Campaign/SortLoadoutsByDate = Ausrüstungen nach Datum sortieren
unit.Campaign/SortLoadoutsByDate = eigene Versionen zuerst
help.Campaign/SortLoadoutsByDate = Kampagnen-Verband, Reiter Ausrüstung: Die eigenen Ausrüstungen des Schiffs werden nach Datum sortiert und vor den neueren Versionen der Klasse angezeigt (das Spiel zeigt sie zuletzt).
lbl.Campaign/FixVersionSwapPrice = Preis beim Versionstausch korrigieren
unit.Campaign/FixVersionSwapPrice = Preis laut Aufstellung
help.Campaign/FixVersionSwapPrice = Kampagnen-Verband, Reiter Ausrüstung: Ein Rumpftausch auf eine andere Version der Klasse wird wie ein Kauf nach dem Preis der Kampagnen-Aufstellung berechnet (das Spiel nimmt für den neuen Rumpf den ini-Preis der Einheit und für das vorhandene Schiff den Preis der Aufstellung: ein abweichender Preis machte aus einem Upgrade eine Erstattung).
lbl.Campaign/UpgradeShip = Schaltfläche „Schiff aufrüsten“ im Builder
unit.Campaign/UpgradeShip = Besatzung -1 Stufe
help.Campaign/UpgradeShip = Kampagnen-Task-Force-Builder: Eine Schaltfläche „Schiff aufrüsten“ ersetzt ein Schiff des Verbands durch das gewählte (verkauft zum Preis von Entlassen / Außer Dienst stellen, die Besatzung verliert eine Fertigkeitsstufe).
lbl.Campaign/FixReserveSubmarines = U-Boote in Wartung korrigieren
help.Campaign/FixReserveSubmarines = Behebt einen Spielfehler mit einem U-Boot, das zum Aufmunitionieren oder zur Reparatur geschickt wurde. Es geht bei Änderungen des Bestands nicht aus der Reserve verloren, wird während der Wartung im U-Boot-Reiter angezeigt wie die Schiffe in der Reserve, und ein bereits verlorenes U-Boot kommt beim Laden der Kampagnenkarte in die Reserve zurück.
lbl.Campaign/EventShipState = Schiffszustand bei Briefing und Zeitung
unit.Campaign/EventShipState = nach der letzten Mission
help.Campaign/EventShipState = Kampagnenkarte: Ist ein Briefing- oder Zeitungsereignis gewählt, zeigt die Task Force die Schiffe so, wie sie nach der letzten Mission sind (das Spiel zeigt den Zustand vor der ersten Mission: Munition voll, Schäden repariert).
grp.Game UI = Spiel-Oberfläche
grp.Diagnostics = Diagnose
grp.Mods = Mods
lbl.Debug/DumpXaml = XAML jetzt ausgeben
help.Debug/DumpXaml = Für die Entwicklung: Einschalten schreibt das XAML der bisher geladenen UI-Assets des Spiels nach BepInEx/AlternativeGameInterface_xaml und schaltet sich dann selbst aus (öffne vorher die benötigten Fenster).
lbl.Debug/Snapshot = Jetzt Momentaufnahme erstellen
help.Debug/Snapshot = Hängt den Zustand des Spiels (Bildzeit, Speicher, Objekte nach Typ, Logfehler, Sammlungen des Mods) an BepInEx/AlternativeGameInterface_snapshots.txt an und schaltet sich selbst aus. Eine vor dem Speichern und eine nach dem Laden aufnehmen, oder früh und spät in einer langen Sitzung: Jeder Wert zeigt die Änderung seit der vorherigen Aufnahme.
lbl.Debug/ScreenshotTabs = Screenshot all tabs now
help.Debug/ScreenshotTabs = For diagnostics: switching it on takes a screenshot of the whole options window for every tab of this settings window (and every page of the Desktop mode tab) and saves PNG files to BepInEx/AlternativeGameInterface_screens, then it switches itself off. The window must be open.
lbl.Debug/CollectGarbage = Speicher jetzt bereinigen
help.Debug/CollectGarbage = Führt einmalig eine vollständige Speicherbereinigung aus und entlädt ungenutzte Assets; der Speicher davor und danach wird ins BepInEx-Log geschrieben.
lbl.General/ModCreateFill = Create Mod ausfüllen
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Fenster Create Mod (Menü Mods): Bei Update Existing füllt die Wahl eines Workshop-Eintrags Pick Folder (Ordner des Mods in StreamingAssets) und Pick Image (thumbnail.jpg aus diesem Ordner) automatisch aus.
grp.Track State = Track State
lbl.UnitStatus/TrackState = Track State eines gewählten Kontakts
help.UnitStatus/TrackState = Fenster Unit Status: Ist ein Kontakt einer anderen Seite (ein Track, nicht die eigene Einheit) gewählt, zeigt das Fenster seinen Track State (das Informationsfenster des Kontakts: Status, Zuverlässigkeit, Erfassungen, Signaturen), statt leer zu bleiben.
lbl.UnitStatus/TrackLayout = Neu angeordnetes Track-State-Layout
help.UnitStatus/TrackLayout = Track State: Das Fenster ist neu angeordnet - kompakte Fakten, die Detektoren in einem scrollbaren Bereich begrenzter Höhe, den Rest nimmt die Kandidatentabelle ein. Aus: Layout des Informationsfensters des Spiels.
lbl.Map/ClipContactEllipse = Kontakt-Ellipsen beschneiden
unit.Map/ClipContactEllipse = hinter dem Sensor
help.Map/ClipContactEllipse = Karte: Die aus Peilungen gewonnene Positionsschätzung eines Kontakts wird entlang der Peilung gestaucht, damit ihre Fehlerellipse nicht hinter den Sensor reicht (Gegenseite der Peilung). Symbol, Entfernung im Label und Ellipse folgen der neuen Schätzung. Die Daten des Trackers selbst bleiben unverändert.
lbl.Map/CompactSonobuoys = Kompakte Sonobojen
unit.Map/CompactSonobuoys = halbe Größe, ohne Text
help.Map/CompactSonobuoys = Karte: Sind viele Sonobojen gleichzeitig auf der Karte sichtbar, werden ihre Symbole halb so groß und ihr Text entfällt. Beim Hineinzoomen, wenn weniger übrig sind, werden sie wie gewohnt angezeigt.
lbl.Map/SonobuoysThreshold = Sonobojen-Schwelle
unit.Map/SonobuoysThreshold = gleichzeitig sichtbar
help.Map/SonobuoysThreshold = Kompakte Sonobojen: Ab wie vielen gleichzeitig sichtbaren Sonobojen die kompakte Darstellung einschaltet. Sie schaltet sich wieder aus, wenn die Zahl unter 90 % dieses Werts fällt.
lbl.Map/GroupSpreadMiles = Streuungsgrenze: Schiffe, Boden
unit.Map/GroupSpreadMiles = sm vom Anführer
help.Map/GroupSpreadMiles = Karte: eine Einheit des Verbands (Schiffe, Bodeneinheiten), die weiter als so viele Seemeilen vom Anführer entfernt ist, ist eigenständig: eigene Beschriftung, nicht im Rahmen, um den der Verbandsname gesetzt wird.
lbl.Map/GroupSpreadMilesAir = Streuungsgrenze: Flugzeuge
unit.Map/GroupSpreadMilesAir = sm vom Anführer
help.Map/GroupSpreadMilesAir = Karte: dasselbe für Flugzeuge und Hubschrauber: eine Einheit des Verbands, die weiter als so viele Seemeilen vom Anführer fliegt, ist eigenständig.
lbl.Map/FormationLines = Verbandslinien
unit.Map/FormationLines = Anführer zu Einheiten, bei Auswahl
help.Map/FormationLines = Karte: Ist eine Einheit eines Verbands ausgewählt, werden Linien vom Anführer zu allen Einheiten des Verbands gezeichnet.
lbl.Map/AirGroupInfo = Flugzeugverband: Entfernung und Höhe
unit.Map/AirGroupInfo = unter dem Namen
help.Map/AirGroupInfo = Karte: die Beschriftung eines nicht ausgewählten Verbands aus Flugzeugen oder Hubschraubern zeigt unter dem Verbandsnamen Entfernung und Höhe des Anführers (es gelten die üblichen Beschriftungsregeln).
lbl.Map/FormationUpdateByLeader = Verbandsaktualisierung durch den Anführer
unit.Map/FormationUpdateByLeader = Flugzeuge bewegen sich gemeinsam
help.Map/FormationUpdateByLeader = Karte: Flugzeuge und Hubschrauber eines Verbands übernehmen ihre neuen Kartenpositionen gemeinsam, wenn der Anführer seine übernimmt (das Spiel tut es zu zufälligen Zeitpunkten, Einheit für Einheit). Die übrigen Positionen hinken bis zu einer Sekunde nach.
lbl.Map/DrawingImprovements = Verbesserte Darstellung von Objekten und Beschriftungen
unit.Map/DrawingImprovements = Hauptschalter
help.Map/DrawingImprovements = Karte: Hauptschalter der verbesserten Darstellung von Objekten und Beschriftungen (kompakte Sonobojen, Platzierung und Filter der Beschriftungen, Verbandslinien, gekürzte Kontaktellipsen). Aus: das Spiel zeichnet wie gewohnt, die Optionen darunter sind ausgeblendet.
lbl.Map/FriendlyBadgeInLabel = FRND-Marke in der Beschriftung
unit.Map/FriendlyBadgeInLabel = eigene Zeile
help.Map/FriendlyBadgeInLabel = Karte: Die Marke „FRND“ einer befreundeten Einheit einer anderen Seite steht in einer eigenen Zeile über der ersten Zeile ihrer Beschriftung und wird nicht neben dem Symbol gezeichnet.
lbl.Map/LabelPlacement = Position der Beschriftung
help.Map/LabelPlacement = Karte: Wo die Beschriftung einer Einheit relativ zum Symbol steht, zentriert an dieser Seite (bei Enge kann sie ausweichen). Spiel = Standardplatzierung.
val.Map/LabelPlacement.Game = Wie im Spiel
val.Map/LabelPlacement.Bottom = Mittig unten
val.Map/LabelPlacement.Top = Mittig oben
val.Map/LabelPlacement.Right = Mittig rechts
val.Map/LabelPlacement.Left = Mittig links
lbl.Map/GroupNameOnly = Nur Gruppenname
unit.Map/GroupNameOnly = bis zur Auswahl
help.Map/GroupNameOnly = Karte: Einheiten eines Verbands zeigen nur den Namen des Verbands, bis der Verband ausgewählt ist. Ihre eigenen Beschriftungen kommen zuletzt hinzu, nur wo Platz ist (nicht für Flugzeuge und Hubschrauber).
lbl.Map/LabelOverlapFilter = Überlappende Beschriftungen filtern
unit.Map/LabelOverlapFilter = größte Einheit bleibt
help.Map/LabelOverlapFilter = Karte: Überlappen sich die Beschriftungen von Schiffen oder Flugzeugen (und Verbandsnamen), bleibt nur die der größten Einheit bzw. des größten Verbands. Eine Einheit unbekannten Typs verdrängt keine bekannte; bei gleicher Größe bleibt die erste. Passt eine Beschriftung nicht, werden zuerst ihre Zeilen gekürzt (ab der letzten); entfernt wird sie nur, wenn schon die erste Zeile überlappt.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = Identifikationsfortschritt
unit.UnitStatus/TrackIdentProgress = grob, Zehnerschritte
help.UnitStatus/TrackIdentProgress = Track State: grober Fortschritt der Identifikation des Kontakts in Zehnerprozent (Beobachtungszeit seiner Emitter durch Ihr ESM im Verhältnis zur Zeit, die das Spiel zur Identifikation braucht). 100 %, wenn der Kontakt identifiziert ist. Nur im neu angeordneten Layout und nur, solange eines Ihrer ESM den Kontakt beobachtet. Hat das ESM seinen Teil getan, die Klasse ist aber noch unbekannt, steht in der Zeile "nicht genug Daten"; bei identifiziertem Kontakt wird sie ausgeblendet.
track.identProgress = Identifikationsfortschritt
track.identNoData = nicht genug Daten

; --- new ---
tab.Event Log = Ereignisprotokoll
grp.Links = Links
lbl.EventLog/AllTracksAreLinks = Alle Kontakte im Log sind Links
unit.EventLog/AllTracksAreLinks = Track-Nummern
help.EventLog/AllTracksAreLinks = Jede Track-Nummer im Ereignisprotokoll ist ein Link, wie die, die das Spiel selbst erzeugt (Neuer Kontakt, Track klassifiziert, Track verblasst u. Ä. sind im Spiel einfacher Text): Ein Klick wählt das Objekt, mit CenterMapOnClick zentriert ein erneuter Klick die Karte darauf. Verlinkt werden nur Tracks der eigenen Liste des Spielers.
lbl.EventLog/CenterMapOnClick = Karte bei erneutem Klick zentrieren
unit.EventLog/CenterMapOnClick = Tactical Display
help.EventLog/CenterMapOnClick = Ein erneuter Klick auf denselben Kontakt- oder Einheitenlink im Ereignisprotokoll zentriert die Karte der Tactical Display darauf (der erste Klick wählt nur aus, wie im Spiel).
grp.Layout = Darstellung
lbl.EventLog/Compact = Kompakte Darstellung
unit.EventLog/Compact = weniger Abstand
help.EventLog/Compact = Ereignisprotokoll: kleinere Ränder, Reiterköpfe und Zeilenabstände, damit mehr Zeilen passen. Die Schriftgröße bleibt.
lbl.Camera/BinocularsBelowHorizon = Schiffsfernglas unter dem Horizont
unit.Camera/BinocularsBelowHorizon = Grad · 0 = Spiel
help.Camera/BinocularsBelowHorizon = Schiffsfernglas (die optische Ansicht eines Schiffs): wie weit es unter den Horizont gesenkt werden kann, in Grad. Das Spiel stoppt es am Horizont. 0 = wie im Spiel.
lbl.Camera/BinocularsNormalView = Normale Ansicht im Fernglas bei maximalem Zoom
lbl.Camera/BinocularsNormalViewDayOnly = Normale Ansicht nur bei Tag
help.Camera/BinocularsNormalView = Das Fernglas startet bei maximaler Vergrößerung mit der normalen Ansicht (das Spiel startet es mit eingeschaltetem Nacht- / Wärmebildfilter). Die Filtertaste des Spiels schaltet den Filter ein.
help.Camera/BinocularsNormalViewDayOnly = Die normale Ansicht ist nur bei Tag die Vorgabe; nachts bleibt der eigene Standardfilter des Spiels.
ref.propulsion = Antrieb
ref.pp.nuclear = Nuklear
ref.pp.steam = Dampf
ref.pp.gasturbine = Gasturbine
ref.pp.diesel = Diesel
ref.pp.electric = Elektrisch
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = Antrieb in den Schiffsdaten
help.UnitReference/ShowPropulsion = Unit Reference: eine Zelle Antrieb in den Hauptparametern von Schiffen und U-Booten, nach Max Speed: Art und Leistung der Maschinen (Haupt- und Hilfsantrieb). Gilt für die nächste angezeigte Einheit.
ref.propulsion.tip = Antrieb: Art und Leistung der Maschinen (Haupt- und Hilfsantrieb)
lbl.UnitStatus/DamageListsWheel = Mausrad scrollt die Abschnittslisten
help.UnitStatus/DamageListsWheel = Fenster Unit Status, Reiter Damage Control: Die Schadenslisten der Abschnitte (Aft ... Forward: Wassereinbruch, Brände, beschädigte Systeme) scrollen mit dem Mausrad. Gilt für den nächsten angezeigten Reiter.
lbl.General/NoFrameLimit = Bildratenbegrenzung aufheben
unit.General/NoFrameLimit = Regler aus
help.General/NoFrameLimit = Keine Bildratenbegrenzung; der Regler darüber ist ausgeschaltet. Bei eingeschaltetem V-Sync begrenzt der Bildschirm weiterhin (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Adaptives V-Sync hinzufügen
unit.General/AddAdaptiveVSync = in der V-Sync-Liste
help.General/AddAdaptiveVSync = Fügt der V-Sync-Liste der Videooptionen den Eintrag „Adaptive V-Sync“ hinzu: V-Sync ist an, solange die Bilder mit dem Bildschirm mithalten, und aus, wenn nicht. Das Spiel speichert es als normales V-Sync, es funktioniert also auch ohne diese Mod.
grp.Performance = Leistung
grp.Text by background = Text nach Hintergrund
lbl.General/TextDarkAbove = Text wird dunkel ab
lbl.General/TextLightBelow = Text wird hell unter
unit.General/TextDarkAbove = Helligkeit 0 - 1
unit.General/TextLightBelow = Helligkeit 0 - 1
help.General/TextDarkAbove = Fenster mit eingeschaltetem Textkontrast und das Kompassband des World-View-Fensters: Helligkeit des Bildes hinter den Texten (0 = schwarz, 1 = weiß), ab der sie dunkel werden. Niedriger = sie werden schon auf dunkleren Bildern dunkel.
help.General/TextLightBelow = Helligkeit des Bildes hinter den Texten, unter der dunkle Texte wieder hell werden (Fenster mit Textkontrast, Kompassband). Nicht über „Text wird dunkel ab“; der Abstand zwischen beiden verhindert Flackern bei etwa dieser Helligkeit.
