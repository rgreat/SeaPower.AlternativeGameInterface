help.General/AdaptiveVSyncDisplay = V-Sync adaptative avec plus d'un écran actif (Unity attendrait chaque moniteur) : les images sont synchronisées sur un moniteur, les autres les reçoivent sans synchronisation verticale. Auto = le moniteur le plus rapide (fréquence la plus élevée) ; 1, 2 ... = cet écran (la liste montre leurs noms, tailles et fréquences).
