help.General/Language = Langue des textes du mod : un code d'une langue du jeu (en, ru ...) ; vide = la langue propre du jeu. Les textes sont dans les fichiers lang/<code>.ini du dossier du mod : modifiez-les pour traduire.

help.General/AllowDragOutside = Permet de faire glisser n'importe quelle fenêtre en partie hors de la zone visible (bords gauche, droit et bas).

help.General/MinVisiblePixels = Avec AllowDragOutside : au moins ce nombre de pixels de la largeur de la fenêtre restent visibles au bord gauche/droit. Au bord bas, la barre de titre reste toujours visible.

help.General/MaximizeOnDoubleClick = Un double-clic sur la barre de titre d'une fenêtre l'agrandit en plein écran, un nouveau double-clic la restaure (fenêtres redimensionnables). Une fenêtre fermée agrandie s'ouvre agrandie (',max' après sa disposition dans [Layouts]).

help.General/RemoveSizeLimits = Aucune limite de taille pour les fenêtres mémorisées (WindowPatterns, Unit Reference comprise) : ni taille minimale ni maximale propre (jusqu'à 100x60 px) et le redimensionnement par un bord n'est pas arrêté par les bords de l'écran (le haut reste à l'écran pour que la barre de titre reste accessible). Le changement s'applique tout de suite aux fenêtres à l'écran.

help.General/SnapWindows = Quand une fenêtre est déplacée ou redimensionnée à la souris, ses bords s'aimantent aux bords des autres fenêtres et de l'écran quand ils s'approchent à moins de SnapDistance (les bords visibles, sans la zone invisible de redimensionnement autour de la fenêtre).

help.General/SnapDistance = SnapWindows : à quelle distance un bord doit arriver pour s'aimanter, en pixels (1 - 50).

help.General/BringToFrontOnClick = Un clic sur une fenêtre la place devant les autres ; une fenêtre qui vient de s'ouvrir passe aussi devant. Seules les fenêtres sont réordonnées, et seulement sous le niveau que le jeu leur a donné (Panel.ZIndex) : ce que le jeu affiche lui-même (briefings, messages) reste au-dessus. Un Tactical Display / World View agrandi reste sous toutes les autres fenêtres.

help.General/CascadeOffset = Plusieurs fenêtres d'un même motif ouvertes en même temps (p. ex. Weapon Reference) : la première garde la disposition enregistrée et seules ses modifications sont enregistrées ; chaque suivante s'ouvre décalée vers la droite et vers le bas d'autant de pixels que de fenêtres déjà ouvertes (maintenue à l'écran comme une fenêtre déplacée). 0 = toutes s'ouvrent à la position enregistrée.

help.General/SettingsButton = Un bouton en forme de roue dentée dans la barre de titre de chaque fenêtre mémorisée (WindowPatterns) ouvre la fenêtre de réglages de Alternative Game Interface.

help.Mission/UnitPanelMenu = Mission : un clic droit sur le drapeau ou le nom de l'unité sélectionnée dans le panneau d'unité en bas ouvre le même menu qu'un clic droit sur l'unité sur la carte.
help.Mission/PauseAfterLoad = Mission : une partie sauvegardée est mise en pause dès son chargement, comme avec la touche pause. Si son briefing est affiché, la pause intervient après son bouton de lecture.
help.Mission/HideBriefingOnLoad = Mission : le briefing d'une partie sauvegardée est fermé aussitôt, comme si lecture était pressé ; une mission lancée depuis le début l'affiche toujours. Avec l'option de pause activée, le jeu est ensuite mis en pause.


help.General/EncyclopediaSplit = Menu principal : « Encyclopédie » ouvre la fenêtre Unit Reference (aucune mission n'est chargée) ; « Encyclopédie 3D » est l'entrée d'origine du jeu et charge la mission Encyclopédie.
lbl.General/FitNewsWindow = Fenêtre News sur toute la zone libre
help.General/FitNewsWindow = Menu principal : la fenêtre News occupe la zone libre à droite du menu, du haut de l'écran jusqu'à la barre des astuces, entièrement transparente avec un contenu à 120 %. Se désactive dès que, après l'avoir activée, vous déplacez, redimensionnez ou modifiez l'aspect de la fenêtre News ; l'activer oublie votre position, taille et aspect.
grp.Game = Jeu
lbl.General/ShowGameVersion = Filigrane de version
help.General/ShowGameVersion = Le texte de version du jeu à l'écran : comme le jeu le décide (branche bêta ou [Debug] ShowVersionWatermark), toujours affiché ou toujours masqué. Réglé en mémoire seulement, les fichiers du jeu ne changent pas.
val.General/ShowGameVersion.Game = Comme le jeu
val.General/ShowGameVersion.Show = Affiché
val.General/ShowGameVersion.Hide = Masqué
tab.World View = Vue Monde
grp.Camera offset = Décalage de caméra
cam.conflict = Le mod Camera Offset est chargé : le décalage se règle dans sa propre fenêtre (F11) ; ces réglages ne sont pas utilisés.
lbl.WorldView/CameraOffset = Décaler l'image
help.WorldView/CameraOffset = L'image 3D du World View est décalée pour que l'objet suivi ne soit pas au centre (comme le mod Camera Offset ; grisé si ce mod est chargé). Caméras de suivi seulement, pas aux jumelles / périscope. Effet immédiat, avant Apply.
lbl.WorldView/CameraOffsetFollowX = Objet suivi à l'écran
unit.WorldView/CameraOffsetFollowX = % de la vue
help.WorldView/CameraOffsetFollowX = Position de l'objet suivi à l'écran, en % de la vue depuis le centre (±25 %). Faites glisser le point sur le viseur, cliquez dessus ou utilisez les flèches.
help.General/FixSoundOnReload = Chargement d'une sauvegarde depuis une mission : les sons du jeu dépendant de la distance continuent de se mettre à jour alors que la caméra a disparu, et une fenêtre d'erreur s'affiche à chaque image. Ces erreurs sont masquées.
help.General/HideCustomMission = Menu principal : le fichier par défaut de l'éditeur "_Custom Mission" n'est pas affiché dans la liste SCENARIOS.

help.General/Backgrounds = Images de fond du menu principal et des écrans de chargement. Mods : si des mods apportent les leurs (ui/backgrounds), seules celles-ci s'affichent. Mélange : comme le jeu - une au hasard parmi celles du jeu et de tous les mods. Jeu : uniquement celles du jeu.
val.General/Backgrounds.Mods = Mods uniquement
val.General/Backgrounds.Mixed = Mélange
val.General/Backgrounds.Game = Jeu uniquement
help.Monitors/Enabled = Mode bureau : les autres moniteurs fonctionnent comme le principal - on peut y placer des fenêtres (Moniteur dans le menu de la fenêtre). La carte du second moniteur et le moniteur World View du jeu ne sont alors pas utilisés. S'applique dès le prochain lancement de mission.
help.General/RealPhotos = Les images propres à ce mod (vraies photos, ui/backgrounds) parmi les fonds du menu et des écrans de chargement. Désactivé : elles ne sont pas affichées ; si aucun autre mod n'apporte d'images, celles du jeu sont affichées quel que soit le réglage Images de fond.
help.General/MenuBackground = Fond du menu principal. Vidéo : la vidéo en boucle du jeu. Diaporama : les images de fond (voir Images de fond), qui changent après le délai réglé ; la vidéo n'est alors pas chargée, ce qui économise des ressources.
val.General/MenuBackground.Video = Vidéo du jeu
val.General/MenuBackground.Slideshow = Diaporama d'images
help.General/SlideshowSeconds = Diaporama du menu principal : durée d'affichage d'une image, en secondes.

help.MissionEditor/RememberMissionFolder = Images de fond du menu principal et des écrans de chargement : quand des mods apportent les leurs (ui/backgrounds), seules les leurs sont affichées, sans mélange avec celles du jeu. Désactivé = comme le jeu : une image tirée au hasard parmi celles du jeu et de tous les mods réunies.
help.General/RememberSaveFolder = Les fenêtres Sauvegarder et Charger la partie (menu pause, menu principal, campagne) s'ouvrent dans le dernier dossier utilisé. Les sauvegardes de campagne et de mission gardent chacune leur dossier.
help.General/RememberSaveSort = Les fenêtres Save game et Load game mémorisent le tri choisi en cliquant sur l’en-tête Nom ou Date de modification (croissant ou décroissant) : il s’applique à l’ouverture de la fenêtre et dans les dossiers ouverts ensuite. Les sauvegardes de campagne et de mission gardent chacune leur tri.
help.General/DoubleClickOpen = Un double-clic ouvre un fichier dans la fenêtre de chargement et les autres fenêtres d'ouverture (comme le bouton Ouvrir) et lance un scénario dans la liste des scénarios du menu principal (comme le bouton Jouer). Les fenêtres de sauvegarde ne changent pas.
lbl.General/AutoOpenLoad = Ouvrir Charger en entrant dans Scénarios et Campagne
lbl.General/AutoLoadCloseOnCampaign = Fermer Charger au choix d’une campagne
help.General/AutoOpenLoad = Menu principal : entrer dans Scénarios ou Campagne ouvre aussitôt la fenêtre Charger la partie.
help.General/AutoLoadCloseOnCampaign = Écran Campagne : la fenêtre Charger la partie ouverte par « Ouvrir Charger en entrant dans Scénarios et Campagne » se ferme quand vous cliquez sur une campagne (les conditions de départ s’ouvrent), car elle les cache. Une fenêtre ouverte par vous reste.
lbl.General/MenuWindowsAside = Fenêtres du menu à côté des boutons
unit.General/MenuWindowsAside = Charger etc., pas sur le menu
help.General/MenuWindowsAside = Écrans du menu principal (Scénarios, Campagne ...) : une fenêtre (Charger la partie ...) s'ouvre à côté des boutons du menu, pas dessus.
lbl.General/FilePickerTall = Sélecteur de fichiers sans limite de hauteur
help.General/FilePickerTall = Les fenêtres de sélection de fichiers (charger / enregistrer la partie, etc.) n'ont pas de hauteur maximale (le jeu la limite à 400).

help.General/ColorIniFiles = Sélecteurs de fichiers de l'éditeur de missions : les noms de fichiers *.ini sont en bleu clair.

help.Campaign/StrictLoadouts = Task Force Builder de la campagne : les versions de navires et les loadouts ne sont proposés que pour les navires que la mission indique comme disponibles ou que vous possédez déjà (le jeu propose aussi tout navire partageant l'étiquette d'encyclopédie). Enregistré avec la campagne ; choisi au début d'une nouvelle campagne.

help.General/DeleteOldLogs = Au démarrage du jeu, les fichiers journaux des sessions précédentes (dossier Logs du jeu : *_session_*, *_sessionEventLog_*) sont supprimés ; ceux de cette session restent.

help.General/Debug = Active la journalisation détaillée et BepInEx/AlternativeGameInterface.trace.txt.
help.Debug/TracePeriodic = Avec la trace de débogage activée : aussi les diagnostics qui écrivent en permanence (chaque étiquette du Tactical Display toutes les 2 s, la mise à jour de la formation par le chef, l'aimantation des fenêtres, le profileur). Désactivé : seulement les événements, un petit fichier. À activer pour un court test : le fichier grossit de plusieurs mégaoctets.

help.General/WindowPatterns = Noms des fenêtres à mémoriser, séparés par des virgules. Sans tenir compte de la casse, les espaces sont ignorés à la comparaison ('Unit Status*' correspond aussi à 'UnitStatusView'), '*' remplace n'importe quel texte (même aucun). Un motif est comparé au nom de la fenêtre, au texte de l'en-tête, au type de contenu et au type de view-model, et doit correspondre à l'une de ces chaînes depuis son début ('Unit Reference*' correspond à 'Unit Reference - XYZ' ; utilisez '*texte*' pour chercher n'importe où). Les fenêtres correspondant au même motif partagent une disposition enregistrée.

help.General/AddWindowKey = Survolez une fenêtre avec la souris et appuyez sur cette touche pour l'ajouter à WindowPatterns.

help.General/RememberOpenWindows = Motifs de fenêtres séparés par des virgules (mêmes règles que WindowPatterns) dont l'état ouverte / fermée est mémorisé : après un écran de chargement (début de mission, encyclopédie), ces fenêtres sont ouvertes ou fermées comme elles ont été laissées. L'état est conservé dans [OpenWindows]. Seules les fenêtres que le jeu a déjà créées peuvent être ouvertes (p. ex. Unit Status a besoin d'une unité sélectionnée).

help.WindowBorder/Enabled = Cadre fin autour de chaque fenêtre déplaçable, sur le bord de sa partie visible. Dessiné par-dessus l'aspect propre de la fenêtre ; il ne change pas sa taille et n'intercepte pas la souris.

help.WindowBorder/Thickness = Épaisseur du cadre en pixels (0.5 - 10). Le cadre n'a pas de côté supérieur (il passerait sous la barre de titre).

help.WindowBorder/Color = Couleur du cadre : #RRGGBB ou #AARRGGBB (AA = opacité, 00 transparent - FF opaque).

help.WindowBorder/ToolTips = Cadre aussi autour des info-bulles (bulles d'aide) du jeu, sur les quatre côtés, avec l'épaisseur et la couleur ci-dessus.

help.UnitStatus/SectionsMinHeight = Fenêtre Unit Status, onglet Damage Control : hauteur minimale des panneaux de section (Aft ... Forward avec leurs listes de dégâts), en pixels d'écran. Une fenêtre plus basse les réduit jusqu'à cette valeur ; en dessous, l'onglet ne rétrécit plus et le panneau 'Auto Damage Control Status' du bas sort de la fenêtre. 0 = comme dans le jeu (tout l'onglet a un minimum fixe ; les panneaux reçoivent ce que les autres lignes en laissent, affiché dans la fenêtre de réglages).

help.UnitStatus/UnitReferenceTab = Fenêtre Unit Status : un onglet "Reference" (le dernier) avec la Unit Reference de l'unité sélectionnée (son navire / variante et son loadout), sans l'arbre des unités ni le panneau de recherche.


help.General/ImprovedUnitReferenceUI = Améliorations de la fenêtre Unit Reference : masquer l'arbre des unités (bouton '<' au bord gauche) masque aussi le panneau de recherche / filtres, rétrécit la fenêtre de la largeur de l'arbre et la déplace vers la droite d'autant, de sorte que l'information sur l'unité reste en place et occupe l'espace libéré en haut (afficher l'arbre fait l'inverse ; les dispositions enregistrées stockent la fenêtre avec l'arbre affiché) ; un arbre des unités plus large avec un séparateur à son bord droit qu'on peut faire glisser à la souris (largeur conservée dans [UnitReference] TreeWidth) ; le pays choisi est mémorisé ([UnitReference] Country). S'applique aux fenêtres Unit Reference ouvertes ensuite.

help.UnitReference/ShowLoadoutList = Unit Reference : afficher aussi le sélecteur de loadout pour les navires, sous-marins et unités terrestres à plusieurs loadouts (le jeu ne l'affiche que pour les avions) ; l'information de l'unité suit le loadout choisi.

help.UnitReference/OptimizeTree = Arbre de Unit Reference : les classes d'un type d'unité sont triées par date d'entrée en service ; dans un groupe de classe, chaque unité est suivie de ses variantes de loadout (par date, Early d'abord), libellées "Unité [Variante]" (pas de suffixe pour Default ou une variante unique) ; une unité sans loadout Default n'affiche que ses variantes. S'applique aux fenêtres Unit Reference ouvertes ensuite.

help.UnitReference/ScrollToSelected = Arbre de Unit Reference : faire défiler l'arbre pour que l'unité sélectionnée soit visible (centrée à l'ouverture de la fenêtre ou à l'affichage de l'arbre).
help.UnitReference/ReferenceTabs = Référence Unité : une barre d’onglets au-dessus de la page de l’unité. Un double-clic sur une unité dans l’arborescence lui ajoute un onglet (la même unité n’est jamais ajoutée deux fois). Une Référence Unité que le jeu ouvrirait dans une nouvelle fenêtre devient un onglet de la fenêtre déjà ouverte. La croix d’un onglet le ferme. Activé par défaut.

help.UnitReference/EarliestVariantOnClick = Arbre de Unit Reference : un clic sur une classe (un nœud à plusieurs variantes) sélectionne sa variante la plus ancienne. Le jeu sélectionne celle en service l'année de la mission, sinon la plus récente.

help.UnitReference/KeepOpenedUnit = Unit Reference : l'unité pour laquelle la fenêtre a été ouverte reste dans l'arbre, avec sa classe, même si les filtres pays / date / recherche / Armées seulement la masqueraient.

help.UnitReference/TreeWheelOnlyOver = Arbre de Unit Reference : la molette de la souris fait défiler l'arbre seulement quand le curseur est dessus.

help.UnitReference/RememberSearchPanel = Le panneau de recherche de la fenêtre Unit Reference (catégorie, 'filtrer par date', 'chercher par nom seulement' et le texte de recherche) est conservé dans le .cfg (les clés ci-dessous) et rétabli à l'ouverture d'une fenêtre Unit Reference (avec ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference : la liste des pays n'affiche que les pays qui ont des unités pour le texte de recherche actuel, 'Filtrer par date' et 'Armées seulement' (le pays sélectionné est toujours affiché).

help.UnitReference/SearchInDescriptionAndId = Unit Reference : avec 'Chercher par nom seulement' désactivé, la recherche trouve aussi les unités par leur description et par leur id ini (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference : une info-bulle avec l'aide courte (le début de la description) de l'arme, du capteur ou du système sur les liens en surbrillance, quand il en a une.


; --- new ---
tip.look = Opacité et échelle des fenêtres
menu.button = Interface du jeu
tab.track = Track State
up.button = Améliorer le navire...
up.title = Améliorer le navire
up.sell = Vendre
up.buy = Acheter
up.crew = Équipage
up.min = niveau le plus bas
up.do = Améliorer
up.cancel = Annuler
up.saleDismiss = Renvoyé pour {0} pts
up.saleDecom = Désarmé pour {0} pts
up.aircraft = {0} aéronefs affectés : jusqu'à {1} passent sur le nouveau navire (selon la place au hangar), les autres retournent dans le pool non affecté.
up.price = Prix : {0} pts
up.priceSur = Prix : {0} pts (+{1} de supplément de rareté)
up.damaged = Le navire est endommagé : le coût de réparation est déjà déduit du remboursement ({0} pts).
up.points2 = Points : {0} > {1}
up.fleet = Valeur de la flotte : {0} > {1} / {2}
up.tip = Remplace un navire de la force par celui sélectionné : l'ancien est vendu au prix de Renvoi (Désarmement quand c'est la seule possibilité), le nouveau est acheté, l'équipage perd un niveau de compétence (Alternative Game Interface).
up.noSel = Sélectionnez un navire dans la liste.
up.noStatus = La force n'est pas disponible ici.
up.hist = Indisponible avec des renforts historiques.
up.pending = Confirmez ou retirez d'abord les achats en attente.
up.none = Aucun navire de la force ne peut être remplacé par celui-ci.
up.points = pas assez de points
up.cap = dépasse le plafond de valeur de la flotte
up.owned = cette version est déjà dans votre flotte
up.item = vendu pour {0} pts, équipage {1} > {2}
up.itemDecom = désarmé pour {0} pts, équipage {1} > {2}
look.opacity = Opacité
look.scale = Échelle
look.outline = Contraste du texte
look.level = Niveau
look.level.bottom = Dessous
look.level.default = Par défaut
look.monitor = Moniteur
look.level.top = Dessus
look.outline.tip = Les textes d'une fenêtre transparente restent lisibles : les gris deviennent blanc ou noir purs avec un halo, et sur un fond clair tous les textes s'assombrissent (leur luminosité suit celle de ce que l'écran montre sous la fenêtre ; la teinte reste). S'active seul sous 50 % d'opacité, modifiable.
tab.Desktop mode = Bureau
tab.Tactical Display = Écran tactique
lbl.General/ResizeDockedWindows = Redimensionner les fenêtres ancrées
unit.General/ResizeDockedWindows = la zone entre aux bords de l'écran
help.General/ResizeDockedWindows = Une fenêtre ancrée à un bord de l'écran (ou à la barre du bas du HUD de mission) a sa zone de redimensionnement invisible hors de l'écran, et la souris ne peut pas saisir ce bord. Activé : à un tel bord, la zone entre de quelques pixels dans la fenêtre.
lbl.General/FixGameResizeCursors = Corriger les curseurs de redimensionnement du jeu
unit.General/FixGameResizeCursors = menus et campagne
help.General/FixGameResizeCursors = Hors mission, le jeu affiche la flèche simple sur les bords de redimensionnement de ses fenêtres (News, Task Force Builder) : ses curseurs ne sont pas chargés et aucun gestionnaire de curseur n'est installé. Activé : le mod lit les curseurs du jeu et installe le gestionnaire qu'utilisent les missions.
grp.Map = Carte
grp.Map drawing = Dessin de la carte
lbl.General/KeepMapView = Garder la vue de la carte au redimensionnement
unit.General/KeepMapView = le zoom suit la taille de la fenêtre
help.General/KeepMapView = Quand la taille de la fenêtre Tactical Display change, le zoom de la carte change avec elle pour que la zone visible le reste (la carte garde ses proportions). Désactivé : le zoom reste, une fenêtre plus grande montre plus de carte, une plus petite moins.
lbl.General/MapFineZoomShift = Zoom fin avec Maj
unit.General/MapFineZoomShift = pas de molette 5 fois plus petits
help.General/MapFineZoomShift = Carte : avec Maj enfoncée, la molette zoome la carte par pas 5 fois plus petits que sans.
grp.Desktop mode = Mode bureau
lbl.General/WindowedMapAndWorldView = Activer le mode bureau
unit.General/WindowedMapAndWorldView = déplacement et taille libres
help.General/WindowedMapAndWorldView = Mode bureau. Tactical Display et World View ne fonctionnent que comme des fenêtres ordinaires, déplaçables et redimensionnables librement (comme les autres) : elles ne sont pas mémorisées comme agrandies (pas de ',max' dans [Layouts]), les deux sont toujours affichées (le jeu est mis une fois dans l'état carte plein écran + World View), elles restent sous toutes les autres fenêtres et ne changent de place qu'entre elles. La touche Toggle fullscreen minimap (Tab par défaut) ne bascule plus la carte (elle change de bureau, DesktopCount), les boutons agrandir / restaurer n'agissent que sur la fenêtre, et l'écran derrière les fenêtres est effacé par le mod (le jeu ne le dessine pas dans cet état).
lbl.General/DesktopCount = Nombre de bureaux
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Mode bureau : le nombre de bureaux (2 - 5). La touche Toggle fullscreen minimap du jeu (Commandes - Général, Tab par défaut) bascule entre eux : chaque bureau garde la position et la taille, ouverte / fermée, l'opacité, l'échelle et le niveau des fenêtres, et si World View est ouverte. Les bureaux démarrent avec les dispositions intégrées du mod (1 : World View (3D) dessus, 2 : Tactical Display (carte) dessus, 3 : la carte sur tout l'écran, 4 : la vue 3D sur tout l'écran, 5 : carte et vue 3D côte à côte).
lbl.General/WorldViewKey = Touche World View marche / arrêt
unit.General/WorldViewKey = Inser par défaut
help.General/WorldViewKey = Mode bureau : la touche qui ouvre et ferme la fenêtre World View. Une touche déjà utilisée par le jeu (Commandes - ses affectations, y compris celles que vous avez changées) n'est jamais prise : elle est ignorée et le journal l'indique. Aucune = pas de touche. Sans effet tant que la console, un menu ou une zone de texte a le clavier, ou que Maj / Ctrl / Alt est enfoncée.
lbl.InMission/DragTimePanel = Panneau de temps déplaçable
unit.InMission/DragTimePanel = double-clic : retour au coin
help.InMission/DragTimePanel = Le panneau de temps du HUD de mission (date / heure, vitesse, lecture / pause) peut être déplacé à la souris par son cadre, le texte de vitesse ou les espaces entre ses boutons ; un double-clic le remet dans le coin.
grp.Task Force = Force
lbl.Campaign/DismissDamaged = Renvoyer les navires endommagés
unit.Campaign/DismissDamaged = remboursement moins réparation
help.Campaign/DismissDamaged = État de la force de campagne : un navire endommagé réparable peut être renvoyé ; le remboursement est réduit du coût de réparation.
lbl.Campaign/SortLoadoutsByDate = Trier les dotations par date
unit.Campaign/SortLoadoutsByDate = versions propres d'abord
help.Campaign/SortLoadoutsByDate = Force de campagne, onglet Dotations : les dotations propres du navire sont triées par date et affichées avant les versions plus récentes de la classe (le jeu les affiche en dernier).
lbl.Campaign/FixVersionSwapPrice = Corriger le prix du changement de version
unit.Campaign/FixVersionSwapPrice = prix de la liste
help.Campaign/FixVersionSwapPrice = Force de campagne, onglet Dotations : un changement de coque vers une autre version de la classe est tarifé d'après la liste de la campagne comme un achat (le jeu utilise le prix ini de l'unité pour la nouvelle coque et le prix de la liste pour le navire possédé : un prix de liste différent transformait une amélioration en remboursement).
lbl.Campaign/UpgradeShip = Bouton Améliorer le navire dans le Builder
unit.Campaign/UpgradeShip = équipage -1 niveau
help.Campaign/UpgradeShip = Task Force Builder de campagne : un bouton « Améliorer le navire » remplace un navire de la force par celui sélectionné (vendu au prix de Renvoi / Désarmement, l'équipage perd un niveau de compétence).
lbl.Campaign/FixReserveSubmarines = Corriger les sous-marins en entretien
help.Campaign/FixReserveSubmarines = Corrige un bogue du jeu avec un sous-marin envoyé au réarmement ou en réparation. Il n'est plus perdu de la Réserve quand l'effectif change, il apparaît dans l'onglet Sous-marins pendant l'entretien comme les navires en Réserve, et un sous-marin déjà perdu est remis dans la Réserve au chargement de la carte de campagne.
lbl.Campaign/EventShipState = État des navires lors des briefings et journaux
unit.Campaign/EventShipState = après la dernière mission
help.Campaign/EventShipState = Carte de campagne : tant qu'un événement de briefing ou de journal est sélectionné, la Task Force montre les navires tels qu'ils sont après la dernière mission (le jeu montre l'état d'avant la première mission : munitions pleines, dégâts réparés).
grp.Game UI = Interface du jeu
grp.Diagnostics = Diagnostic
grp.Mods = Mods
lbl.Debug/DumpXaml = Exporter le XAML maintenant
help.Debug/DumpXaml = Pour le développement : l'activer écrit le XAML des ressources d'interface du jeu chargées jusqu'ici dans BepInEx/AlternativeGameInterface_xaml, puis il s'éteint tout seul (ouvrez d'abord les fenêtres voulues).
lbl.Debug/Snapshot = Prendre un instantané
help.Debug/Snapshot = Ajoute l'état du jeu (temps d'image, mémoire, objets par type, erreurs du journal, collections du mod) à BepInEx/AlternativeGameInterface_snapshots.txt, puis se désactive seul. En prendre un avant la sauvegarde et un après le chargement, ou tôt et tard dans une longue session : chaque valeur indique sa variation depuis l'instantané précédent.
lbl.Debug/ScreenshotTabs = Capturer maintenant tous les onglets de tous les mods
help.Debug/ScreenshotTabs = Pour le diagnostic : une fois activé, il prend une capture de toute la fenêtre d'options pour chaque onglet (et chaque page) de cette fenêtre de réglages, puis la même chose pour les fenêtres des autres mods rgreat installés, et enregistre des fichiers PNG dans BepInEx/<Mod>_screens ; ensuite il se désactive tout seul. La fenêtre doit être ouverte.
lbl.Debug/CollectGarbage = Libérer la mémoire maintenant
help.Debug/CollectGarbage = Lance une fois un ramassage complet des déchets et décharge les ressources inutilisées ; la mémoire avant et après est écrite dans le journal BepInEx.
lbl.General/ModCreateFill = Remplir Create Mod
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Fenêtre Create Mod (menu Mods) : avec Update Existing, le choix d'un élément du Workshop remplit Pick Folder (dossier du mod dans StreamingAssets) et Pick Image (thumbnail.jpg de ce dossier).
grp.Track State = Track State
lbl.UnitStatus/TrackState = Track State du contact sélectionné
help.UnitStatus/TrackState = Fenêtre Unit Status : tant qu'un contact d'un autre camp (une piste, pas votre unité) est sélectionné, la fenêtre affiche son Track State (la fenêtre d'information du contact : statut, confiance, détections, signatures) au lieu de rester vide.
lbl.UnitStatus/TrackLayout = Disposition remaniée de Track State
help.UnitStatus/TrackLayout = Track State : la fenêtre est recomposée - faits compacts, détecteurs dans une zone défilante de hauteur limitée, le reste pour le tableau des candidats. Désactivé : la disposition de la fenêtre d'information du jeu.
lbl.Map/ClipContactEllipse = Couper les ellipses des contacts
unit.Map/ClipContactEllipse = derrière le capteur
help.Map/ClipContactEllipse = Carte : l'estimation de position d'un contact faite à partir de relèvements est comprimée le long du relèvement pour que son ellipse d'erreur ne passe pas derrière le capteur (côté opposé au relèvement). L'icône, la distance de l'étiquette et l'ellipse suivent la nouvelle estimation. Les données du traqueur ne sont pas modifiées.
lbl.Map/CompactSonobuoys = Bouées sonores compactes
unit.Map/CompactSonobuoys = moitié de taille, sans texte
help.Map/CompactSonobuoys = Carte : quand beaucoup de bouées sonores sont visibles en même temps sur la carte, leurs icônes sont réduites de moitié et leur texte est retiré. En zoomant, quand il en reste moins, elles s'affichent normalement.
lbl.Map/SonobuoysThreshold = Seuil de bouées sonores
unit.Map/SonobuoysThreshold = visibles en même temps
help.Map/SonobuoysThreshold = Bouées sonores compactes : à partir de combien de bouées visibles en même temps sur la carte l'affichage compact s'active. Il se désactive quand le nombre passe sous 90 % de cette valeur.
lbl.Map/GroupSpreadMiles = Limite de dispersion : navires, sol
unit.Map/GroupSpreadMiles = nm du chef
help.Map/GroupSpreadMiles = Carte : une unité du groupe (navires, unités terrestres) à plus de ce nombre de milles nautiques du chef est indépendante : elle a sa propre étiquette et n'entre pas dans le cadre autour duquel le nom du groupe est placé.
lbl.Map/GroupSpreadMilesAir = Limite de dispersion : aéronefs
unit.Map/GroupSpreadMilesAir = nm du chef
help.Map/GroupSpreadMilesAir = Carte : idem pour les avions et hélicoptères : une unité du groupe qui vole à plus de ce nombre de milles nautiques du chef est indépendante.
lbl.Map/FormationLines = Lignes du groupe
unit.Map/FormationLines = chef vers unités, à la sélection
help.Map/FormationLines = Carte : quand une unité d'un groupe est sélectionnée, des lignes sont tracées du chef à toutes les unités du groupe.
lbl.Map/AirGroupInfo = Groupe d'aéronefs : distance et altitude
unit.Map/AirGroupInfo = sous le nom
help.Map/AirGroupInfo = Carte : l'étiquette d'un groupe non sélectionné d'avions ou d'hélicoptères affiche, sous le nom du groupe, la distance et l'altitude de son chef (les règles habituelles des étiquettes s'appliquent).
lbl.Map/FormationUpdateByLeader = Mise à jour du groupe par le chef
unit.Map/FormationUpdateByLeader = les aéronefs bougent ensemble
help.Map/FormationUpdateByLeader = Carte : les avions et hélicoptères d'un groupe prennent leurs nouvelles positions sur la carte ensemble, au moment où le chef prend la sienne (le jeu le fait à des moments aléatoires, une unité à la fois). Les autres positions ont jusqu'à une seconde de retard.
lbl.Map/DrawingImprovements = Dessin amélioré des objets et des étiquettes
unit.Map/DrawingImprovements = interrupteur général
help.Map/DrawingImprovements = Carte : interrupteur général du dessin amélioré des objets et des étiquettes (bouées compactes, placement et filtres des étiquettes, lignes de groupe, ellipses de contact coupées). Désactivé : le jeu dessine comme d'habitude et les options ci-dessous sont masquées.
lbl.Map/FriendlyBadgeInLabel = Badge FRND dans l'étiquette
unit.Map/FriendlyBadgeInLabel = ligne séparée
help.Map/FriendlyBadgeInLabel = Carte : le badge « FRND » d'une unité amie d'un autre camp est mis sur une ligne à part au-dessus de la première ligne de son étiquette, au lieu d'être dessiné à côté de l'icône.
lbl.Map/LabelPlacement = Position des étiquettes
help.Map/LabelPlacement = Carte : où l'étiquette d'une unité est placée par rapport à son icône, centrée sur ce côté (elle peut se décaler en cas d'encombrement). Jeu = placement d'origine.
val.Map/LabelPlacement.Game = Comme dans le jeu
val.Map/LabelPlacement.Bottom = Centré en bas
val.Map/LabelPlacement.Top = Centré en haut
val.Map/LabelPlacement.Right = Centré à droite
val.Map/LabelPlacement.Left = Centré à gauche
lbl.Map/GroupNameOnly = Nom du groupe seul
unit.Map/GroupNameOnly = jusqu'à la sélection
help.Map/GroupNameOnly = Carte : les unités d'un groupe n'affichent que le nom du groupe tant qu'il n'est pas sélectionné. Leurs propres étiquettes sont ajoutées en dernier, seulement là où il y a de la place (pas pour les avions et hélicoptères).
lbl.Map/LabelOverlapFilter = Filtrer les étiquettes superposées
unit.Map/LabelOverlapFilter = garde la plus grosse unité
help.Map/LabelOverlapFilter = Carte : quand les étiquettes de navires ou d'aéronefs (et les noms de groupes) se chevauchent, seule celle de l'unité ou du groupe le plus gros reste. Une unité de type inconnu ne l'emporte pas sur une connue ; à taille égale, la première reste. Si une étiquette ne tient pas, ses lignes sont d'abord réduites (en partant de la dernière) ; elle n'est supprimée que si même la première ligne chevauche.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = Progression de l'identification
unit.UnitStatus/TrackIdentProgress = approximatif, dizaines de %
help.UnitStatus/TrackIdentProgress = Track State : progression approximative de l'identification du contact, en dizaines de pour cent (temps d'observation de ses émetteurs par votre ESM par rapport au temps nécessaire au jeu pour les identifier). 100 % lorsque le contact est identifié. Uniquement dans la disposition remaniée et tant qu'un de vos ESM observe le contact. Si l'ESM a fait sa part mais que la classe reste inconnue, la ligne indique "données insuffisantes" ; elle est masquée lorsque le contact est identifié.
track.identProgress = Progression de l'identification
track.identNoData = données insuffisantes

; --- new ---
tab.Event Log = Journal d'événements
grp.Links = Liens
lbl.EventLog/AllTracksAreLinks = Tous les contacts du journal sont des liens
unit.EventLog/AllTracksAreLinks = numéros de piste
help.EventLog/AllTracksAreLinks = Chaque numéro de piste du journal d'événements est un lien, comme ceux que crée le jeu (Nouveau contact, Piste classée, Piste disparue et autres sont du texte simple dans le jeu) : un clic sélectionne l'objet ; avec CenterMapOnClick, un clic répété centre la carte dessus. Seules les pistes de la liste du joueur sont liées.
lbl.EventLog/CenterMapOnClick = Centrer la carte au second clic
unit.EventLog/CenterMapOnClick = Écran tactique
help.EventLog/CenterMapOnClick = Un nouveau clic sur le même lien de contact ou d'unité du journal d'événements centre la carte du Tactical Display dessus (le premier clic ne fait que sélectionner, comme dans le jeu).
grp.Layout = Disposition
lbl.EventLog/Compact = Disposition compacte
unit.EventLog/Compact = moins d'espace
help.EventLog/Compact = Journal des événements : marges, en-têtes d'onglets et espacement des lignes réduits, pour afficher plus de lignes. La taille du texte ne change pas.
lbl.EventLog/WrapLines = Renvoyer à la ligne les lignes longues
unit.EventLog/WrapLines = à la largeur de la fenêtre
help.EventLog/WrapLines = Fenêtre du journal des événements : une ligne longue de l'onglet du journal passe à la ligne selon la largeur de la fenêtre (le jeu la coupe au bord de la fenêtre).
tab.Formation Manager = Formation Manager
tab.Formation Editor = Éditeur de formations
grp.Clicks = Clics
grp.Range rings = Cercles de portée
lbl.FormationManager/ClickGoesToUnit = Un clic va à l'unité
help.FormationManager/ClickGoesToUnit = Formation Manager : un clic sur une unité ou une formation la sélectionne et y amène la caméra, comme le double clic. Le double clic fonctionne comme avant. Désactivé par défaut.
lbl.FormationManager/DoubleClickCentersMap = Le double clic centre la carte
unit.FormationManager/DoubleClickCentersMap = Écran tactique
help.FormationManager/DoubleClickCentersMap = Formation Manager : un double clic sur une unité centre aussi la carte du Tactical Display sur elle (le jeu le fait pour l'unité sélectionnée avec la touche C). Sur la ligne d'une formation, le double clic ouvre ou ferme seulement la branche. La caméra va à l'unité comme toujours. Désactivé par défaut.
lbl.FormationEditor/ScaleStep = Pas du curseur d'échelle
unit.FormationEditor/ScaleStep = nm
help.FormationEditor/ScaleStep = Éditeur de formations (en mission et dans la préparation de mission de la campagne) : pas du curseur d'échelle (cercles de portée). Celui du jeu est de 0,05 nm. Avec un pas supérieur à 0,05, la valeur minimale du curseur est le pas lui-même.
lbl.FormationEditor/ScaleButtons = Boutons d'échelle 1 - 5 nm
help.FormationEditor/ScaleButtons = Éditeur de formations : sous le curseur d'échelle, une rangée de boutons 1, 2, 3, 4, 5 nm ; chacun règle l'échelle immédiatement.
lbl.FormationEditor/RememberScale = Mémoriser l'échelle de chaque formation
help.FormationEditor/RememberScale = Éditeur de formations en mission : l'échelle de chaque formation est mémorisée (le jeu l'oublie à la fermeture de l'éditeur) et conservée dans la sauvegarde.
lbl.FormationEditor/MinimizeScale = Minimiser l'échelle d'une nouvelle formation
help.FormationEditor/MinimizeScale = Éditeur de formations en mission : une formation dont l'échelle n'est pas encore mémorisée s'ouvre à la plus petite échelle contenant toutes ses unités, sans descendre sous l'échelle minimale.
lbl.FormationEditor/MinimizeScaleFloor = Échelle minimale
unit.FormationEditor/MinimizeScaleFloor = nm
help.FormationEditor/MinimizeScaleFloor = Minimiser l'échelle d'une nouvelle formation : la plus petite échelle possible.
lbl.Camera/BinocularsBelowHorizon = Jumelles du navire sous l'horizon
unit.Camera/BinocularsBelowHorizon = degrés · 0 = jeu
help.Camera/BinocularsBelowHorizon = Jumelles du navire (la vue optique d'un bâtiment) : jusqu'où on peut les abaisser sous l'horizon, en degrés. Le jeu les arrête à l'horizon. 0 = comme dans le jeu.
lbl.Camera/BinocularsNormalView = Vue normale aux jumelles au zoom maximal
lbl.Camera/BinocularsNormalViewDayOnly = Vue normale seulement de jour
help.Camera/BinocularsNormalView = Les jumelles au grossissement maximal démarrent avec la vue normale (le jeu les démarre avec son filtre nuit / thermique activé). La touche de filtre du jeu active le filtre.
help.Camera/BinocularsNormalViewDayOnly = La vue normale est celle par défaut seulement de jour ; la nuit, le filtre par défaut du jeu reste.
ref.propulsion = Propulsion
ref.pp.nuclear = Nucléaire
ref.pp.steam = Vapeur
ref.pp.gasturbine = Turbine à gaz
ref.pp.diesel = Diesel
ref.pp.electric = Électrique
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = Propulsion dans les données du navire
help.UnitReference/ShowPropulsion = Unit Reference : une cellule Propulsion dans les paramètres principaux des navires et sous-marins, après Max Speed : type et puissance des moteurs (installation principale et auxiliaire). S'applique à la prochaine unité affichée.
ref.propulsion.tip = Propulsion : type et puissance des moteurs (installation principale et auxiliaire)
lbl.UnitStatus/DamageListsWheel = La molette fait défiler les listes de sections
help.UnitStatus/DamageListsWheel = Fenêtre Unit Status, onglet Damage Control : les listes de dégâts des sections (Aft ... Forward : inondation, incendies, systèmes endommagés) défilent à la molette. S'applique au prochain onglet affiché.
lbl.General/NoFrameLimit = Supprimer la limite d'images
unit.General/NoFrameLimit = curseur désactivé
help.General/NoFrameLimit = Aucune limite de fréquence d'images ; le curseur ci-dessus est désactivé. Avec la synchronisation verticale, l'écran limite toujours la fréquence (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Ajouter la V-Sync adaptative
unit.General/AddAdaptiveVSync = dans la liste V-Sync
help.General/AddAdaptiveVSync = Ajoute l'élément « Adaptive V-Sync » à la liste V-Sync des options vidéo : la synchronisation verticale est active tant que les images suivent l'écran et coupée sinon. Le jeu l'enregistre comme une V-Sync ordinaire, il fonctionne donc aussi sans ce mod.
grp.Performance = Performances
grp.Text by background = Texte selon le fond
lbl.General/TextDarkAbove = Texte sombre au-dessus de
lbl.General/TextLightBelow = Texte clair en dessous de
unit.General/TextDarkAbove = luminosité 0 - 1
unit.General/TextLightBelow = luminosité 0 - 1
help.General/TextDarkAbove = Fenêtres avec le contraste du texte activé et ruban de boussole de la fenêtre World View : luminosité de l'image derrière les textes (0 = noir, 1 = blanc) au-dessus de laquelle ils s'assombrissent. Plus bas = ils s'assombrissent sur des images plus sombres.
help.General/TextLightBelow = Luminosité de l'image derrière les textes en dessous de laquelle les textes sombres redeviennent clairs (fenêtres avec contraste du texte, ruban de boussole). Pas au-dessus de « Texte sombre au-dessus de » ; l'écart entre les deux évite le scintillement sur une image de cette luminosité.

