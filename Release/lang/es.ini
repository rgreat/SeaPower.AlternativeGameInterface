help.General/Language = Idioma de los textos del mod: un código de un idioma del juego (en, ru ...); vacío = el idioma propio del juego. Los textos están en los archivos lang/<código>.ini de la carpeta del mod: edítelos para traducir.

help.General/AllowDragOutside = Permite arrastrar cualquier ventana parcialmente fuera del área visible (bordes izquierdo, derecho e inferior).

help.General/MinVisiblePixels = Con AllowDragOutside: al menos esta cantidad de píxeles del ancho de la ventana permanece visible en el borde izquierdo/derecho. En el borde inferior la barra de título siempre permanece visible.

help.General/MaximizeOnDoubleClick = Doble clic en la barra de título de una ventana la maximiza a pantalla completa; otro doble clic la restaura (ventanas redimensionables). Una ventana cerrada maximizada se abre maximizada (',max' tras su diseño en [Layouts]).

help.General/RemoveSizeLimits = Sin límites de tamaño para las ventanas recordadas (WindowPatterns, incluida Unit Reference): ni tamaño mínimo ni máximo propios (hasta 100x60 px) y el cambio de tamaño por un borde no se detiene en los bordes de la pantalla (la parte superior queda en pantalla para poder alcanzar la barra de título). El cambio se aplica de inmediato a las ventanas en pantalla.

help.General/SnapWindows = Mientras se arrastra o redimensiona una ventana con el ratón, sus bordes se ajustan a los de las demás ventanas y de la pantalla cuando se acercan más que SnapDistance (los bordes visibles, sin la zona invisible de cambio de tamaño alrededor de la ventana).

help.General/SnapDistance = SnapWindows: a qué distancia debe llegar un borde para ajustarse, en píxeles (1 - 50).

help.General/BringToFrontOnClick = Al hacer clic en una ventana pasa por delante de las demás; una ventana recién abierta también va al frente. Solo se reordenan ventanas, y solo por debajo del nivel que les dio el juego (Panel.ZIndex), así que lo que muestra el propio juego (informes, mensajes) queda por encima. Un Tactical Display / World View maximizado queda debajo de todas las demás ventanas.

help.General/CascadeOffset = Varias ventanas de un mismo patrón abiertas a la vez (p. ej. Weapon Reference): la primera conserva el diseño guardado y solo se guardan sus cambios; cada una más se abre desplazada a la derecha y hacia abajo tantos píxeles como ventanas ya abiertas (se mantiene en pantalla como una ventana arrastrada). 0 = todas se abren en la posición guardada.

help.General/SettingsButton = Un botón de engranaje en la barra de título de cada ventana recordada (WindowPatterns) abre la ventana de ajustes de Alternative Game Interface.

help.Mission/UnitPanelMenu = Misión: un clic derecho en la bandera o el nombre de la unidad seleccionada en el panel de unidad inferior abre el mismo menú que un clic derecho en la unidad del mapa.
help.Mission/PauseAfterLoad = Misión: una partida guardada se pausa en cuanto se carga, como con la tecla de pausa. Si se muestra su briefing, la pausa llega tras pulsar su botón de reproducir.
help.Mission/HideBriefingOnLoad = Misión: el briefing de una partida guardada se cierra al instante, como si se pulsara reproducir; una misión iniciada desde el principio lo sigue mostrando. Con la opción de pausa activada, el juego se pausa después.


help.General/EncyclopediaSplit = Menú principal: «Enciclopedia» abre la ventana Unit Reference (no se carga ninguna misión); «Enciclopedia 3D» es la opción original del juego y carga la misión de la Enciclopedia.
lbl.General/FitNewsWindow = Ventana de noticias en todo el área libre
help.General/FitNewsWindow = Menú principal: la ventana de noticias ocupa el área libre a la derecha del menú, desde arriba hasta la barra de consejos, totalmente transparente con el contenido al 120 %. Se desactiva en cuanto, tras activarla, mueves, redimensionas o cambias el aspecto de la ventana; al activarla se olvidan tu posición, tamaño y aspecto.
grp.Game = Juego
lbl.General/ShowGameVersion = Marca de agua de versión
help.General/ShowGameVersion = El texto de versión del juego en pantalla: como decida el juego (rama beta o [Debug] ShowVersionWatermark), siempre visible o siempre oculto. Solo en memoria, los archivos del juego no cambian.
val.General/ShowGameVersion.Game = Como el juego
val.General/ShowGameVersion.Show = Visible
val.General/ShowGameVersion.Hide = Oculto
tab.World View = World View
grp.Camera offset = Desplazamiento de cámara
cam.conflict = El mod Camera Offset está cargado: el desplazamiento se ajusta en su propia ventana (F11); estos ajustes no se usan.
lbl.WorldView/CameraOffset = Desplazar la imagen
help.WorldView/CameraOffset = La imagen 3D del World View se desplaza para que el objeto seguido quede fuera del centro (como el mod Camera Offset; en gris si ese mod está cargado). Solo cámaras de seguimiento, no en prismáticos / periscopio. Actúa al momento, antes de Apply.
lbl.WorldView/CameraOffsetFollowX = Objeto seguido en pantalla
unit.WorldView/CameraOffsetFollowX = % de la vista
help.WorldView/CameraOffsetFollowX = Dónde está el objeto seguido en la pantalla, en % de la vista desde el centro (±25 %). Arrastre el punto en la mira, haga clic en ella o use las flechas.
help.General/FixSoundOnReload = Cargar una partida guardada desde una misión: los sonidos del juego que dependen de la distancia siguen actualizándose sin cámara y en cada fotograma aparece un cuadro de error. Estos errores se ocultan.
help.General/HideCustomMission = Menú principal: el archivo predeterminado del editor "_Custom Mission" no se muestra en la lista SCENARIOS.

help.General/Backgrounds = Imágenes de fondo del menú principal y de las pantallas de carga. Mods: si los mods traen las suyas (ui/backgrounds), solo se muestran esas. Mezcla: como el juego - una al azar entre las del juego y las de todos los mods. Juego: solo las del juego.
val.General/Backgrounds.Mods = Solo de mods
val.General/Backgrounds.Mixed = Mezcla
val.General/Backgrounds.Game = Solo del juego
help.Monitors/Enabled = Modo escritorio: los demás monitores funcionan como el principal; se pueden colocar ventanas en ellos (Monitor en el menú de la ventana). El mapa del segundo monitor y el monitor de World View del propio juego dejan de usarse. Se aplica desde el próximo inicio de misión.
help.General/RealPhotos = Imágenes propias de este mod (fotos reales, ui/backgrounds) entre los fondos del menú y de las pantallas de carga. Desactivado: no se muestran; si ningún otro mod aporta imágenes, se muestran las del juego, diga lo que diga Imágenes de fondo.
help.General/MenuBackground = Fondo del menú principal. Vídeo: el vídeo en bucle del propio juego. Presentación: las imágenes de fondo (véase Imágenes de fondo), que cambian pasado el tiempo indicado; entonces el vídeo no se carga, lo que ahorra recursos.
val.General/MenuBackground.Video = Vídeo del juego
val.General/MenuBackground.Slideshow = Presentación de imágenes
help.General/SlideshowSeconds = Presentación del menú principal: cuántos segundos se muestra cada imagen.

help.MissionEditor/RememberMissionFolder = Imágenes de fondo del menú principal y de las pantallas de carga: cuando los mods traen las suyas (ui/backgrounds), solo se muestran esas, sin mezclarlas con las del juego. Desactivado = como el juego: una al azar entre las del juego y las de todos los mods juntas.
help.General/RememberSaveFolder = Las ventanas Guardar partida y Cargar partida (menú de pausa, menú principal, campaña) se abren en la última carpeta usada. Las partidas de campaña y de misión recuerdan cada una su carpeta.
help.General/RememberSaveSort = Las ventanas Save game y Load game recuerdan el orden elegido al hacer clic en la cabecera Nombre o Fecha de modificación (ascendente o descendente): se aplica al abrir la ventana y en las carpetas a las que se entre después. Las partidas de campaña y de misión recuerdan su propio orden.
help.General/DoubleClickOpen = Un doble clic abre un archivo en la ventana de cargar partida y otras ventanas de apertura (como el botón Abrir) e inicia un escenario en la lista de escenarios del menú principal (como el botón Jugar). Las ventanas de guardado no cambian.
lbl.General/AutoOpenLoad = Abrir Cargar al entrar en Escenarios y Campaña
lbl.General/AutoLoadCloseOnCampaign = Cerrar Cargar al elegir una campaña
help.General/AutoOpenLoad = Menú principal: al entrar en Escenarios o Campaña se abre enseguida la ventana Cargar partida.
help.General/AutoLoadCloseOnCampaign = Pantalla de Campaña: la ventana Cargar partida abierta por «Abrir Cargar al entrar en Escenarios y Campaña» se cierra al hacer clic en una campaña (se abren las condiciones iniciales), porque las tapa. Una ventana que abrió usted mismo se queda.
lbl.General/MenuWindowsAside = Ventanas del menú junto a los botones
unit.General/MenuWindowsAside = Cargar etc., no sobre el menú
help.General/MenuWindowsAside = Pantallas del menú principal (Escenarios, Campaña ...): una ventana (Cargar partida ...) se abre junto a los botones del menú, no encima.
lbl.General/FilePickerTall = Selector de archivos sin límite de altura
help.General/FilePickerTall = Las ventanas de selección de archivos (cargar / guardar partida, etc.) no tienen altura máxima (el juego la limita a 400).

help.General/ColorIniFiles = Selectores de archivos del editor de misiones: los nombres de archivos *.ini se muestran en azul claro.

help.Campaign/StrictLoadouts = Task Force Builder de la campaña: las versiones de buques y los loadouts se ofrecen solo para los buques que la misión indica como disponibles o que ya posee (el juego ofrece además todos los buques que comparten la etiqueta de la enciclopedia). Se guarda con la campaña; se elige al empezar una campaña nueva.

help.General/DeleteOldLogs = Al iniciar el juego se borran los archivos de registro de sesiones anteriores (carpeta Logs del juego: *_session_*, *_sessionEventLog_*); los de esta sesión se conservan.

help.General/Debug = Activa el registro detallado y BepInEx/AlternativeGameInterface.trace.txt.
help.Debug/TracePeriodic = Con la traza de depuración activada: también los diagnósticos que escriben continuamente (cada etiqueta del Tactical Display cada 2 s, la actualización de la formación por el líder, el ajuste de ventanas, el perfilador). Desactivado: solo eventos, un archivo pequeño. Actívalo para una prueba corta: el archivo crece varios megabytes.

help.General/WindowPatterns = Nombres de las ventanas a recordar, separados por comas. Sin distinguir mayúsculas; al comparar se ignoran los espacios ('Unit Status*' también coincide con 'UnitStatusView'); '*' sustituye cualquier texto (también ninguno). Un patrón se compara con el nombre de la ventana, el texto del encabezado, el tipo de contenido y el tipo de view-model, y debe coincidir con una de esas cadenas desde su comienzo ('Unit Reference*' coincide con 'Unit Reference - XYZ'; use '*texto*' para buscar en cualquier parte). Las ventanas que coinciden con el mismo patrón comparten un diseño guardado.

help.General/AddWindowKey = Apunte con el ratón a una ventana y pulse esta tecla para añadirla a WindowPatterns.

help.General/RememberOpenWindows = Patrones de ventanas separados por comas (mismas reglas que WindowPatterns) cuyo estado abierta / cerrada se recuerda: tras una pantalla de carga (inicio de misión, enciclopedia) esas ventanas se abren o cierran como se dejaron. El estado se guarda en [OpenWindows]. Solo se pueden abrir ventanas que el juego ya haya creado (p. ej. Unit Status necesita una unidad seleccionada).

help.WindowBorder/Enabled = Marco fino alrededor de cada ventana que se puede arrastrar, en el borde de su parte visible. Se dibuja sobre el aspecto propio de la ventana; no cambia su tamaño ni captura el ratón.

help.WindowBorder/Thickness = Grosor del marco en píxeles (0.5 - 10). El marco no tiene lado superior (pasaría bajo la barra de título).

help.WindowBorder/Color = Color del marco: #RRGGBB o #AARRGGBB (AA = opacidad, 00 transparente - FF sólido).

help.WindowBorder/ToolTips = Marco también alrededor de los tooltips (avisos emergentes) del juego, por los cuatro lados, con el grosor y el color de arriba.

help.UnitStatus/SectionsMinHeight = Ventana Unit Status, pestaña Damage Control: altura mínima de los paneles de sección (Aft ... Forward con sus listas de daños), en píxeles de pantalla. Una ventana más baja los reduce hasta este valor; por debajo la pestaña deja de encogerse y el panel 'Auto Damage Control Status' de abajo sale de la ventana. 0 = como en el juego (toda la pestaña tiene un mínimo fijo; los paneles reciben lo que dejan las demás filas, se muestra en la ventana de ajustes).

help.UnitStatus/UnitReferenceTab = Ventana Unit Status: una pestaña "Reference" (la última) con la Unit Reference de la unidad seleccionada (su buque / variante y loadout), sin el árbol de unidades ni el panel de búsqueda.


help.General/ImprovedUnitReferenceUI = Mejoras de la ventana Unit Reference: ocultar el árbol de unidades (botón '<' en el borde izquierdo) oculta también el panel de búsqueda / filtros, hace la ventana más estrecha en el ancho del árbol y la mueve a la derecha otro tanto, de modo que la información de la unidad se queda en su sitio y ocupa el espacio liberado arriba (mostrar el árbol lo revierte; los diseños guardados almacenan la ventana con el árbol visible); un árbol de unidades más ancho con un divisor en su borde derecho que se puede arrastrar con el ratón (ancho guardado en [UnitReference] TreeWidth); se recuerda el país elegido ([UnitReference] Country). Se aplica a las ventanas Unit Reference abiertas después.

help.UnitReference/ShowLoadoutList = Unit Reference: mostrar el selector de loadout también para buques, submarinos y unidades terrestres con varios loadouts (el juego lo muestra solo para aviones); la información de la unidad sigue al loadout elegido.

help.UnitReference/OptimizeTree = Árbol de Unit Reference: las clases de un tipo de unidad se ordenan por fecha de entrada en servicio; en un grupo de clase, cada unidad va seguida de sus variantes de loadout (por fecha, Early primero), rotuladas "Unidad [Variante]" (sin sufijo para Default o una única variante); una unidad sin loadout Default muestra solo sus variantes. Se aplica a las ventanas Unit Reference abiertas después.

help.UnitReference/ScrollToSelected = Árbol de Unit Reference: desplazar el árbol para que la unidad seleccionada sea visible (centrada cuando se abre la ventana o se muestra el árbol).
help.UnitReference/ReferenceTabs = Referencia de unidades: una barra de pestañas sobre la página de la unidad. Un doble clic en una unidad del árbol le añade una pestaña (la misma unidad no se añade dos veces). Una Referencia de unidades que el juego abriría en una ventana nueva se añade como pestaña de la ventana ya abierta. La cruz de una pestaña la cierra. Activado por defecto.

help.UnitReference/EarliestVariantOnClick = Árbol de Unit Reference: un clic en una clase (un nodo con varias variantes) selecciona su variante más antigua. El juego selecciona la que está en servicio en el año de la misión y, si no, la más reciente.

help.UnitReference/KeepOpenedUnit = Unit Reference: la unidad para la que se abrió la ventana permanece en el árbol, con su clase, aunque los filtros de país / fecha / búsqueda / Solo armadas la ocultarían.

help.UnitReference/TreeWheelOnlyOver = Árbol de Unit Reference: la rueda del ratón desplaza el árbol solo mientras el cursor está sobre él.

help.UnitReference/RememberSearchPanel = El panel de búsqueda de la ventana Unit Reference (categoría, 'filtrar por fecha', 'buscar solo por nombre' y el texto de búsqueda) se guarda en el .cfg (las claves de abajo) y se restablece al abrir una ventana Unit Reference (con ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference: la lista de países muestra solo los países que tienen unidades para el texto de búsqueda actual, 'Filtrar por fecha' y 'Solo armadas' (el país seleccionado se muestra siempre).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: con 'Buscar solo por nombre' desactivado, la búsqueda también encuentra unidades por su descripción y por su id de ini (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference: un tooltip con la ayuda breve (el comienzo de la descripción) del arma, sensor o sistema en los enlaces resaltados, cuando la tiene.


; --- new ---
tip.look = Opacidad y escala de las ventanas
menu.button = Interfaz del juego
tab.track = Track State
up.button = Mejorar barco...
up.title = Mejorar barco
up.sell = Vender
up.buy = Comprar
up.crew = Tripulación
up.min = nivel más bajo
up.do = Mejorar
up.cancel = Cancelar
up.saleDismiss = Baja por {0} pts
up.saleDecom = Retirado por {0} pts
up.aircraft = {0} aeronaves asignadas: hasta {1} pasan al nuevo barco (si el hangar lo permite), el resto vuelve al grupo de no asignadas.
up.price = Precio: {0} pts
up.priceSur = Precio: {0} pts (+{1} de recargo por escasez)
up.damaged = El barco está dañado: el coste de reparación ya está descontado del reembolso ({0} pts).
up.points2 = Puntos: {0} > {1}
up.fleet = Valor de la flota: {0} > {1} / {2}
up.tip = Sustituye un barco de la fuerza de tarea por el seleccionado: el barco anterior se vende al precio de Baja (Retirar cuando es lo único posible), se compra el nuevo y la tripulación pierde un nivel de habilidad (Alternative Game Interface).
up.noSel = Selecciona un barco en la lista.
up.noStatus = La fuerza de tarea no está disponible aquí.
up.hist = No disponible con refuerzos históricos.
up.pending = Primero confirma o quita las compras pendientes.
up.none = Ningún barco de la fuerza de tarea puede sustituirse por este.
up.points = puntos insuficientes
up.cap = supera el límite de valor de la flota
up.owned = esta versión ya está en su flota
up.item = vendido por {0} pts, tripulación {1} > {2}
up.itemDecom = retirado por {0} pts, tripulación {1} > {2}
look.opacity = Opacidad
look.scale = Escala
look.outline = Contraste del texto
look.level = Nivel
look.level.bottom = Abajo
look.level.default = Predeterminado
look.monitor = Monitor
look.level.top = Arriba
look.outline.tip = Los textos de una ventana transparente siguen siendo legibles: los grises pasan a blanco o negro puro con un halo, y sobre un fondo claro todos los textos se oscurecen (su luminosidad sigue al brillo de lo que muestra la pantalla bajo la ventana; el matiz se mantiene). Se activa solo con una opacidad inferior al 50%, se puede cambiar.
tab.Desktop mode = Escritorio
tab.Tactical Display = Visualización táctica
lbl.General/ResizeDockedWindows = Redimensionar ventanas acopladas
unit.General/ResizeDockedWindows = la zona entra en los bordes de la pantalla
help.General/ResizeDockedWindows = Una ventana acoplada a un borde de la pantalla (o a la barra inferior del HUD de la misión) tiene su zona invisible de redimensionado fuera de la pantalla y el ratón no puede agarrar ese borde. Activado: en ese borde la zona entra unos píxeles en la ventana.
lbl.General/FixGameResizeCursors = Corregir cursores de redimensionado del juego
unit.General/FixGameResizeCursors = menús y campaña
help.General/FixGameResizeCursors = Fuera de una misión el juego muestra la flecha normal en los bordes de redimensionado de sus ventanas (News, Task Force Builder): sus cursores no están cargados y no hay controlador de cursor. Activado: el mod lee los cursores del juego e instala el controlador que usan las misiones.
grp.Map = Mapa
grp.Map drawing = Dibujo del mapa
lbl.General/KeepMapView = Mantener la vista del mapa al redimensionar
unit.General/KeepMapView = el zoom sigue el tamaño de la ventana
help.General/KeepMapView = Cuando cambia el tamaño de la ventana Tactical Display, el zoom del mapa cambia con ella para que el área que se veía siga visible (el mapa conserva sus proporciones). Desactivado: el zoom se mantiene; una ventana mayor muestra más mapa y una menor, menos.
lbl.General/MapFineZoomShift = Zoom fino con Mayús
unit.General/MapFineZoomShift = pasos de rueda 5 veces menores
help.General/MapFineZoomShift = Mapa: con Mayús pulsada, la rueda del ratón hace zoom en el mapa con pasos 5 veces menores que sin ella.
grp.Desktop mode = Modo escritorio
lbl.General/WindowedMapAndWorldView = Activar modo escritorio
unit.General/WindowedMapAndWorldView = mover y redimensionar libremente
help.General/WindowedMapAndWorldView = Modo escritorio. Tactical Display y World View funcionan solo como ventanas normales que se pueden mover y redimensionar libremente (como las demás): no se recuerdan como maximizadas (sin ',max' en [Layouts]), ambas se muestran siempre (el juego pasa una vez al estado mapa a pantalla completa + World View), quedan debajo de todas las demás ventanas y solo intercambian su sitio entre ellas. La tecla Toggle fullscreen minimap (Tab por defecto) ya no alterna el mapa (cambia entre los escritorios, DesktopCount), los botones de maximizar / restaurar actúan solo sobre la ventana y el mod borra la pantalla detrás de las ventanas (el juego no la dibuja en este estado).
lbl.General/DesktopCount = Número de escritorios
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Modo escritorio: el número de escritorios (2 - 5). La tecla Toggle fullscreen minimap del juego (Controles - General, Tab por defecto) cambia entre ellos: cada escritorio conserva posición y tamaño, abierta / cerrada, opacidad, escala y nivel de las ventanas, y si World View está abierta. Los escritorios empiezan con las disposiciones integradas del mod (1: World View (3D) encima, 2: Tactical Display (mapa) encima, 3: el mapa en toda la pantalla, 4: la vista 3D en toda la pantalla, 5: mapa y vista 3D lado a lado).
lbl.General/WorldViewKey = Tecla de World View activar / desactivar
unit.General/WorldViewKey = Insert por defecto
help.General/WorldViewKey = Modo escritorio: la tecla que abre y cierra la ventana World View. Nunca se toma una tecla que el juego ya usa (Controles - sus asignaciones, también las que cambiaste): se ignora y el registro lo indica. Ninguna = sin tecla. No hace nada mientras la consola, un menú o un cuadro de texto tienen el teclado, ni con Mayús / Ctrl / Alt pulsadas.
lbl.InMission/DragTimePanel = Panel de tiempo arrastrable
unit.InMission/DragTimePanel = doble clic: vuelve a la esquina
help.InMission/DragTimePanel = El panel de tiempo del HUD de la misión (fecha / hora, velocidad, reproducir / pausa) se puede arrastrar con el ratón por su marco, el texto de velocidad o los huecos entre sus botones; con doble clic vuelve a la esquina.
grp.Task Force = Fuerza de tarea
lbl.Campaign/DismissDamaged = Dar de baja barcos dañados
unit.Campaign/DismissDamaged = reembolso menos reparación
help.Campaign/DismissDamaged = Estado de la fuerza de tarea de campaña: un barco dañado que se puede reparar puede darse de baja; el reembolso se reduce en el coste de reparación.
lbl.Campaign/SortLoadoutsByDate = Ordenar equipamientos por fecha
unit.Campaign/SortLoadoutsByDate = primero las versiones propias
help.Campaign/SortLoadoutsByDate = Fuerza de tarea de campaña, pestaña Equipamientos: los equipamientos propios del barco se ordenan por fecha y se muestran antes que las versiones más nuevas de la clase (el juego las muestra al final).
lbl.Campaign/FixVersionSwapPrice = Corregir precio al cambiar de versión
unit.Campaign/FixVersionSwapPrice = precio de la lista
help.Campaign/FixVersionSwapPrice = Fuerza de tarea de campaña, pestaña Equipamientos: el cambio de casco a otra versión de la clase se valora con la lista de la campaña como una compra (el juego usa el precio del ini de la unidad para el casco nuevo y el de la lista para el barco que tienes: un precio distinto en la lista convertía una mejora en un reembolso).
lbl.Campaign/UpgradeShip = Botón Mejorar barco en el Builder
unit.Campaign/UpgradeShip = tripulación -1 nivel
help.Campaign/UpgradeShip = Task Force Builder de campaña: un botón «Mejorar barco» sustituye un barco de la fuerza de tarea por el seleccionado (se vende al precio de Baja / Retirada, la tripulación pierde un nivel de habilidad).
lbl.Campaign/FixReserveSubmarines = Corregir submarinos en servicio
help.Campaign/FixReserveSubmarines = Corrige un error del juego con un submarino enviado a rearmar o reparar. No se pierde de la Reserva al cambiar la plantilla, aparece en la pestaña Submarinos durante el servicio como los barcos en Reserva, y un submarino ya perdido vuelve a la Reserva al cargar el mapa de campaña.
lbl.Campaign/EventShipState = Estado de los barcos en briefings y periódicos
unit.Campaign/EventShipState = tras la última misión
help.Campaign/EventShipState = Mapa de campaña: con un evento de briefing o periódico seleccionado, la Task Force muestra los barcos como quedaron tras la última misión (el juego muestra el estado previo a la primera misión: munición completa, daños reparados).
grp.Game UI = Interfaz del juego
grp.Diagnostics = Diagnóstico
grp.Mods = Mods
lbl.Debug/DumpXaml = Volcar XAML ahora
help.Debug/DumpXaml = Para desarrollo: al activarlo escribe el XAML de los recursos de interfaz del juego cargados hasta ahora en BepInEx/AlternativeGameInterface_xaml y se desactiva solo (abre antes las ventanas que necesites).
lbl.Debug/Snapshot = Tomar una instantánea ahora
help.Debug/Snapshot = Añade el estado del juego (tiempo de fotograma, memoria, objetos por tipo, errores del registro, colecciones del mod) a BepInEx/AlternativeGameInterface_snapshots.txt y se desactiva solo. Toma una antes de guardar y otra después de cargar, o al principio y al final de una sesión larga: cada cifra muestra su cambio desde la instantánea anterior.
lbl.Debug/ScreenshotTabs = Capturar ahora todas las pestañas de todos los mods
help.Debug/ScreenshotTabs = Para diagnóstico: al activarlo hace una captura de toda la ventana de opciones de cada pestaña (y cada página) de esta ventana de ajustes, luego lo mismo con las ventanas de los demás mods rgreat instalados, y guarda archivos PNG en BepInEx/<Mod>_screens; después se desactiva solo. La ventana debe estar abierta.
lbl.Debug/CollectGarbage = Liberar memoria ahora
help.Debug/CollectGarbage = Ejecuta una vez una recolección de basura completa y descarga los recursos sin usar; la memoria antes y después se escribe en el registro de BepInEx.
lbl.General/ModCreateFill = Rellenar Create Mod
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Ventana Create Mod (menú Mods): con Update Existing, al elegir un elemento del Workshop se rellenan Pick Folder (carpeta del mod en StreamingAssets) y Pick Image (thumbnail.jpg de esa carpeta).
grp.Track State = Track State
lbl.UnitStatus/TrackState = Track State del contacto seleccionado
help.UnitStatus/TrackState = Ventana Unit Status: mientras hay seleccionado un contacto de otro bando (una pista, no una unidad propia), la ventana muestra su Track State (la ventana de información del contacto: estado, confianza, detecciones, firmas) en lugar de quedar vacía.
lbl.UnitStatus/TrackLayout = Diseño recompuesto de Track State
help.UnitStatus/TrackLayout = Track State: la ventana se recompone - datos compactos, los detectores en un área con desplazamiento de altura limitada y el resto para la tabla de candidatos. Desactivado: el diseño de la ventana de información del juego.
lbl.Map/ClipContactEllipse = Recortar elipses de contactos
unit.Map/ClipContactEllipse = detrás del sensor
help.Map/ClipContactEllipse = Mapa: la estimación de la posición de un contacto obtenida con demoras se comprime a lo largo de la demora para que su elipse de error no llegue detrás del sensor (lado opuesto de la demora). El icono, la distancia de la etiqueta y la elipse siguen la nueva estimación. Los datos del rastreador no cambian.
lbl.Map/CompactSonobuoys = Sonoboyas compactas
unit.Map/CompactSonobuoys = mitad de tamaño, sin texto
help.Map/CompactSonobuoys = Mapa: con muchas sonoboyas visibles a la vez en el mapa, sus iconos se reducen a la mitad y se quita su texto. Al acercar el zoom y quedar menos, se muestran como siempre.
lbl.Map/SonobuoysThreshold = Umbral de sonoboyas
unit.Map/SonobuoysThreshold = visibles a la vez
help.Map/SonobuoysThreshold = Sonoboyas compactas: cuántas sonoboyas visibles a la vez en el mapa activan la vista compacta. Se desactiva cuando la cantidad baja del 90 % de este valor.
lbl.Map/GroupSpreadMiles = Límite de dispersión: buques, tierra
unit.Map/GroupSpreadMiles = mn del líder
help.Map/GroupSpreadMiles = Mapa: una unidad del grupo (buques, unidades terrestres) a más de estas millas náuticas del líder es independiente: tiene su propia etiqueta y no entra en el recuadro alrededor del cual se pone el nombre del grupo.
lbl.Map/GroupSpreadMilesAir = Límite de dispersión: aeronaves
unit.Map/GroupSpreadMilesAir = mn del líder
help.Map/GroupSpreadMilesAir = Mapa: igual para aviones y helicópteros: una unidad del grupo que vuela a más de estas millas náuticas del líder es independiente.
lbl.Map/FormationLines = Líneas del grupo
unit.Map/FormationLines = líder a unidades, al seleccionar
help.Map/FormationLines = Mapa: al seleccionar una unidad de un grupo, se trazan líneas del líder a todas las unidades del grupo.
lbl.Map/AirGroupInfo = Grupo de aeronaves: distancia y altitud
unit.Map/AirGroupInfo = bajo el nombre
help.Map/AirGroupInfo = Mapa: la etiqueta de un grupo no seleccionado de aviones o helicópteros muestra, bajo el nombre del grupo, la distancia y la altitud de su líder (se aplican las reglas habituales de etiquetas).
lbl.Map/FormationUpdateByLeader = Actualización del grupo por el líder
unit.Map/FormationUpdateByLeader = las aeronaves se mueven juntas
help.Map/FormationUpdateByLeader = Mapa: los aviones y helicópteros de un grupo toman sus nuevas posiciones en el mapa a la vez, cuando el líder toma la suya (el juego lo hace en momentos aleatorios, una unidad cada vez). Las demás posiciones van hasta un segundo por detrás.
lbl.Map/DrawingImprovements = Dibujo mejorado de objetos y etiquetas
unit.Map/DrawingImprovements = interruptor general
help.Map/DrawingImprovements = Mapa: interruptor general del dibujo mejorado de objetos y etiquetas (sonoboyas compactas, colocación y filtros de etiquetas, líneas de grupo, elipses de contacto recortadas). Desactivado: el juego dibuja como siempre y las opciones de abajo se ocultan.
lbl.Map/FriendlyBadgeInLabel = Distintivo FRND en la etiqueta
unit.Map/FriendlyBadgeInLabel = línea aparte
help.Map/FriendlyBadgeInLabel = Mapa: el distintivo «FRND» de una unidad amiga de otro bando se pone en una línea aparte encima de la primera línea de su etiqueta, no junto al icono.
lbl.Map/LabelPlacement = Posición de etiquetas
help.Map/LabelPlacement = Mapa: dónde se coloca la etiqueta de una unidad respecto a su icono, centrada en ese lado (puede desplazarse si hay aglomeración). Juego = colocación original.
val.Map/LabelPlacement.Game = Como en el juego
val.Map/LabelPlacement.Bottom = Centrada abajo
val.Map/LabelPlacement.Top = Centrada arriba
val.Map/LabelPlacement.Right = Centrada a la derecha
val.Map/LabelPlacement.Left = Centrada a la izquierda
lbl.Map/GroupNameOnly = Solo nombre del grupo
unit.Map/GroupNameOnly = hasta seleccionarlo
help.Map/GroupNameOnly = Mapa: las unidades de un grupo muestran solo el nombre del grupo hasta que se selecciona. Sus propias etiquetas se añaden al final, solo donde hay espacio (no para aviones ni helicópteros).
lbl.Map/LabelOverlapFilter = Filtrar etiquetas superpuestas
unit.Map/LabelOverlapFilter = queda la unidad mayor
help.Map/LabelOverlapFilter = Mapa: cuando se superponen las etiquetas de buques o aeronaves (y nombres de grupos), solo queda la de la unidad o grupo más grande. Una unidad de tipo desconocido no desplaza a una conocida; con igual tamaño queda la primera. Si una etiqueta no cabe, primero se recortan sus líneas (desde la última); solo se quita si incluso la primera línea se superpone.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = Progreso de identificación
unit.UnitStatus/TrackIdentProgress = aproximado, decenas de %
help.UnitStatus/TrackIdentProgress = Track State: progreso aproximado de la identificación del contacto, en decenas de porcentaje (tiempo de observación de sus emisores por su ESM frente al tiempo que el juego necesita para identificarlos). 100 % cuando el contacto está identificado. Solo en el diseño recompuesto y solo mientras algún ESM suyo observa el contacto. Si el ESM ya hizo su parte pero la clase sigue desconocida, la fila dice "datos insuficientes"; se oculta cuando el contacto está identificado.
track.identProgress = Progreso de identificación
track.identNoData = datos insuficientes

; --- new ---
tab.Event Log = Registro de eventos
grp.Links = Enlaces
lbl.EventLog/AllTracksAreLinks = Todos los contactos del registro son enlaces
unit.EventLog/AllTracksAreLinks = números de pista
help.EventLog/AllTracksAreLinks = Cada número de pista del registro de eventos es un enlace, como los que crea el propio juego (Nuevo contacto, Pista clasificada, Pista desvanecida y similares son texto plano en el juego): un clic selecciona el objeto; con CenterMapOnClick, un clic repetido centra el mapa en él. Solo se enlazan las pistas de la lista propia del jugador.
lbl.EventLog/CenterMapOnClick = Centrar mapa al repetir clic
unit.EventLog/CenterMapOnClick = Visualización táctica
help.EventLog/CenterMapOnClick = Un nuevo clic en el mismo enlace de contacto o unidad del registro de eventos centra el mapa de Tactical Display en él (el primer clic solo lo selecciona, como en el juego).
grp.Layout = Diseño
lbl.EventLog/Compact = Diseño compacto
unit.EventLog/Compact = menos espacio
help.EventLog/Compact = Registro de eventos: márgenes, cabeceras de pestañas y espacio entre filas más pequeños, para que quepan más filas. El tamaño del texto no cambia.
lbl.EventLog/WrapLines = Ajustar las líneas largas
unit.EventLog/WrapLines = al ancho de la ventana
help.EventLog/WrapLines = Ventana del registro de eventos: una línea larga de la pestaña del registro se ajusta al ancho de la ventana (el juego la corta en el borde de la ventana).
tab.Formation Manager = Formation Manager
tab.Formation Editor = Editor de formaciones
grp.Clicks = Clics
grp.Range rings = Anillos de alcance
lbl.FormationManager/ClickGoesToUnit = Un clic va a la unidad
help.FormationManager/ClickGoesToUnit = Formation Manager: un clic en una unidad o formación la selecciona y lleva la cámara a ella, como el doble clic. El doble clic funciona como antes. Desactivado por defecto.
lbl.FormationManager/DoubleClickCentersMap = El doble clic centra el mapa
unit.FormationManager/DoubleClickCentersMap = Visualización táctica
help.FormationManager/DoubleClickCentersMap = Formation Manager: un doble clic en una unidad centra además el mapa del Tactical Display en ella (el juego lo hace con la unidad seleccionada mediante la tecla C). En la fila de una formación el doble clic solo abre o cierra la rama. La cámara va a la unidad como siempre. Desactivado por defecto.
lbl.FormationEditor/ScaleStep = Paso del control de escala
unit.FormationEditor/ScaleStep = nm
help.FormationEditor/ScaleStep = Editor de formaciones (en misión y en la preparación de misión de la campaña): paso del control deslizante de escala (anillos de alcance). El del juego es 0,05 nm. Con un paso mayor que 0,05 el valor mínimo del control es el propio paso.
lbl.FormationEditor/ScaleButtons = Botones de escala 1 - 5 nm
help.FormationEditor/ScaleButtons = Editor de formaciones: bajo el control de escala una fila de botones 1, 2, 3, 4, 5 nm; cada uno fija la escala al instante.
lbl.FormationEditor/RememberScale = Recordar la escala de cada formación
help.FormationEditor/RememberScale = Editor de formaciones en misión: la escala de cada formación se recuerda (el juego la olvida al cerrar el editor) y se guarda en la partida guardada.
lbl.FormationEditor/MinimizeScale = Minimizar la escala de una formación nueva
help.FormationEditor/MinimizeScale = Editor de formaciones en misión: una formación sin escala recordada se abre con la escala más pequeña en la que caben todas sus unidades, pero no menor que la escala mínima.
lbl.FormationEditor/MinimizeScaleFloor = Escala mínima
unit.FormationEditor/MinimizeScaleFloor = nm
help.FormationEditor/MinimizeScaleFloor = Minimizar la escala de una formación nueva: la escala más pequeña que puede elegir.
lbl.Camera/BinocularsBelowHorizon = Prismáticos del barco bajo el horizonte
unit.Camera/BinocularsBelowHorizon = grados · 0 = juego
help.Camera/BinocularsBelowHorizon = Prismáticos del barco (la vista óptica de una nave): hasta dónde se pueden bajar bajo el horizonte, en grados. El juego los detiene en el horizonte. 0 = como en el juego.
lbl.Camera/BinocularsNormalView = Vista normal en prismáticos con zoom máximo
lbl.Camera/BinocularsNormalViewDayOnly = Vista normal solo de día
help.Camera/BinocularsNormalView = Los prismáticos con el aumento máximo empiezan con la vista normal (el juego los inicia con el filtro nocturno / térmico activado). La tecla de filtro del juego activa el filtro.
help.Camera/BinocularsNormalViewDayOnly = La vista normal es la predeterminada solo de día; de noche se mantiene el filtro predeterminado del juego.
ref.propulsion = Propulsión
ref.pp.nuclear = Nuclear
ref.pp.steam = Vapor
ref.pp.gasturbine = Turbina de gas
ref.pp.diesel = Diésel
ref.pp.electric = Eléctrica
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = Propulsión en los datos del barco
help.UnitReference/ShowPropulsion = Unit Reference: una celda Propulsión en los parámetros principales de barcos y submarinos, tras Max Speed: tipo y potencia de los motores (planta principal y auxiliar). Se aplica a la siguiente unidad mostrada.
ref.propulsion.tip = Propulsión: tipo y potencia de los motores (planta principal y auxiliar)
lbl.UnitStatus/DamageListsWheel = La rueda desplaza las listas de secciones
help.UnitStatus/DamageListsWheel = Ventana Unit Status, pestaña Damage Control: las listas de daños de las secciones (Aft ... Forward: inundación, incendios, sistemas dañados) se desplazan con la rueda del ratón. Se aplica a la siguiente pestaña mostrada.
lbl.General/NoFrameLimit = Quitar límite de FPS
unit.General/NoFrameLimit = control desactivado
help.General/NoFrameLimit = Sin límite de tasa de fotogramas; el control de arriba queda desactivado. Con la sincronización vertical activada, la pantalla sigue limitándola (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Añadir V-Sync adaptativa
unit.General/AddAdaptiveVSync = en la lista de V-Sync
help.General/AddAdaptiveVSync = Añade el elemento «Adaptive V-Sync» a la lista de V-Sync de las opciones de vídeo: la sincronización vertical está activa mientras los fotogramas siguen el ritmo de la pantalla y se apaga cuando no. El juego lo guarda como V-Sync normal, así que funciona también sin este mod.
grp.Performance = Rendimiento
grp.Text by background = Texto según el fondo
lbl.General/TextDarkAbove = Texto oscuro desde
lbl.General/TextLightBelow = Texto claro bajo
unit.General/TextDarkAbove = brillo 0 - 1
unit.General/TextLightBelow = brillo 0 - 1
help.General/TextDarkAbove = Ventanas con el contraste de texto activado y la cinta de la brújula de la ventana World View: brillo de la imagen tras los textos (0 = negro, 1 = blanco) a partir del cual se oscurecen. Menos = se oscurecen sobre imágenes más oscuras.
help.General/TextLightBelow = Brillo de la imagen tras los textos por debajo del cual los textos oscuros vuelven a ser claros (ventanas con contraste de texto, cinta de la brújula). No mayor que «Texto oscuro desde»; la diferencia entre ambos evita el parpadeo en una imagen de ese brillo.

; pages of the Windows and Game Menus tabs
pg.General = General
pg.Moving and snapping = Mover y ajustar
pg.Order and look = Orden y aspecto
pg.Menus = Menús
pg.Save and load = Guardar y cargar
pg.Backgrounds = Fondos
lang.default = Predeterminado
lang.caption = Idioma
