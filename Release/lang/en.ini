help.General/Language = Language of the mod's texts: a code of a game language (en, ru ...); empty = the game's own language. The texts are in the files lang/<code>.ini in the mod folder - edit them to translate.

help.General/AllowDragOutside = Allow dragging any window partly outside the visible area (left, right and bottom edge).

help.General/MinVisiblePixels = With AllowDragOutside: at least this many pixels of the window's width stay visible at the left/right edge. At the bottom edge the window's title bar always stays visible.

help.General/MaximizeOnDoubleClick = Double-click a window's title bar to maximize it to the full screen, double-click again to restore it (windows that can be resized). A window closed maximized opens maximized (',max' after its layout in [Layouts]).

help.General/RemoveSizeLimits = No size limits for the remembered windows (WindowPatterns, Unit Reference included): no minimum or maximum size of their own - down to 100x60 px - and resizing by an edge is not stopped by the screen's edges (the top stays on the screen, so the title bar can be reached). Switching it applies to the windows on screen at once.

help.General/SnapWindows = While a window is dragged or resized with the mouse, its edges snap to the edges of the other windows and of the screen when they come closer than SnapDistance (the visible edges, without the invisible resize zone around a window).

help.General/SnapDistance = SnapWindows: how close an edge must come to snap, in pixels (1 - 50).

help.General/BringToFrontOnClick = Clicking a window brings it in front of the other windows; a newly opened window comes in front too. Only windows are reordered, and only below the level the game gave them (Panel.ZIndex), so anything the game shows itself - briefings, messages - stays above them. A maximized Tactical Display / World View stays below every other window.

help.General/CascadeOffset = Several windows of one pattern open at once (e.g. Weapon Reference): the first keeps the saved layout and only its changes are saved; each further one opens shifted right and down by this many pixels per window already open (kept on screen like a dragged window). 0 = all open at the saved position.

help.General/SettingsButton = A gear button in the title bar of every remembered window (WindowPatterns) opens the Alternative Game Interface settings window.

help.Mission/UnitPanelMenu = Mission: a right click on the flag or the name of the selected unit in the unit panel at the bottom opens the same menu as a right click on the unit on the map.


help.General/EncyclopediaSplit = Main menu: ENCYCLOPEDIA opens the Unit Reference window (no mission is loaded); ENCYCLOPEDIA 3D is the game's own item (loads the Encyclopedia mission).
help.General/FixSoundOnReload = Loading a saved game from a mission: the game's distance-based sounds go on updating while the camera is gone, and every frame shows an error box. These errors are not shown.
help.General/HideCustomMission = Main menu: the editor's default file "_Custom Mission" is not shown in the SCENARIOS list.

help.General/Backgrounds = Background pictures of the main menu and the loading screens. Mods: when mods bring their own (ui/backgrounds), only theirs are shown. Mixed: as the game - one picked at random from the game's and every mod's together. Game: only the game's own.
val.General/Backgrounds.Mods = Mods only
val.General/Backgrounds.Mixed = Mixed
val.General/Backgrounds.Game = Game only
help.Monitors/Enabled = Desktop mode: the other monitors work like the main one - windows can be put on them (Monitor in the window's menu). The game's own second-monitor map and World View monitor are not used then. Applies from the next mission start.
help.General/RealPhotos = This mod's own pictures (real photos, ui/backgrounds) among the menu and loading-screen backgrounds. Off: they are not shown; when no other mod brings pictures, the game's own are shown whatever Background pictures says.
help.General/MenuBackground = Background of the main menu. Video: the game's own looped video. Slideshow: the background pictures (see Background pictures), changing after the set time; the video is not loaded then, which saves resources.
val.General/MenuBackground.Video = Game video
val.General/MenuBackground.Slideshow = Slideshow of pictures
help.General/SlideshowSeconds = Slideshow of the main menu: seconds a picture stays.

help.MissionEditor/RememberMissionFolder = Mission editor: the file picker for opening a mission starts in the folder of the mission opened last time.
help.General/RememberSaveFolder = Save game and Load game windows (pause menu, main menu, campaign) open in the folder used last time. Campaign saves and mission saves keep their own folders.
help.General/DoubleClickOpen = A double click opens a file in the Load game and other file-opening windows (like the Open button) and starts a scenario in the main menu's scenario list (like the Play button). Save windows are not changed.

help.General/ColorIniFiles = Mission editor file pickers: names of *.ini files are light blue.

help.Campaign/StrictLoadouts = Campaign Task Force Builder: ship versions and loadouts are offered only for ships the mission lists as available or that you already own (the game also offers every ship sharing the encyclopedia tag). Saved with the campaign; chosen at the start of a new campaign.

help.General/DeleteOldLogs = At the start of the game the log files of earlier sessions (the game's Logs folder: *_session_*, *_sessionEventLog_*) are deleted; this session's stay.

help.General/Debug = Enables verbose logging and BepInEx/AlternativeGameInterface.trace.txt.

help.General/WindowPatterns = Comma-separated names of the windows to remember. Case-insensitive, spaces are ignored when comparing ('Unit Status*' also matches 'UnitStatusView'), '*' matches any text (also nothing). A pattern is compared with the window's name, header text, content type and view-model type and must match one of those strings from its beginning ('Unit Reference*' matches 'Unit Reference - XYZ'; use '*text*' to match anywhere). Windows matching the same pattern share one saved layout.

help.General/AddWindowKey = Hover the mouse over a window and press this key to add that window to WindowPatterns.

help.General/RememberOpenWindows = Comma-separated window patterns (same rules as WindowPatterns) whose open / closed state is remembered: after a load screen (mission start, encyclopedia) these windows are opened or closed as they were left. The state is kept in [OpenWindows]. Only windows the game has already created can be opened (e.g. Unit Status needs a selected unit).

help.WindowBorder/Enabled = Thin frame around every window that can be dragged, on the edge of its visible part. Drawn over the window's own look; it does not change the window's size or catch the mouse.

help.WindowBorder/Thickness = Width of the frame in pixels (0.5 - 10). The frame has no top side (it would run under the title bar).

help.WindowBorder/Color = Colour of the frame: #RRGGBB or #AARRGGBB (AA = opacity, 00 transparent - FF solid).

help.WindowBorder/ToolTips = Frame around the game's tooltips (pop-up hints) too, on all four sides, with the width and colour above.

help.UnitStatus/SectionsMinHeight = Unit Status window, Damage Control tab: minimum height of the section panels (Aft ... Forward with their damage lists), in screen pixels. A shorter window shrinks them down to this; below it the tab stops shrinking and the 'Auto Damage Control Status' panel at the bottom moves out of the window. 0 = as in the game (the whole tab has a fixed minimum; the panels get what the other rows leave of it - shown in the settings window).

help.UnitStatus/UnitReferenceTab = Unit Status window: a "Reference" tab (last) with the Unit Reference of the selected unit - its ship / variant and loadout - without the unit tree and the search panel.


help.General/ImprovedUnitReferenceUI = Unit Reference window improvements: hiding the unit tree (the '<' button at the left edge) also hides the search / filter panel, makes the window narrower by the tree's width and moves it right by the same amount, so the unit information stays in place and takes the freed space at the top (showing the tree reverses it; saved layouts store the window with the tree shown); a wider unit tree with a splitter at its right edge that can be dragged with the mouse (width kept in [UnitReference] TreeWidth); the chosen country is remembered ([UnitReference] Country). Applies to Unit Reference windows opened afterwards.

help.UnitReference/ShowLoadoutList = Unit Reference: show the loadout selector for ships, submarines and land units with several loadouts too (the game shows it for aircraft only); the unit's information follows the chosen loadout.

help.UnitReference/OptimizeTree = Unit Reference tree: classes of a unit type sorted by service entry date; in a class group each unit is followed by its loadout variants (by date, Early first), labelled "Unit [Variant]" (no suffix for Default or a single variant); a unit without a Default loadout shows only its variants. Applies to Unit Reference windows opened afterwards.

help.UnitReference/ScrollToSelected = Unit Reference tree: scroll the tree so that the selected unit is visible (centred when the window opens or the tree is shown).

help.UnitReference/EarliestVariantOnClick = Unit Reference tree: a click on a class (a node with several variants) selects its earliest variant. The game selects the one in service in the mission year, otherwise the latest.

help.UnitReference/KeepOpenedUnit = Unit Reference: the unit the window was opened for stays in the tree, with its class, even when the country / date / search / Armed only filters would hide it.

help.UnitReference/TreeWheelOnlyOver = Unit Reference tree: the mouse wheel scrolls the tree only while the cursor is over it.

help.UnitReference/RememberSearchPanel = The Unit Reference window's search panel - category, 'filter by date', 'search by name only' and the search text - is kept in the .cfg (the keys below) and set again when a Unit Reference window opens (with ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference: the country list shows only the countries that have units for the current search text, 'Filter by date' and 'Armed only' (the selected country is always shown).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: with 'Search by name only' off the search also finds units by their description and by their ini id (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference: a tooltip with the short help (the start of the description) of the weapon, sensor or system on the highlighted links, when it has one.


