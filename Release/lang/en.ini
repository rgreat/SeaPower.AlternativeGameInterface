lbl.EventLog/AllTracksAreLinks = All contacts in the log are links
unit.EventLog/AllTracksAreLinks = track numbers
help.EventLog/AllTracksAreLinks = Every track number in the Event Log is a link, as the ones the game makes itself (New contact, Track classified, Track faded and the like are plain text in the game): a click selects the object, with CenterMapOnClick a repeated click centres the map on it. Only tracks of the player's own list are linked.
lbl.EventLog/CenterMapOnClick = Center map on repeated click
unit.EventLog/CenterMapOnClick = Tactical Display
help.EventLog/CenterMapOnClick = A repeated click on the same contact or unit link in the Event Log centres the Tactical Display map on it (the first click only selects it, as in the game).
lbl.Camera/BinocularsBelowHorizon = Ship binoculars below the horizon
unit.Camera/BinocularsBelowHorizon = degrees · 0 = game
help.Camera/BinocularsBelowHorizon = Ship binoculars (the optical view of a vessel): how far below the horizon they can be lowered, in degrees. The game stops them at the horizon. 0 = as in the game.
lbl.Camera/BinocularsNormalView = Normal view in binoculars at max zoom
lbl.Camera/BinocularsNormalViewDayOnly = Normal view only by day
help.Camera/BinocularsNormalView = Binoculars at the maximum magnification start with the normal view (the game starts them with its night / thermal filter on). The game's filter key switches the filter on.
help.Camera/BinocularsNormalViewDayOnly = The normal view is the default only by day; at night the game's own default filter stays.
ref.propulsion = Propulsion
ref.pp.nuclear = Nuclear
ref.pp.steam = Steam
ref.pp.gasturbine = Gas turbine
ref.pp.diesel = Diesel
ref.pp.electric = Electric
ref.pp.aip = AIP
ref.hp = hp
lbl.UnitReference/ShowPropulsion = Propulsion in ship data
help.UnitReference/ShowPropulsion = Unit Reference: a Propulsion cell in the main parameters of ships and submarines, after Max Speed: the type and power of the engines (main and auxiliary power plant). Applies to the next unit shown.
ref.propulsion.tip = Propulsion: type and power of the engines (main and auxiliary power plant)
lbl.UnitStatus/DamageListsWheel = Wheel scrolls the section lists
help.UnitStatus/DamageListsWheel = Unit Status window, Damage Control tab: the damage lists of the sections (Aft ... Forward: flooding, fires, damaged systems) scroll with the mouse wheel. Applies to the next tab shown.
lbl.General/NoFrameLimit = Remove frame rate limit
unit.General/NoFrameLimit = slider off
help.General/NoFrameLimit = No frame rate limit; the slider above is off. With vertical sync on, the screen still caps it (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Add Adaptive V-Sync
unit.General/AddAdaptiveVSync = in the V-Sync list
help.General/AddAdaptiveVSync = Adds the item "Adaptive V-Sync" to the V-Sync list of the video options: vertical sync is on while the frames keep up with the screen and off while they do not. The game saves it as ordinary vertical sync, so it works without this mod too.
