help.General/ResizeDockedWindows = A window docked to an edge of the screen (or to the mission HUD's bottom bar) has its invisible resize zone off the screen, and the mouse cannot take that edge. On: at such an edge the zone reaches a few pixels inside the window.
lbl.General/FixGameResizeCursors = Fix game resize cursors
unit.General/FixGameResizeCursors = menus and campaign
help.General/FixGameResizeCursors = Outside a mission the game shows the plain arrow on the resize edges of its windows (News, Task Force Builder): its cursors are not loaded and no cursor handler is installed. On: the mod reads the game's cursors and installs the handler the missions use.
grp.Map = Map
lbl.General/KeepMapView = Keep map view on resize
unit.General/KeepMapView = zoom follows the window size
help.General/KeepMapView = When the size of the Tactical Display window changes, the map zoom changes with it so that the area that was visible stays visible (the map keeps its proportions). Off: the zoom stays, a bigger window shows more of the map and a smaller one less.
grp.Desktop mode = Desktop mode
lbl.General/WindowedMapAndWorldView = Enable desktop mode
unit.General/WindowedMapAndWorldView = free move and size
help.General/WindowedMapAndWorldView = Desktop mode. Tactical Display and World View work only as ordinary windows that can be moved and sized freely (like the other windows): they are not remembered as maximized (no ',max' in [Layouts]), both are always shown (the game is put into its map fullscreen + World View state once), they stay below every other window and change places only between themselves. The Toggle fullscreen minimap key (Tab by default) no longer toggles the map (it switches between the desktops, DesktopCount), the maximize / restore buttons act on the window only, and the screen behind the windows is cleared by the mod (the game does not draw it in this state).
lbl.General/DesktopCount = Number of desktops
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Desktop mode: the number of desktops (2 - 5). The game's Toggle fullscreen minimap key (Controls - General, Tab by default) switches between them: each desktop keeps the position and size, open / closed, opacity, scale and level of the windows, and whether the World View is open. The desktops start as the mod's built-in arrangements (1: the World View (3D) on top, 2: the Tactical Display (map) on top, 3: the map on the whole screen, 4: the 3D view on the whole screen, 5: the map and the 3D view side by side).
lbl.General/WorldViewKey = World View on / off key
unit.General/WorldViewKey = Insert by default
help.General/WorldViewKey = Desktop mode: the key that opens and closes the World View window. A key the game already uses (Controls - its bindings, also the ones you changed) is never taken: it is ignored and the log says so. None = no key. It does nothing while the console, a menu or a text box has the keyboard, or while Shift / Ctrl / Alt is held.
lbl.InMission/DragTimePanel = Draggable time panel
unit.InMission/DragTimePanel = double-click: back to the corner
help.InMission/DragTimePanel = The time panel of the mission HUD (date / time, speed, play / pause) can be dragged with the mouse by its frame, the speed text or the gaps between its buttons; double-click it to put it back in the corner.
grp.Task Force = Task Force
lbl.Campaign/DismissDamaged = Dismiss damaged ships
unit.Campaign/DismissDamaged = refund minus repair
help.Campaign/DismissDamaged = Campaign Task Force status: a damaged ship that can be repaired may be dismissed; the refund is reduced by the repair cost.
lbl.Campaign/SortLoadoutsByDate = Sort loadouts by date
unit.Campaign/SortLoadoutsByDate = own versions first
help.Campaign/SortLoadoutsByDate = Campaign Task Force, Loadouts tab: the ship's own loadouts are sorted by date and shown before the newer versions of the class (the game shows them last).
lbl.Campaign/FixVersionSwapPrice = Fix version swap price
unit.Campaign/FixVersionSwapPrice = roster price
help.Campaign/FixVersionSwapPrice = Campaign Task Force, Loadouts tab: a hull swap to another version of the class is priced from the campaign's roster like buying it (the game uses the unit's ini price for the new hull, and the roster price for the ship you have: a different roster price turned an upgrade into a refund).
lbl.Campaign/UpgradeShip = Upgrade ship button in the Builder
unit.Campaign/UpgradeShip = crew -1 level
help.Campaign/UpgradeShip = Campaign Task Force Builder: an "Upgrade ship" button replaces a ship of the task force by the selected one (sold at the Dismiss / Decommission price, the crew loses one skill level).
grp.Game UI = Game UI
