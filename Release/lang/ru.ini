pg.General = Общие
pg.Moving and snapping = Перемещение и привязка
pg.Order and look = Порядок и вид
pg.Menus = Меню
pg.Save and load = Сохранение и загрузка
pg.Backgrounds = Фоны
lang.default = По умолчанию
lang.caption = Язык
lbl.General/MonitorFps = Счётчик кадров на каждом мониторе
help.General/MonitorFps = Счётчик кадров на каждом мониторе: кадры игры в секунду.
lbl.Debug/MonitorFpsInfo = Диагностика в счётчике кадров
help.Debug/MonitorFpsInfo = Дополнительные строки в счётчике кадров: монитор, частота его обновления и по какому монитору идёт V-Sync.
lbl.General/AdaptiveVSyncDisplay = Монитор для Adaptive V-Sync
help.General/AdaptiveVSyncDisplay = Adaptive V-Sync при нескольких активных дисплеях (Unity ждал бы каждый монитор): кадры синхронизируются с одним монитором, остальные получают их без вертикальной синхронизации. Авто = самый быстрый монитор (наибольшая частота обновления).
val.display.auto = Авто (самый быстрый)
val.display.missing = не подключён
unit.General/MonitorFps = FPS в маленьком окне
unit.Debug/MonitorFpsInfo = монитор, частота, V-Sync
