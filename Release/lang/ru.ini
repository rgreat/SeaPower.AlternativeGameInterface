help.General/Language = Язык текстов мода: код одного из языков игры (en, ru ...); пусто = язык самой игры. Тексты лежат в файлах lang/<код>.ini в папке мода — правьте их, чтобы изменить перевод.

help.General/AllowDragOutside = Разрешить перетаскивать любое окно частично за пределы видимой области (левый, правый и нижний край).

help.General/MinVisiblePixels = При включённом AllowDragOutside: не менее стольких пикселей ширины окна остаются видимыми у левого/правого края. У нижнего края заголовок окна всегда остаётся видимым.

help.General/MaximizeOnDoubleClick = Двойной щелчок по заголовку окна разворачивает его на весь экран, повторный — возвращает прежний вид (для окон с изменяемым размером). Окно, закрытое развёрнутым, откроется развёрнутым (',max' после его раскладки в [Layouts]).

help.General/RemoveSizeLimits = Нет ограничений размера для запоминаемых окон (WindowPatterns, включая Unit Reference): ни минимального, ни максимального размера (вплоть до 100x60 px), и изменение размера за край не останавливается краями экрана (верх остаётся на экране, так что до заголовка можно дотянуться). Переключение сразу действует на окна на экране.

help.General/SnapWindows = Когда окно перетаскивают или меняют его размер мышью, его края притягиваются к краям других окон и экрана, если ближе, чем SnapDistance (видимые края, без невидимой зоны изменения размера вокруг окна).

help.General/SnapDistance = SnapWindows: на каком расстоянии край притягивается, в пикселях (1 - 50).

help.General/BringToFrontOnClick = Щелчок по окну выводит его поверх других; только что открытое окно тоже выходит наверх. Меняется порядок только окон, и только ниже уровня, выданного им игрой (Panel.ZIndex), так что всё, что показывает сама игра (брифинги, сообщения), остаётся выше. Развёрнутые Tactical Display / World View остаются ниже всех остальных окон.

help.General/CascadeOffset = Несколько окон одного шаблона открыты одновременно (например, Weapon Reference): первое сохраняет запомненную раскладку, и сохраняются только его изменения; каждое следующее открывается со сдвигом вправо и вниз на столько пикселей, сколько окон уже открыто (остаётся на экране, как перетаскиваемое окно). 0 = все открываются в сохранённом положении.

help.General/SettingsButton = Кнопка-шестерёнка в заголовке каждого запоминаемого окна (WindowPatterns) открывает окно настроек Alternative Game Interface.

help.Mission/UnitPanelMenu = Миссия: щелчок правой кнопкой по флагу или названию выбранного юнита в нижней панели юнита открывает то же меню, что и щелчок правой кнопкой по юниту на карте.


help.General/EncyclopediaSplit = Главное меню: «Энциклопедия» открывает окно Unit Reference (миссия не загружается); «Энциклопедия 3D» — обычный пункт игры, он загружает миссию Энциклопедии.
lbl.General/FitNewsWindow = Окно новостей на всю свободную область
help.General/FitNewsWindow = Главное меню: окно новостей занимает свободную область справа от меню, от верха экрана до строки с подсказками, полностью прозрачное, содержимое 120 %. Выключается само, как только вы двигаете, растягиваете окно новостей или меняете его вид (и если уже делали это раньше); повторное включение сбрасывает ваше положение, размер и вид окна.
grp.Game = Игра
lbl.General/ShowGameVersion = Водяной знак версии игры
help.General/ShowGameVersion = Текст версии игры на экране: как решает игра (бета-ветка или [Debug] ShowVersionWatermark в её настройках), всегда показан или всегда скрыт. Задаётся только в памяти, файлы игры не меняются.
val.General/ShowGameVersion.Game = Как в игре
val.General/ShowGameVersion.Show = Показан
val.General/ShowGameVersion.Hide = Скрыт
tab.World View = 3Д мир
grp.Camera offset = Смещение камеры
cam.conflict = Загружен мод Camera Offset: смещение камеры настраивается в его окне (F11); эти настройки не используются.
lbl.WorldView/CameraOffset = Смещать изображение
help.WorldView/CameraOffset = 3D-изображение World View смещается так, что отслеживаемый объект стоит не в центре (как в моде Camera Offset; при загруженном моде настройки серые). Только камеры следования, не в бинокле / перископе. Действует сразу, до Apply.
lbl.WorldView/CameraOffsetFollowX = Объект на экране
unit.WorldView/CameraOffsetFollowX = % вида
help.WorldView/CameraOffsetFollowX = Где на экране находится отслеживаемый объект, в % вида от центра (±25 %). Тащите кружок по прицелу, щёлкните по прицелу или используйте стрелки.
help.General/FixSoundOnReload = Загрузка сохранения из миссии: звуки игры, зависящие от расстояния, продолжают обновляться, пока камеры нет, и каждый кадр появляется окно с ошибкой. Эти ошибки не показываются.
help.General/HideCustomMission = Главное меню: файл редактора по умолчанию "_Custom Mission" не показывается в списке SCENARIOS.

help.General/Backgrounds = Фоны главного меню и экранов загрузки. Моды: если моды приносят свои (ui/backgrounds), показываются только они. Вперемешку: как в игре - случайная из игровых и всех модов вместе. Игра: только игровые.
val.General/Backgrounds.Mods = Только из модов
val.General/Backgrounds.Mixed = Вперемешку
val.General/Backgrounds.Game = Только игровые
help.Monitors/Enabled = Режим desktop: остальные мониторы работают как основной - на них можно размещать окна (пункт Monitor в меню окна). Вторая карта и вынос World View на монитор из настроек игры при этом не используются. Действует после перезапуска миссии.
help.General/RealPhotos = Собственные картинки этого мода (реальные фото, ui/backgrounds) среди фонов меню и экранов загрузки. Выкл: не показываются; если другие моды не добавляют картинок, показываются фоны игры, что бы ни стояло в «Background pictures».
help.General/MenuBackground = Фон главного меню. Видео: родное зацикленное видео игры. Слайдшоу: фоновые картинки (см. «Фоновые картинки»), сменяются через заданное время; видео при этом не загружается — экономия ресурсов.
val.General/MenuBackground.Video = Видео игры
val.General/MenuBackground.Slideshow = Слайдшоу картинок
help.General/SlideshowSeconds = Слайдшоу главного меню: сколько секунд показывается одна картинка.

help.MissionEditor/RememberMissionFolder = Фоновые картинки главного меню и экранов загрузки: если моды приносят свои (ui/backgrounds), показываются только они, не вперемешку с игровыми. Выкл = как в игре: случайная картинка из игровых и всех модовых вместе.
help.General/RememberSaveFolder = Окна Save game и Load game (пауза, главное меню, кампания) открываются в папке, использованной в прошлый раз. Сохранения кампании и миссий помнят свои папки.
help.General/DoubleClickOpen = Двойной щелчок открывает файл в окнах Load game и других окнах открытия (как кнопка Open) и запускает сценарий в списке сценариев главного меню (как кнопка Play). Окна сохранения не меняются.
lbl.General/AutoOpenLoad = Открывать загрузку при входе в Сценарии и Кампанию
help.General/AutoOpenLoad = Главное меню: вход в Сценарии или Кампанию сразу открывает окно загрузки сохранения.
lbl.General/MenuWindowsAside = Окна меню рядом с кнопками
unit.General/MenuWindowsAside = загрузка и др., не поверх меню
help.General/MenuWindowsAside = Экраны главного меню (Сценарии, Кампания ...): окно (загрузка сохранения и др.) открывается рядом с кнопками меню, а не поверх них.
lbl.General/FilePickerTall = Окно выбора файла без ограничения высоты
help.General/FilePickerTall = У окон выбора файла (загрузка и сохранение игры и др.) нет максимальной высоты (игра ограничивает её 400).

help.General/ColorIniFiles = Редактор миссий, окна выбора файлов: имена файлов *.ini светло-голубые.

help.Campaign/StrictLoadouts = Task Force Builder кампании: версии кораблей и снаряжения предлагаются только для кораблей, которые миссия называет доступными или которые у вас уже есть (игра предлагает ещё и каждый корабль с тем же тегом энциклопедии). Сохраняется вместе с кампанией; выбирается при старте новой кампании.

help.General/DeleteOldLogs = При запуске игры файлы журналов прошлых сеансов (папка Logs игры: *_session_*, *_sessionEventLog_*) удаляются; журналы текущего сеанса остаются.

help.General/Debug = Включает подробное протоколирование и файл BepInEx/AlternativeGameInterface.trace.txt.
help.Debug/TracePeriodic = При включённой трассировке отладки: также диагностика, которая пишет постоянно (каждая подпись тактического дисплея раз в 2 с, обновление по лидеру, прилипание окон, профайлер). Выключено: только события, файл небольшой. Включайте на короткий тест: файл растёт на мегабайты.

help.General/WindowPatterns = Имена запоминаемых окон через запятую. Без учёта регистра, пробелы при сравнении игнорируются ('Unit Status*' подходит и к 'UnitStatusView'), '*' заменяет любой текст (и пустой). Шаблон сравнивается с именем окна, текстом заголовка, типом содержимого и типом view-model и должен совпасть с одной из этих строк с её начала ('Unit Reference*' подходит к 'Unit Reference - XYZ'; чтобы искать где угодно, используйте '*текст*'). Окна, подходящие под один шаблон, делят одну сохранённую раскладку.

help.General/AddWindowKey = Наведите курсор на окно и нажмите эту клавишу, чтобы добавить окно в WindowPatterns.

help.General/RememberOpenWindows = Шаблоны окон через запятую (правила те же, что у WindowPatterns), у которых запоминается состояние «открыто/закрыто»: после экрана загрузки (старт миссии, энциклопедия) эти окна открываются или закрываются так, как были оставлены. Состояние хранится в [OpenWindows]. Открыть можно только окна, которые игра уже создала (например, для Unit Status нужен выбранный юнит).

help.WindowBorder/Enabled = Тонкая рамка вокруг каждого окна, которое можно перетаскивать, по краю его видимой части. Рисуется поверх собственного вида окна; не меняет размер окна и не перехватывает мышь.

help.WindowBorder/Thickness = Толщина рамки в пикселях (0.5 - 10). У рамки нет верхней стороны (она шла бы под заголовком).

help.WindowBorder/Color = Цвет рамки: #RRGGBB или #AARRGGBB (AA = непрозрачность, 00 — прозрачный, FF — сплошной).

help.WindowBorder/ToolTips = Рамка и вокруг подсказок игры (всплывающих), со всех четырёх сторон, с толщиной и цветом, заданными выше.

help.UnitStatus/SectionsMinHeight = Окно Unit Status, вкладка Damage Control: минимальная высота панелей секций (Aft ... Forward с их списками повреждений) в пикселях экрана. Более низкое окно сжимает их до этой высоты; ниже вкладка перестаёт сжиматься, и панель 'Auto Damage Control Status' внизу уходит за пределы окна. 0 = как в игре (вся вкладка имеет фиксированный минимум; панели получают то, что оставляют другие строки, — показано в окне настроек).

help.UnitStatus/UnitReferenceTab = Окно Unit Status: вкладка "Reference" (последняя) со справочником выбранного юнита — его корабль / вариант и снаряжение — без дерева юнитов и панели поиска.


help.General/ImprovedUnitReferenceUI = Улучшения окна Unit Reference: скрытие дерева юнитов (кнопка '<' у левого края) скрывает и панель поиска / фильтров, делает окно уже на ширину дерева и сдвигает его вправо на столько же, так что информация о юните остаётся на месте и занимает освободившееся место сверху (показ дерева делает обратное; сохранённые раскладки хранят окно с показанным деревом); более широкое дерево юнитов с разделителем у правого края, который можно тянуть мышью (ширина хранится в [UnitReference] TreeWidth); выбранная страна запоминается ([UnitReference] Country). Действует на окна Unit Reference, открытые после изменения.

help.UnitReference/ShowLoadoutList = Unit Reference: показывать выбор снаряжения и для кораблей, подводных лодок и сухопутных юнитов с несколькими снаряжениями (игра показывает его только для авиации); информация о юните следует за выбранным снаряжением.

help.UnitReference/OptimizeTree = Дерево Unit Reference: классы юнитов одного типа отсортированы по дате поступления на службу; в группе класса за каждым юнитом идут его варианты снаряжения (по дате, Early первым) с подписью "Юнит [Вариант]" (без суффикса для Default или единственного варианта); юнит без снаряжения Default показывает только свои варианты. Действует на окна Unit Reference, открытые после изменения.

help.UnitReference/ScrollToSelected = Дерево Unit Reference: прокручивать дерево так, чтобы выбранный юнит был виден (по центру, когда окно открывается или дерево показано).

help.UnitReference/EarliestVariantOnClick = Дерево Unit Reference: щелчок по классу (узлу с несколькими вариантами) выбирает его самый ранний вариант. Игра выбирает вариант, находящийся на службе в год миссии, иначе самый поздний.

help.UnitReference/KeepOpenedUnit = Unit Reference: юнит, для которого открыто окно, остаётся в дереве вместе со своим классом, даже если фильтры страны / даты / поиска / «Только с оружием» его скрыли бы.

help.UnitReference/TreeWheelOnlyOver = Дерево Unit Reference: колесо мыши прокручивает дерево, только пока курсор над ним.

help.UnitReference/RememberSearchPanel = Панель поиска окна Unit Reference — категория, «фильтр по дате», «поиск только по имени» и текст поиска — хранится в .cfg (ключи ниже) и восстанавливается при открытии окна Unit Reference (с ImprovedUnitReferenceUI).

help.UnitReference/HideEmptyCountries = Unit Reference: список стран показывает только страны, у которых есть юниты для текущего текста поиска, «Фильтра по дате» и «Только с оружием» (выбранная страна показывается всегда).

help.UnitReference/SearchInDescriptionAndId = Unit Reference: при выключенном «Поиске только по имени» поиск находит юниты и по описанию, и по их ini-идентификатору (<Id>.ini).

help.UnitReference/LinkHelp = Unit Reference: подсказка с краткой справкой (началом описания) оружия, датчика или системы на выделенных ссылках, если она у них есть.


; --- new ---
tip.look = Прозрачность и масштаб окна
menu.button = Игровой интерфейс
tab.track = Track State
up.button = Улучшить корабль...
up.title = Улучшение корабля
up.sell = Продажа
up.buy = Покупка
up.crew = Экипаж
up.min = низший уровень
up.do = Улучшить
up.cancel = Отмена
up.saleDismiss = Увольнение за {0} очк.
up.saleDecom = Списание за {0} очк.
up.aircraft = Назначено самолётов: {0}; до {1} перейдут на новый корабль (если позволит ангар), остальные вернутся в неназначенные.
up.price = Цена: {0} очк.
up.priceSur = Цена: {0} очк. (+{1} надбавка за дефицит)
up.damaged = Корабль повреждён: стоимость ремонта уже вычтена из возмещения ({0} очк.).
up.points2 = Очки: {0} > {1}
up.fleet = Стоимость флота: {0} > {1} / {2}
up.tip = Заменить корабль соединения выбранным: старый продаётся по цене увольнения (списания, если возможно только оно), новый покупается, экипаж теряет один уровень навыка (Alternative Game Interface).
up.noSel = Выберите корабль в списке.
up.noStatus = Соединение здесь недоступно.
up.hist = Недоступно при исторических подкреплениях.
up.pending = Сначала подтвердите или уберите ожидающие покупки.
up.none = Ни один корабль соединения нельзя заменить этим.
up.points = не хватает очков
up.cap = превышен предел стоимости флота
up.owned = этот вариант уже есть в вашем флоте
up.item = продан за {0} очк., экипаж {1} > {2}
up.itemDecom = списан за {0} очк., экипаж {1} > {2}
look.opacity = Прозрачность
look.scale = Масштаб
look.outline = Контраст текста
look.level = Уровень
look.level.bottom = Снизу
look.level.default = По умолчанию
look.monitor = Монитор
look.level.top = Сверху
look.outline.tip = Тексты прозрачного окна остаются читаемыми: серые становятся чисто белыми или чёрными с ореолом, а на светлом фоне все тексты темнеют (яркость цвета следует за яркостью того, что экран показывает под окном; оттенок сохраняется). Включается сам, когда прозрачность ниже 50%, можно изменить.
tab.Desktop mode = Рабочий стол
tab.Tactical Display = Карта
lbl.General/ResizeDockedWindows = Изменение размера закреплённых окон
unit.General/ResizeDockedWindows = зона заходит внутрь у краёв экрана
help.General/ResizeDockedWindows = У окна, закреплённого у края экрана (или у нижней панели HUD миссии), невидимая зона изменения размера находится за экраном, и мышью этот край не взять. Вкл: у такого края зона заходит на несколько пикселей внутрь окна.
lbl.General/FixGameResizeCursors = Исправить курсоры размера игры
unit.General/FixGameResizeCursors = меню и кампания
help.General/FixGameResizeCursors = Вне миссии игра показывает обычную стрелку на краях изменения размера своих окон (News, Task Force Builder): её курсоры не загружены и обработчик курсора не установлен. Вкл: мод читает курсоры игры и ставит обработчик, который используют миссии.
grp.Map = Карта
grp.Map drawing = Рисование на карте
lbl.General/KeepMapView = Сохранять вид карты при изменении размера
unit.General/KeepMapView = масштаб следует размеру окна
help.General/KeepMapView = Когда размер окна Tactical Display меняется, масштаб карты меняется вместе с ним, чтобы видимая область оставалась видимой (пропорции карты сохраняются). Выкл: масштаб остаётся, большее окно показывает больше карты, меньшее — меньше.
lbl.General/MapFineZoomShift = Плавный зум с Shift
unit.General/MapFineZoomShift = шаг колеса в 5 раз меньше
help.General/MapFineZoomShift = Карта: при зажатом Shift колесо мыши масштабирует карту шагами в 5 раз меньше, чем без него.
grp.Desktop mode = Режим рабочих столов
lbl.General/WindowedMapAndWorldView = Включить режим рабочих столов
unit.General/WindowedMapAndWorldView = свободное перемещение и размер
help.General/WindowedMapAndWorldView = Режим рабочих столов. Tactical Display и World View работают только как обычные окна, которые можно свободно перемещать и менять в размере (как остальные): они не запоминаются развёрнутыми (нет ',max' в [Layouts]), оба всегда показаны (игра один раз переводится в состояние «карта на весь экран + World View»), они остаются под всеми другими окнами и меняются местами только между собой. Клавиша Toggle fullscreen minimap (по умолчанию Tab) больше не переключает карту (она переключает рабочие столы, DesktopCount), кнопки развернуть / восстановить действуют только на окно, а экран за окнами очищает мод (в этом состоянии игра его не рисует).
lbl.General/DesktopCount = Число рабочих столов
unit.General/DesktopCount = 2 - 5
help.General/DesktopCount = Режим рабочих столов: число столов (2 - 5). Клавиша игры Toggle fullscreen minimap (Управление - Общие, по умолчанию Tab) переключает их: каждый стол хранит положение и размер, открытость, прозрачность, масштаб и уровень окон, а также открыт ли World View. Столы начинаются со встроенных раскладок мода (1: World View (3D) сверху, 2: Tactical Display (карта) сверху, 3: карта на весь экран, 4: 3D-вид на весь экран, 5: карта и 3D-вид рядом).
lbl.General/WorldViewKey = Клавиша вкл / выкл World View
unit.General/WorldViewKey = по умолчанию Insert
help.General/WorldViewKey = Режим рабочих столов: клавиша, которая открывает и закрывает окно World View. Клавиша, уже используемая игрой (Управление - её назначения, в том числе изменённые вами), не берётся никогда: она игнорируется, а в журнале об этом сказано. Нет = без клавиши. Не действует, пока клавиатурой владеет консоль, меню или текстовое поле, и пока зажат Shift / Ctrl / Alt.
lbl.InMission/DragTimePanel = Перетаскиваемая панель времени
unit.InMission/DragTimePanel = двойной щелчок: вернуть в угол
help.InMission/DragTimePanel = Панель времени HUD миссии (дата / время, скорость, пуск / пауза) можно перетаскивать мышью за рамку, текст скорости или промежутки между кнопками; двойной щелчок возвращает её в угол.
grp.Task Force = Соединение
lbl.Campaign/DismissDamaged = Увольнять повреждённые корабли
unit.Campaign/DismissDamaged = возмещение минус ремонт
help.Campaign/DismissDamaged = Состояние соединения кампании: повреждённый корабль, который можно отремонтировать, разрешено уволить; возмещение уменьшается на стоимость ремонта.
lbl.Campaign/SortLoadoutsByDate = Сортировать вооружения по дате
unit.Campaign/SortLoadoutsByDate = сначала свои версии
help.Campaign/SortLoadoutsByDate = Соединение кампании, вкладка «Вооружение»: собственные вооружения корабля сортируются по дате и показываются перед более новыми версиями класса (игра показывает их последними).
lbl.Campaign/FixVersionSwapPrice = Исправить цену при смене версии
unit.Campaign/FixVersionSwapPrice = цена из списка
help.Campaign/FixVersionSwapPrice = Соединение кампании, вкладка «Вооружение»: смена корпуса на другую версию класса оценивается по списку кампании как покупка (игра берёт для нового корпуса цену из ini юнита, а для имеющегося корабля — цену из списка: разные цены превращали улучшение в возмещение).
lbl.Campaign/UpgradeShip = Кнопка «Улучшить корабль» в Builder
unit.Campaign/UpgradeShip = экипаж −1 уровень
help.Campaign/UpgradeShip = Task Force Builder кампании: кнопка «Улучшить корабль» заменяет корабль соединения выбранным (продаётся по цене увольнения / списания, экипаж теряет один уровень навыка).
lbl.Campaign/FixReserveSubmarines = Исправление подлодок на обслуживании
help.Campaign/FixReserveSubmarines = Исправляет ошибку игры с подлодкой, отправленной на перезарядку или ремонт. Она не теряется из Reserve при изменении состава (покупка, продажа, улучшение); пока она на обслуживании, она видна на закладке подлодок, как корабли в Reserve; уже потерянная подлодка возвращается в Reserve при загрузке карты кампании, и дальше игра сама вернёт её с обслуживания.
lbl.Campaign/EventShipState = Состояние кораблей на брифингах и газетах
unit.Campaign/EventShipState = после последней миссии
help.Campaign/EventShipState = Карта кампании: пока выбрано событие (брифинг, газета), Task Force показывает корабли такими, какими они вышли из последней миссии (игра показывает состояние до первой миссии: боезапас полный, повреждения устранены).
grp.Game UI = Интерфейс игры
grp.Diagnostics = Диагностика
grp.Mods = Моды
lbl.Debug/DumpXaml = Выгрузить XAML сейчас
help.Debug/DumpXaml = Для разработки: включение записывает XAML загруженных на данный момент ресурсов интерфейса игры в BepInEx/AlternativeGameInterface_xaml, после чего опция выключается сама (сначала откройте нужные окна).
lbl.Debug/Snapshot = Снять снимок сейчас
help.Debug/Snapshot = Дописывает состояние игры (время кадра, память, объекты по типам, ошибки в логе, коллекции мода) в BepInEx/AlternativeGameInterface_snapshots.txt и выключается сама. Снимите один до сохранения и один после загрузки, либо в начале и в конце долгой сессии: у каждого числа показано изменение с прошлого снимка.
lbl.Debug/ScreenshotTabs = Снять все закладки всех модов сейчас
help.Debug/ScreenshotTabs = Для диагностики: включение делает скриншот всего окна опций для каждой закладки (и каждой страницы) этого окна настроек, затем то же для окон остальных установленных модов rgreat, и сохраняет PNG в BepInEx/<Мод>_screens, затем выключается само. Окно настроек должно быть открыто.
lbl.Debug/CollectGarbage = Собрать мусор сейчас
help.Debug/CollectGarbage = Однократно запускает полную сборку мусора и выгрузку неиспользуемых ресурсов; память до и после пишется в лог BepInEx.
lbl.General/ModCreateFill = Заполнять Create Mod
unit.General/ModCreateFill = Update Existing
help.General/ModCreateFill = Окно Create Mod (меню Mods): при Update Existing выбор предмета Workshop сам заполняет Pick Folder (папка мода в StreamingAssets) и Pick Image (thumbnail.jpg из этой папки).
grp.Track State = Track State
lbl.UnitStatus/TrackState = Track State выбранного контакта
help.UnitStatus/TrackState = Окно Unit Status: пока выбран контакт другой стороны (трек, а не ваш юнит), окно показывает его Track State (окно сведений о контакте: статус, достоверность, обнаружения, сигнатуры) вместо пустоты.
lbl.UnitStatus/TrackLayout = Новая компоновка Track State
help.UnitStatus/TrackLayout = Track State: окно перекомпоновано - компактные факты, детекторы в прокручиваемой области ограниченной высоты, остальное место занимает таблица кандидатов. Выкл.: компоновка информационного окна игры.
lbl.Map/ClipContactEllipse = Обрезать овалы контактов
unit.Map/ClipContactEllipse = за спиной сенсора
help.Map/ClipContactEllipse = Карта: оценка положения контакта по пеленгам сжимается вдоль пеленга так, чтобы её овал не заходил за спину сенсора (на сторону, противоположную пеленгу). Значок, расстояние в подписи и овал следуют новой оценке. Данные самого трекера не меняются.
lbl.Map/CompactSonobuoys = Компактные сонобуи
unit.Map/CompactSonobuoys = вдвое меньше, без текста
help.Map/CompactSonobuoys = Карта: когда на карте одновременно видно много сонобуёв, их иконки становятся вдвое меньше, а текст убирается. При приближении, когда их остаётся меньше, они показываются как обычно.
lbl.Map/SonobuoysThreshold = Порог числа сонобуёв
unit.Map/SonobuoysThreshold = видимых одновременно
help.Map/SonobuoysThreshold = Компактные сонобуи: сколько сонобуёв, видимых на карте одновременно, включает компактный вид. Он выключается, когда число падает ниже 90% этого значения.
lbl.Map/GroupSpreadMiles = Предел разброса группы: корабли, наземные
unit.Map/GroupSpreadMiles = миль от лидера
help.Map/GroupSpreadMiles = Карта: юнит группы (корабли, наземные), который дальше этого числа морских миль от лидера, считается самостоятельным: у него своя подпись, и он не входит в рамку, вокруг которой ставится название группы.
lbl.Map/GroupSpreadMilesAir = Предел разброса группы: самолёты
unit.Map/GroupSpreadMilesAir = миль от лидера
help.Map/GroupSpreadMilesAir = Карта: то же для самолётов и вертолётов: юнит группы, летящий дальше этого числа морских миль от лидера, считается самостоятельным.
lbl.Map/FormationLines = Линии группы
unit.Map/FormationLines = от лидера к юнитам, при выделении
help.Map/FormationLines = Карта: при выделении юнита группы рисуются линии от лидера ко всем юнитам группы.
lbl.Map/AirGroupInfo = Группа самолётов: дальность и высота
unit.Map/AirGroupInfo = под названием
help.Map/AirGroupInfo = Карта: подпись невыделенной группы самолётов или вертолётов показывает под названием группы расстояние и высоту её лидера (действуют обычные правила подписей).
lbl.Map/FormationUpdateByLeader = Обновление группы по лидеру
unit.Map/FormationUpdateByLeader = самолёты двигаются вместе
help.Map/FormationUpdateByLeader = Карта: самолёты и вертолёты одной группы берут новые позиции на карте вместе, в моменты, когда её берёт лидер (игра делает это в случайные моменты, по одному юниту). Остальные позиции отстают до секунды.
lbl.Map/DrawingImprovements = Улучшенное рисование объектов и подписей
unit.Map/DrawingImprovements = общий выключатель
help.Map/DrawingImprovements = Карта: общий выключатель улучшенного рисования объектов и подписей (компактные сонобуи, расположение и фильтры подписей, линии групп, обрезка эллипсов контактов). Выкл: игра рисует как обычно, опции ниже скрыты.
lbl.Map/FriendlyBadgeInLabel = Метка FRND в подписи
unit.Map/FriendlyBadgeInLabel = отдельная строка
help.Map/FriendlyBadgeInLabel = Карта: метка FRND союзного юнита другой стороны пишется отдельной строкой над первой строкой его подписи, а не рисуется рядом со значком.
lbl.Map/LabelPlacement = Положение подписей
help.Map/LabelPlacement = Карта: где подпись юнита находится относительно иконки, по центру стороны (при тесноте она всё равно может сместиться). «Как в игре» — штатное размещение.
val.Map/LabelPlacement.Game = Как в игре
val.Map/LabelPlacement.Bottom = По центру снизу
val.Map/LabelPlacement.Top = По центру сверху
val.Map/LabelPlacement.Right = По центру справа
val.Map/LabelPlacement.Left = По центру слева
lbl.Map/GroupNameOnly = Только имя группы
unit.Map/GroupNameOnly = пока не выделена
help.Map/GroupNameOnly = Карта: юниты группы показывают только название группы, пока группа не выделена. Их собственные подписи добавляются последними, только там, где есть место (кроме самолётов и вертолётов).
lbl.Map/LabelOverlapFilter = Фильтр перекрытия подписей
unit.Map/LabelOverlapFilter = остаётся крупнейший
help.Map/LabelOverlapFilter = Карта: при наложении подписей кораблей или самолётов (и названий групп) остаётся подпись только самого крупного юнита или группы. Юнит неизвестного типа не вытесняет известный; при равном размере остаётся первая подпись. Если подпись не помещается, сначала убираются её строки (с последней); подпись убирается, только если перекрывается даже первая строка.
tab.Track State = Track State
lbl.UnitStatus/TrackIdentProgress = Прогресс идентификации
unit.UnitStatus/TrackIdentProgress = грубо, десятки процентов
help.UnitStatus/TrackIdentProgress = Track State: грубый прогресс идентификации контакта в десятках процентов (время наблюдения его излучателей вашим ESM к времени, которое игра тратит на их идентификацию). 100%, когда контакт идентифицирован. Только в новой компоновке и только пока контакт наблюдает какой-либо ваш ESM. Если ESM своё сделал, а класс всё ещё неизвестен, строка пишет «недостаточно данных»; скрывается, когда контакт идентифицирован.
track.identProgress = Прогресс идентификации
track.identNoData = недостаточно данных

; --- new ---
tab.Event Log = Журнал событий
grp.Links = Ссылки
lbl.EventLog/AllTracksAreLinks = Все контакты в журнале — ссылки
unit.EventLog/AllTracksAreLinks = номера треков
help.EventLog/AllTracksAreLinks = Каждый номер трека в журнале событий — ссылка, как те, что создаёт сама игра (Новый контакт, Трек классифицирован, Трек пропал и подобные в игре — обычный текст): щелчок выбирает объект, при CenterMapOnClick повторный щелчок центрирует карту на нём. Ссылками становятся только треки из собственного списка игрока.
lbl.EventLog/CenterMapOnClick = Центрировать карту при повторном щелчке
unit.EventLog/CenterMapOnClick = Карта
help.EventLog/CenterMapOnClick = Повторный щелчок по той же ссылке на контакт или юнит в журнале событий центрирует карту Tactical Display на нём (первый щелчок только выбирает, как в игре).
grp.Layout = Вид
lbl.EventLog/Compact = Компактный вид
unit.EventLog/Compact = меньше отступов
help.EventLog/Compact = Окно журнала событий: меньше поля, заголовки вкладок и промежутки между строками, так что строк помещается больше. Размер текста не меняется.
lbl.Camera/BinocularsBelowHorizon = Корабельный бинокль ниже горизонта
unit.Camera/BinocularsBelowHorizon = градусов · 0 = как в игре
help.Camera/BinocularsBelowHorizon = Корабельный бинокль (оптический вид судна): насколько градусов его можно опустить ниже горизонта. В игре он останавливается на горизонте. 0 = как в игре.
lbl.Camera/BinocularsNormalView = Обычный вид в бинокле на макс. увеличении
lbl.Camera/BinocularsNormalViewDayOnly = Обычный вид только днём
help.Camera/BinocularsNormalView = Бинокль на максимальном увеличении открывается с обычной картинкой (игра включает ночной / тепловой фильтр). Клавиша фильтра игры включает его.
help.Camera/BinocularsNormalViewDayOnly = Обычный вид по умолчанию только днём; ночью остаётся фильтр игры.
ref.propulsion = Двигатель
ref.pp.nuclear = Ядерный
ref.pp.steam = Паровой
ref.pp.gasturbine = Газовая турбина
ref.pp.diesel = Дизель
ref.pp.electric = Электро
ref.pp.aip = ВНЭУ
ref.hp = л.с.
lbl.UnitReference/ShowPropulsion = Двигатель в данных кораблей
help.UnitReference/ShowPropulsion = Unit Reference: ячейка «Двигатель» в основных параметрах кораблей и подводных лодок, после максимальной скорости: тип и мощность двигателей (главная и вспомогательная силовая установка). Действует со следующего показанного юнита.
ref.propulsion.tip = Двигатель: тип и мощность двигателей (главная и вспомогательная силовая установка)
lbl.UnitStatus/DamageListsWheel = Колесо листает списки секций
help.UnitStatus/DamageListsWheel = Окно Unit Status, вкладка Damage Control: списки повреждений секций (Aft ... Forward: затопления, пожары, повреждённые системы) листаются колесом мыши. Действует при следующем показе вкладки.
lbl.General/NoFrameLimit = Убрать лимит FPS
unit.General/NoFrameLimit = ползунок отключён
help.General/NoFrameLimit = Без лимита частоты кадров; ползунок выше отключён. При включённой вертикальной синхронизации частоту всё равно ограничивает экран (Alternative Game Interface).
lbl.General/AddAdaptiveVSync = Добавить адаптивный V-Sync
unit.General/AddAdaptiveVSync = в список V-Sync
help.General/AddAdaptiveVSync = Добавляет пункт «Adaptive V-Sync» в список V-Sync видео-настроек: вертикальная синхронизация включена, пока кадры успевают за экраном, и выключается, когда не успевают. Игра сохраняет его как обычный V-Sync, поэтому без мода она работает штатно.
grp.Performance = Производительность
grp.Text by background = Текст по фону
lbl.General/TextDarkAbove = Текст темнеет выше
lbl.General/TextLightBelow = Текст светлеет ниже
unit.General/TextDarkAbove = яркость 0 - 1
unit.General/TextLightBelow = яркость 0 - 1
help.General/TextDarkAbove = Окна с включённым контрастом текста и лента компаса окна World View: яркость картинки за текстом (0 = чёрный, 1 = белый), выше которой тексты темнеют. Меньше = тексты темнеют на более тёмных картинках.
help.General/TextLightBelow = Яркость картинки за текстом, ниже которой тёмные тексты снова светлеют (окна с контрастом текста, лента компаса). Не выше «Текст темнеет выше»; зазор между ними не даёт текстам мерцать на картинке такой яркости.

