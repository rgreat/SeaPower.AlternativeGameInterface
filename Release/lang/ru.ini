help.General/Language = Язык текстов мода: код одного из языков игры (en, ru ...); пусто = язык самой игры. Тексты лежат в файлах lang/<код>.ini в папке мода — правьте их, чтобы изменить перевод.
help.General/AllowDragOutside = Разрешить перетаскивать любое окно частично за пределы видимой области (левый, правый и нижний край).
help.General/MinVisiblePixels = При включённом AllowDragOutside: не менее стольких пикселей ширины окна остаются видимыми у левого/правого края. У нижнего края заголовок окна всегда остаётся видимым.
help.General/MaximizeOnDoubleClick = Двойной щелчок по заголовку окна разворачивает его на весь экран, повторный — возвращает прежний вид (для окон с изменяемым размером). Окно, закрытое развёрнутым, откроется развёрнутым (',max' после его раскладки в [Layouts]).
help.General/RemoveSizeLimits = Нет ограничений размера для запоминаемых окон (WindowPatterns, включая Unit Reference): ни минимального, ни максимального размера (вплоть до 100x60 px), и изменение размера за край не останавливается краями экрана (верх остаётся на экране, так что до заголовка можно дотянуться). Переключение сразу действует на окна на экране.
help.General/SnapWindows = Когда окно перетаскивают или меняют его размер мышью, его края притягиваются к краям других окон и экрана, если ближе, чем SnapDistance (видимые края, без невидимой зоны изменения размера вокруг окна).
help.General/SnapDistance = SnapWindows: на каком расстоянии край притягивается, в пикселях (1 - 50).
help.General/BringToFrontOnClick = Щелчок по окну выводит его поверх других; только что открытое окно тоже выходит наверх. Меняется порядок только окон, и только ниже уровня, выданного им игрой (Panel.ZIndex), так что всё, что показывает сама игра (брифинги, сообщения), остаётся выше. Развёрнутые Tactical Display / World View остаются ниже всех остальных окон.
help.General/CascadeOffset = Несколько окон одного шаблона открыты одновременно (например, Weapon Reference): первое сохраняет запомненную раскладку, и сохраняются только его изменения; каждое следующее открывается со сдвигом вправо и вниз на столько пикселей, сколько окон уже открыто (остаётся на экране, как перетаскиваемое окно). 0 = все открываются в сохранённом положении.
help.General/SettingsButton = Кнопка-шестерёнка в заголовке каждого запоминаемого окна (WindowPatterns) открывает окно настроек Alternative Game Interface.
help.Mission/UnitPanelMenu = Миссия: щелчок правой кнопкой по флагу или названию выбранного юнита в нижней панели юнита открывает то же меню, что и щелчок правой кнопкой по юниту на карте.
help.General/FixContactInfo = Окно Information контакта (кто обнаружил, каким датчиком, как давно): обнаружения «стареют» по тем же часам, которыми их помечает игра (игра смешивает двое часов, и в загруженной игре поля остаются пустыми).
help.General/HideCustomMission = Главное меню: файл редактора по умолчанию "_Custom Mission" не показывается в списке SCENARIOS.
help.General/ModBackgroundsOnly = Редактор миссий: окно выбора файла для открытия миссии начинается в папке миссии, открытой в прошлый раз.
help.MissionEditor/RememberMissionFolder = Фоновые картинки главного меню и экранов загрузки: если моды приносят свои (ui/backgrounds), показываются только они, не вперемешку с игровыми. Выкл = как в игре: случайная картинка из игровых и всех модовых вместе.
help.General/ColorIniFiles = Редактор миссий, окна выбора файлов: имена файлов *.ini светло-голубые.
help.Campaign/StrictLoadouts = Task Force Builder кампании: версии кораблей и снаряжения предлагаются только для кораблей, которые миссия называет доступными или которые у вас уже есть (игра предлагает ещё и каждый корабль с тем же тегом энциклопедии). Сохраняется вместе с кампанией; выбирается при старте новой кампании.
help.General/DeleteOldLogs = При запуске игры файлы журналов прошлых сеансов (папка Logs игры: *_session_*, *_sessionEventLog_*) удаляются; журналы текущего сеанса остаются.
help.General/Debug = Включает подробное протоколирование и файл BepInEx/AlternativeGameInterface.trace.txt.
help.General/WindowPatterns = Имена запоминаемых окон через запятую. Без учёта регистра, пробелы при сравнении игнорируются ('Unit Status*' подходит и к 'UnitStatusView'), '*' заменяет любой текст (и пустой). Шаблон сравнивается с именем окна, текстом заголовка, типом содержимого и типом view-model и должен совпасть с одной из этих строк с её начала ('Unit Reference*' подходит к 'Unit Reference - XYZ'; чтобы искать где угодно, используйте '*текст*'). Окна, подходящие под один шаблон, делят одну сохранённую раскладку.
help.General/AddWindowKey = Наведите курсор на окно и нажмите эту клавишу, чтобы добавить окно в WindowPatterns.
help.General/RememberOpenWindows = Шаблоны окон через запятую (правила те же, что у WindowPatterns), у которых запоминается состояние «открыто/закрыто»: после экрана загрузки (старт миссии, энциклопедия) эти окна открываются или закрываются так, как были оставлены. Состояние хранится в [OpenWindows]. Открыть можно только окна, которые игра уже создала (например, для Unit Status нужен выбранный юнит).
help.WindowBorder/Enabled = Тонкая рамка вокруг каждого окна, которое можно перетаскивать, по краю его видимой части. Рисуется поверх собственного вида окна; не меняет размер окна и не перехватывает мышь.
help.WindowBorder/Thickness = Толщина рамки в пикселях (0.5 - 10). У рамки нет верхней стороны (она шла бы под заголовком).
help.WindowBorder/Color = Цвет рамки: #RRGGBB или #AARRGGBB (AA = непрозрачность, 00 — прозрачный, FF — сплошной).
help.WindowBorder/ToolTips = Рамка и вокруг подсказок игры (всплывающих), со всех четырёх сторон, с толщиной и цветом, заданными выше.
help.UnitStatus/SectionsMinHeight = Окно Unit Status, вкладка Damage Control: минимальная высота панелей секций (Aft ... Forward с их списками повреждений) в пикселях экрана. Более низкое окно сжимает их до этой высоты; ниже вкладка перестаёт сжиматься, и панель 'Auto Damage Control Status' внизу уходит за пределы окна. 0 = как в игре (вся вкладка имеет фиксированный минимум; панели получают то, что оставляют другие строки, — показано в окне настроек).
help.UnitStatus/UnitReferenceTab = Окно Unit Status: вкладка "Reference" (последняя) со справочником выбранного юнита — его корабль / вариант и снаряжение — без дерева юнитов и панели поиска.
help.UnitStatus/FullUnitName = Окно Unit Status: полное имя юнита в заголовке (игра показывает короткое).
help.General/ImprovedUnitReferenceUI = Улучшения окна Unit Reference: скрытие дерева юнитов (кнопка '<' у левого края) скрывает и панель поиска / фильтров, делает окно уже на ширину дерева и сдвигает его вправо на столько же, так что информация о юните остаётся на месте и занимает освободившееся место сверху (показ дерева делает обратное; сохранённые раскладки хранят окно с показанным деревом); более широкое дерево юнитов с разделителем у правого края, который можно тянуть мышью (ширина хранится в [UnitReference] TreeWidth); выбранная страна запоминается ([UnitReference] Country). Действует на окна Unit Reference, открытые после изменения.
help.UnitReference/ShowLoadoutList = Unit Reference: показывать выбор снаряжения и для кораблей, подводных лодок и сухопутных юнитов с несколькими снаряжениями (игра показывает его только для авиации); информация о юните следует за выбранным снаряжением.
help.UnitReference/OptimizeTree = Дерево Unit Reference: классы юнитов одного типа отсортированы по дате поступления на службу; в группе класса за каждым юнитом идут его варианты снаряжения (по дате, Early первым) с подписью "Юнит [Вариант]" (без суффикса для Default или единственного варианта); юнит без снаряжения Default показывает только свои варианты. Действует на окна Unit Reference, открытые после изменения.
help.UnitReference/ScrollToSelected = Дерево Unit Reference: прокручивать дерево так, чтобы выбранный юнит был виден (по центру, когда окно открывается или дерево показано).
help.UnitReference/EarliestVariantOnClick = Дерево Unit Reference: щелчок по классу (узлу с несколькими вариантами) выбирает его самый ранний вариант. Игра выбирает вариант, находящийся на службе в год миссии, иначе самый поздний.
help.UnitReference/KeepOpenedUnit = Unit Reference: юнит, для которого открыто окно, остаётся в дереве вместе со своим классом, даже если фильтры страны / даты / поиска / «Только с оружием» его скрыли бы.
help.UnitReference/TreeWheelOnlyOver = Дерево Unit Reference: колесо мыши прокручивает дерево, только пока курсор над ним.
help.UnitReference/RememberSearchPanel = Панель поиска окна Unit Reference — категория, «фильтр по дате», «поиск только по имени» и текст поиска — хранится в .cfg (ключи ниже) и восстанавливается при открытии окна Unit Reference (с ImprovedUnitReferenceUI).
help.UnitReference/HideEmptyCountries = Unit Reference: список стран показывает только страны, у которых есть юниты для текущего текста поиска, «Фильтра по дате» и «Только с оружием» (выбранная страна показывается всегда).
help.UnitReference/SearchInDescriptionAndId = Unit Reference: при выключенном «Поиске только по имени» поиск находит юниты и по описанию, и по их ini-идентификатору (<Id>.ini).
help.UnitReference/LinkHelp = Unit Reference: подсказка с краткой справкой (началом описания) оружия, датчика или системы на выделенных ссылках, если она у них есть.

